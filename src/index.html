<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#78b4ee">
<title>Driftseed Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Special+Elite&family=Caveat:wght@500;700&display=swap">
<style>
/*@styles*/
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>

<div class="hud">
  <div><div class="clockb"><div class="wx" id="wxIco"></div><div class="t" id="timeTxt">7:00</div><div class="d" id="dayTxt">Day 1 · morning</div></div><div class="tidep" id="tideTxt" hidden></div><div class="loc" id="locTxt">Home</div></div>
  <div class="hud-r"><div class="chip"><img class="px" id="icoShell" alt="shells"><span id="shellTxt">0</span></div>
    <button class="chip lvl" id="lvlChip" aria-label="Island and settings"><img class="px" id="icoStar" alt=""><span class="lv"><span id="lvlTxt">Lv 1</span><i class="xpbar"><b id="xpFill"></b></i></span></button>
    <button class="nextup" id="nextUp" hidden></button>
    <button class="jrchip" id="jrChip" hidden aria-label="Today's journal"></button></div>
</div>
<div id="toasts"></div>
<div id="seamarks" hidden></div>
<div id="ctx" class="ctx"></div>
<div id="actionBar" class="actionbar" hidden><div class="tag" id="abTag"></div><div class="msg" id="abMsg"></div><div class="row" id="abRow"></div></div>

<!-- one bottom bar: your tools, plus a menu button that pops up the apps -->
<nav class="bar" id="bar" aria-label="Tools">
  <div class="tools" id="tools"></div>
  <button class="menubtn" id="bMenu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="10" height="10" rx="3.2" fill="#ff9f0a"/><rect x="15" y="3" width="10" height="10" rx="3.2" fill="#30d158"/><rect x="3" y="15" width="10" height="10" rx="3.2" fill="#0a84ff"/><rect x="15" y="15" width="10" height="10" rx="3.2" fill="#bf5af2"/></svg></button>
</nav>
<nav class="dock apps" id="apps" aria-label="Menu" hidden>
  <button class="btn" id="bBag" style="--c1:#ffb340;--c2:#ff8a00"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5.5 11a6.5 6.5 0 0 1 13 0v8a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2z"/><path d="M9.5 5.2V4.5a2.5 2.5 0 0 1 5 0v.7"/><path d="M8.5 14.5h7v4h-7z"/><path d="M12 14.5v1.5"/></svg></span><span class="lb">Bag</span></button>
  <button class="btn" id="bShop" style="--c1:#4cd98a;--c2:#1fae5b"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 9.5 5.6 4h12.8L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5.5 12v8h13v-8"/><path d="M10 20v-4.5h4V20"/></svg></span><span class="lb">Shop</span></button>
  <button class="btn" id="bTask" style="--c1:#ff8a7a;--c2:#ff4f5e"><span class="ico"><svg viewBox="0 0 24 24"><path d="m4 6.5 1.5 1.5L8 5.5"/><path d="m4 12.5 1.5 1.5L8 11.5"/><path d="m4 18.5 1.5 1.5L8 17.5"/><path d="M11 7h9M11 13h9M11 19h9"/></svg></span><span class="lb">Orders</span></button>
  <button class="btn" id="bChart" style="--c1:#5ac8fa;--c2:#0a84ff"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg></span><span class="lb">Sea Chart</span></button>
  <button class="btn" id="bDex" style="--c1:#c58af9;--c2:#8e5cf7"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M12 7.5c-2.2 0-3 2.4-1.5 4 1 1 1.5 1.5 1.5 2.5 0-1 .5-1.5 1.5-2.5 1.5-1.6.7-4-1.5-4z"/></svg></span><span class="lb" id="dexTxt">Islandex</span></button>
</nav>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Close">×</button></header>
  <div class="tabs" id="sheetTabs"></div>
  <div class="sbody" id="sheetBody"></div>
</section>
<div id="fade"></div>
<div id="boot"><h1>Driftseed Isle</h1><p id="bootMsg">washing ashore…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
/*@game*/
</body>
</html>
