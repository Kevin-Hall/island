<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#78b4ee">
<title>Driftseed Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Special+Elite&family=Caveat:wght@500;700&display=swap">
<style>
/*@styles*/
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>

<div class="hud">
  <div class="hud-l">
    <button class="chip lvl" id="lvlChip" aria-label="Island and settings"><img class="pix" id="icoStar" alt=""><span class="lv"><span id="lvlTxt">Lv 1</span><i class="xpbar"><b id="xpFill"></b></i></span></button>
    <button class="jrchip" id="jrChip" hidden aria-label="Today's journal"></button>
    <button class="nextup" id="nextUp" hidden></button>
  </div>
  <div class="hud-r"><div class="chip"><img class="pix" id="icoShell" alt="shells"><span id="shellTxt">0</span></div></div>
</div>
<div class="clockb"><div class="t" id="timeTxt">7:00</div><div class="wx" id="wxIco"></div><div class="d" id="dayTxt">Day 1 · morning</div><div class="sub"><span class="loc" id="locTxt">Home</span><span class="tidep" id="tideTxt" hidden></span></div></div>
<div id="toasts"></div>
<div id="seamarks" hidden></div>
<div id="ctx" class="ctx"></div>
<div class="decosel" id="decoSel" hidden></div>
<div class="decotray" id="decoTray" hidden></div>
<div class="chatveil" id="chatVeil"></div>
<div class="chared" id="charEd" hidden></div>
<div class="chat" id="chat" hidden><div class="copts" id="chatOpts" hidden></div><div class="cbox" id="chatBox"><span class="cname" id="chatName"></span><span class="csub" id="chatSub"></span><div class="ctext" id="chatText"></div><i class="cmore" id="chatMore" hidden></i></div></div>
<div id="actionBar" class="actionbar" hidden><div class="tag" id="abTag"></div><div class="msg" id="abMsg"></div><div class="row" id="abRow"></div></div>

<!-- one bottom bar: your tools, plus a menu button that pops up the apps -->
<!-- one tool button: tap it and every tool fans out in a ring around it -->
<div class="wheel" id="bar">
  <div class="ring" id="tools"></div>
  <button class="toolbtn" id="bTool" aria-label="Tools" aria-expanded="false"><img class="pix" id="icoTool" alt=""></button>
</div>
<div class="terraui" id="terraUI" hidden><span class="tl">Landscaping</span><div class="seg3"><button data-tm="raise">▲ Raise</button><button data-tm="lower">▼ Lower</button><button data-tm="water">≈ Water</button></div></div>
<div class="swimui" id="swimUI" hidden><div class="breath" id="breath" hidden><b></b></div><div class="dh" id="diveHint"></div><div class="row"><button class="swimb" id="bUp" aria-label="Swim up" hidden><img class="pix" id="icoUp" alt=""><span>Up</span></button><button class="swimb" id="bDive" aria-label="Dive (hold)"><img class="pix" id="icoDive" alt=""><span>Dive</span></button></div></div>
<nav class="appcol" id="apps" aria-label="Menu">
  <button class="btn" id="bBag" style="--c:#f3d3a8"><span class="ico"><img class="pix" id="icoBag" alt=""></span><span class="lb">Bag</span></button>
  <button class="btn" id="bShop" style="--c:#a6e3d8"><span class="ico"><img class="pix" id="icoShop" alt=""></span><span class="lb">Shop</span></button>
  <button class="btn" id="bTask" style="--c:#ffc9a3"><span class="ico"><img class="pix" id="icoTask" alt=""></span><span class="lb">Orders</span></button>
  <button class="btn" id="bChart" style="--c:#b7d7f7"><span class="ico"><img class="pix" id="icoChart" alt=""></span><span class="lb">Chart</span></button>
  <button class="btn" id="bDex" style="--c:#fac3cf"><span class="ico"><img class="pix" id="icoDex" alt=""></span><span class="lb" id="dexTxt">Dex</span></button>
</nav>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Close">×</button></header>
  <div class="tabs" id="sheetTabs"></div>
  <div class="sbody" id="sheetBody"></div>
</section>
<div id="fade"></div>
<div id="boot"><h1>Driftseed Isle</h1><p id="bootMsg">washing ashore…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
/*@game*/
</body>
</html>
