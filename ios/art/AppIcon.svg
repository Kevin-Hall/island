<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Driftseed Isle app icon: a seed sprouting as it drifts ashore. Source for ios/Driftseed/Assets.xcassets/AppIcon.appiconset/AppIcon.png (tools/ios-icon.mjs). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8ec"/>
      <stop offset="0.62" stop-color="#9fd2f6"/>
      <stop offset="0.62" stop-color="#2a86d6"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e2a8"/>
      <stop offset="1" stop-color="#e8c47e"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd85a"/>
      <stop offset="1" stop-color="#5cb23e"/>
    </linearGradient>
    <linearGradient id="seed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a4e"/>
      <stop offset="1" stop-color="#8a5228"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6ec6a"/>
      <stop offset="1" stop-color="#4caa36"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="790" cy="230" r="150" fill="url(#sun)"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="200" cy="250" rx="120" ry="44"/><ellipse cx="260" cy="222" rx="80" ry="56"/><ellipse cx="160" cy="232" rx="60" ry="40"/>
    <ellipse cx="850" cy="480" rx="90" ry="30"/><ellipse cx="890" cy="462" rx="56" ry="38"/>
  </g>
  <!-- the island -->
  <ellipse cx="512" cy="676" rx="360" ry="96" fill="#7fd0f0" opacity="0.7"/>
  <ellipse cx="512" cy="660" rx="320" ry="80" fill="url(#sand)"/>
  <ellipse cx="512" cy="632" rx="250" ry="62" fill="url(#grass)"/>
  <ellipse cx="460" cy="618" rx="120" ry="22" fill="#a8e46c" opacity="0.6"/>
  <!-- the sprouting seed -->
  <path d="M512 612 C 508 540, 500 470, 520 400" stroke="#4a9a32" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M520 410 C 430 420, 340 370, 300 280 C 400 260, 500 300, 520 410 Z" fill="url(#leaf)"/>
  <path d="M520 410 C 360 330 , 330 300, 300 280" stroke="#3e8e2c" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M518 380 C 600 400, 700 360, 748 262 C 640 236, 540 270, 518 380 Z" fill="url(#leaf)"/>
  <path d="M518 380 C 640 320, 700 290, 748 262" stroke="#3e8e2c" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.55"/>
  <ellipse cx="512" cy="632" rx="96" ry="70" fill="url(#seed)" transform="rotate(-12 512 632)"/>
  <ellipse cx="480" cy="606" rx="30" ry="16" fill="#e6b07a" opacity="0.8" transform="rotate(-24 480 606)"/>
  <!-- waves in front -->
  <path d="M0 760 Q 64 728 128 760 T 256 760 T 384 760 T 512 760 T 640 760 T 768 760 T 896 760 T 1024 760 V 1024 H 0 Z" fill="#2f8fe0"/>
  <path d="M0 772 Q 64 740 128 772 T 256 772 T 384 772 T 512 772 T 640 772 T 768 772 T 896 772 T 1024 772" stroke="#ffffff" stroke-width="16" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M-64 880 Q 0 850 64 880 T 192 880 T 320 880 T 448 880 T 576 880 T 704 880 T 832 880 T 960 880 T 1088 880 V 1024 H -64 Z" fill="#1f6fc4"/>
  <path d="M-64 892 Q 0 862 64 892 T 192 892 T 320 892 T 448 892 T 576 892 T 704 892 T 832 892 T 960 892 T 1088 892" stroke="#bfe6ff" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
