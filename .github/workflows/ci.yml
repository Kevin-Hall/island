name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # fails if src/ has a syntax error or index.html wasn't rebuilt after editing src/
      - run: npm run check
