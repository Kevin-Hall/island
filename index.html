<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Seaward Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D canvas upscaled with hard pixels; parchment UI floats over it (HUD top, prompts bottom). */
:root {
  --ink: #22252f;
  --paper: #f7eed3;
  --roof: #b4533a;
  --sky: #1f73e6;
  --gold: #f2c14e;
  --ui: "Pixelify Sans", "Lucida Console", "Courier New", monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--sky); color: var(--ink); overflow: hidden; }
body { font-family: var(--ui); touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--sky); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; }
#cv:active { cursor: grabbing; }

.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 6px; }
#hud { position: absolute; left: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
#hud .panel { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.star { color: var(--gold); -webkit-text-stroke: 1px var(--ink); font-size: 21px; line-height: 1; }
#tools { position: absolute; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; }
#tools button { font: 600 15px var(--ui); color: var(--ink); padding: 5px 10px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#prompt { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; padding: 10px 16px; font-size: 18px; line-height: 1.35; text-align: center; transition: opacity .35s; pointer-events: none; }
#prompt.off { opacity: 0; }
#toast { position: absolute; left: 50%; top: calc(62px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; font-size: 18px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .35s; }
#toast.off { opacity: 0; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(5vh + env(safe-area-inset-top, 0px)) 16px calc(6vh + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; text-align: center; gap: 12px; pointer-events: none; }
.screen > * { pointer-events: auto; }
.screen h1 { margin: 0; font-size: clamp(40px, 8.5vw, 88px); line-height: .95; font-weight: 700; color: var(--paper); letter-spacing: .02em; text-shadow: 3px 3px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 7px 0 var(--ink); text-wrap: balance; }
.screen p { margin: 0; max-width: 46ch; font-size: clamp(16px, 2.3vw, 20px); color: var(--paper); text-shadow: 2px 2px 0 var(--ink); text-wrap: balance; }
.screen .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.btn { font: 700 21px var(--ui); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); padding: 8px 24px; cursor: pointer; }
.btn:hover { background: #fff7de; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.keys { font-size: 15px !important; line-height: 1.9; }
kbd { font: inherit; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 3px; padding: 0 5px; text-shadow: none; }
#loading { font-size: 18px; color: var(--paper); text-shadow: 2px 2px 0 var(--ink); }

#touch { position: absolute; inset: 0; pointer-events: none; }
#stick { position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 116px; height: 116px; border-radius: 50%; background: rgba(247,238,211,.28); border: 3px solid rgba(34,37,47,.55); pointer-events: auto; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
#jump { position: absolute; right: 26px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 78px; height: 78px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 700 16px var(--ui); color: var(--ink); pointer-events: auto; }
#fade { position: absolute; inset: 0; background: #fff6dc; opacity: 0; pointer-events: none; transition: opacity 1s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden><div class="panel"><span class="star">★</span><span id="sealCount">0 / 5</span></div></div>
  <div id="tools">
    <button id="pixBtn" class="panel" type="button" title="Toggle pixel size (P)">Pixels: chunky</button>
    <button id="muteBtn" class="panel" type="button" title="Toggle sound (M)" hidden>Sound: on</button>
  </div>
  <div id="toast" class="panel off" aria-live="polite"></div>
  <div id="prompt" class="panel off" aria-live="polite"></div>

  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="jump" type="button">JUMP</button>
  </div>
  <div id="fade"></div>

  <div id="title" class="screen">
    <h1>The Seaward Keep</h1>
    <p>The gulls have scattered the five Star Seals that unlock the Keep. Walk the island and bring them home.</p>
    <div class="foot">
      <div id="loading">Raising the island…</div>
      <button class="btn" id="start" type="button" hidden>Set out</button>
      <p class="keys"><kbd>WASD</kbd> walk · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump · drag to look · <kbd>P</kbd> pixels · <kbd>M</kbd> sound</p>
    </div>
  </div>
  <div id="end" class="screen" hidden>
    <h1>The Keep is yours</h1>
    <p id="endStats"></p>
    <div class="foot"><button class="btn" id="again" type="button">Walk the island again</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 7;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
const rr = (a, b) => a + rnd() * (b - a);
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1 + 17, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3 + 9) * .2;
const C = h => new THREE.Color(h);

// =====================================================================
// Island shape (x east, z south; the Keep sits north at z ≈ -52)
// =====================================================================
const ridgeCX = z => 2 * Math.sin(z * 0.03);
const pathX = z => ridgeCX(z) + 0.9 * Math.sin(z * 0.11 + 1);
function hRidge(x, z) {
  if (z < -70 || z > 125) return -9;
  const t = clamp((z + 38) / 130, 0, 1);
  const Ht = lerp(11, 2.4, Math.pow(t, .8)), hw = lerp(8.5, 15, t);
  const d = Math.abs(x - ridgeCX(z)) / hw;
  let h = Ht * (1 - smooth(.4, 1.05, d)) - smooth(.95, 1.7, d) * 5;
  if (z > 100) h -= (z - 100) * .3;
  return h;
}
function hPlateau(x, z) { const d = Math.hypot(x / 22, (z + 51) / 15); return 11 * (1 - smooth(.8, 1.0, d)) - smooth(1, 1.5, d) * 5; }
function hBeach(x, z, cx, cz, rx, rz, top) { const d = Math.hypot((x - cx) / rx, (z - cz) / rz); return top - smooth(.45, 1, d) * (top + 1.2) - smooth(1, 1.8, d) * 5; }
function hShoal(x, z, cx, cz, rx, rz) { const d = Math.hypot((x - cx) / rx, (z - cz) / rz); return d < 1 ? -.16 - .12 * d : -.28 - (d - 1) * 5; }
function parts(x, z) {
  const g = Math.max(hRidge(x, z), hPlateau(x, z));
  const b = Math.max(
    hBeach(x, z, -24, 84, 20, 16, .9), hBeach(x, z, 24, 92, 16, 22, .9), hBeach(x, z, -15, 22, 9, 4.5, .6),
    hBeach(x, z, 15, 62, 7, 26, .7), hBeach(x, z, 28, -30, 14, 9, 1.0), hBeach(x, z, -28, 39, 4.5, 3.2, .8),
    hShoal(x, z, -22, 31, 9, 6.5));
  return [g, b];
}
function terrainH(x, z, noDip) {
  const [g, b] = parts(x, z);
  let h = Math.max(g, b, -9);
  if (h > .3) h += (fbm(x * .07 + 50, z * .07) - .5) * 1.2 * smooth(.3, 3, h);
  if (!noDip && h > .5) h -= 1.4 * Math.exp(-(((z - 42) / 1.1) ** 2)) * smooth(.5, 2, h);
  return h;
}
// walkable structures layered on top of the terrain
const QUAY = { x0: 20, x1: 40, z0: -36, z1: -24, y: 1.6 };
const PIER = { x0: 40, x1: 55, z0: -31, z1: -28, y: 1.3 };
const STAIRS = { x0: 1.5, x1: 20, z0: -32.5, z1: -29.5, top: 0 };
const BRIDGE = { z0: 40.3, z1: 43.7, y: 0 };
function groundH(x, z) {
  let h = terrainH(x, z);
  if (x >= QUAY.x0 && x <= QUAY.x1 && z >= QUAY.z0 && z <= QUAY.z1) h = Math.max(h, QUAY.y);
  if (x >= PIER.x0 && x <= PIER.x1 && z >= PIER.z0 && z <= PIER.z1) h = Math.max(h, PIER.y);
  if (x >= STAIRS.x0 && x <= STAIRS.x1 && z >= STAIRS.z0 && z <= STAIRS.z1) h = Math.max(h, lerp(STAIRS.top, QUAY.y, (x - STAIRS.x0) / (STAIRS.x1 - STAIRS.x0)));
  if (z >= BRIDGE.z0 && z <= BRIDGE.z1 && Math.abs(x - pathX(42)) < 1.5) h = Math.max(h, BRIDGE.y);
  return h;
}

// =====================================================================
// Renderer, scene, lights
// =====================================================================
const canvas = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
const FOG = C('#6aa8ea');
scene.fog = new THREE.Fog(FOG, 180, 1500);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 4000);

const hemi = new THREE.HemisphereLight(C('#cfe0ff'), C('#b0c48a'), 1.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(C('#fff4df'), 1.75);
sun.position.set(-60, 90, 55);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 110, bottom: -110, near: 10, far: 320 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.06;
scene.add(sun, sun.target);

const grad = new THREE.DataTexture(new Uint8Array([70, 150, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const matCache = new Map();
function toon(color, o = {}) {
  const key = color + JSON.stringify(o);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color: C(color), gradientMap: grad, ...o });
  matCache.set(key, m); return m;
}
function mesh(geo, color, o = {}, shadow = true) {
  const m = new THREE.Mesh(geo, typeof color === 'string' ? toon(color, o) : color);
  m.castShadow = shadow; m.receiveShadow = true; return m;
}
const noShadow = obj => { obj.traverse(o => { o.castShadow = false; }); return obj; };
const onLayer1 = obj => { obj.traverse(o => o.layers.set(1)); return obj; };

// =====================================================================
// Sky
// =====================================================================
const skyU = { top: { value: C('#1766de') }, hor: { value: C('#63aef2') }, glow: { value: C('#f7c690') }, glowAmt: { value: 0 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform vec3 top, hor, glow; uniform float glowAmt; varying vec3 vD;
    void main(){ float y = max(vD.y, 0.); vec3 c = mix(hor, top, pow(y, .55)); c = mix(c, glow, glowAmt * (1. - smoothstep(0., .35, y)));
    gl_FragColor = vec4(c, 1.); }`
}));
sky.renderOrder = -10; sky.frustumCulled = false; sky.layers.set(1);
scene.add(sky);

// =====================================================================
// Terrain
// =====================================================================
const TX0 = -90, TX1 = 90, TZ0 = -110, TZ1 = 140;
const terrain = (() => {
  const W = TX1 - TX0, D = TZ1 - TZ0, SX = 240, SZ = 333;
  const geo = new THREE.PlaneGeometry(W, D, SX, SZ);
  geo.rotateX(-Math.PI / 2);
  geo.translate((TX0 + TX1) / 2, 0, (TZ0 + TZ1) / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrainH(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal, col = new Float32Array(pos.count * 3);
  const gLight = C('#9ad052'), gMid = C('#6cb43d'), gDark = C('#3f8a33'), sand = C('#ecd392'), sandWet = C('#c8ad76'),
    rock = C('#a1917d'), rockDk = C('#7d6f61'), path = C('#dcc38c'), path2 = C('#c3a772'), seabed = C('#3b6f8c');
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), ny = nrm.getY(i);
    const [gH, bH] = parts(x, z);
    const n1 = fbm(x * .12, z * .12), n2 = hash(Math.floor(x * 1.3), Math.floor(z * 1.3));
    if (y < -.25) c.copy(sandWet).lerp(seabed, smooth(-.3, -3, y));
    else if (gH > 1.1 && gH >= bH - .1 && y > 1.1) {
      const top = smooth(.6, 1, ny) * smooth(2, 6, y);
      c.copy(gDark).lerp(gMid, smooth(1.1, 3.5, y)).lerp(gLight, top * (.35 + n1 * .6));
      if (n2 > .92) c.lerp(gLight, .5);
      const pw = 1.05 + (fbm(x * .5, z * .5) - .5) * 1.1;
      if (z > -41 && z < 99 && Math.abs(x - pathX(z)) < pw) c.copy(n2 > .5 ? path : path2);
      if (z < -37 && z > -44 && Math.abs(x) < 3.2) c.copy(path);
    } else {
      c.copy(sand).lerp(sandWet, smooth(.45, -.1, y));
      if (n2 > .9) c.lerp(sandWet, .5);
    }
    if (ny < .72 && y > .3) c.copy(n2 > .5 ? rock : rockDk);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: grad });
  mat.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
      varying vec3 vWP;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
        return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        float st = vn(vec2(vWP.x * 1.6, vWP.z * .45));
        float dt = h21(floor(vWP.xz * 7.0));
        diffuseColor.rgb *= .95 + .08 * step(.62, st);
        diffuseColor.rgb *= dt > .95 ? 1.07 : (dt < .04 ? .9 : 1.);`);
  };
  const m = new THREE.Mesh(geo, mat);
  m.receiveShadow = true; m.castShadow = true;
  return m;
})();
scene.add(terrain);

// heightmap for the water shader
const HM = (() => {
  const w = 256, d = 356, data = new Uint8Array(w * d * 4);
  for (let j = 0; j < d; j++) for (let i = 0; i < w; i++) {
    const x = lerp(TX0, TX1, (i + .5) / w), z = lerp(TZ0, TZ1, (j + .5) / d);
    const v = clamp((terrainH(x, z) + 4) / 8, 0, 1) * 255, k = (j * w + i) * 4;
    data[k] = v; data[k + 1] = v; data[k + 2] = v; data[k + 3] = 255;
  }
  const t = new THREE.DataTexture(data, w, d, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
})();

// =====================================================================
// Sea
// =====================================================================
const waterU = {
  hmap: { value: HM }, hb: { value: new THREE.Vector4(TX0, TZ0, TX1 - TX0, TZ1 - TZ0) }, time: { value: 0 },
  cDeep: { value: C('#1f4f9f') }, cMid: { value: C('#2e74c2') }, cShal: { value: C('#5cbad0') }, cFoam: { value: C('#e9f7f2') },
  cInk: { value: C('#27293a') }, cHor: { value: C('#24488f') }, tint: { value: C('#ffffff') }
};
const water = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000, 1, 1).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: waterU, fog: false,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform sampler2D hmap; uniform vec4 hb; uniform float time; uniform vec3 cDeep, cMid, cShal, cFoam, cInk, cHor, tint; varying vec3 vW;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
    void main(){
      vec2 uv = (vW.xz - hb.xy) / hb.zw;
      float h = -4.;
      if (uv.x > 0. && uv.x < 1. && uv.y > 0. && uv.y < 1.) h = texture2D(hmap, uv).r * 8. - 4.;
      float depth = -h;
      vec3 c = mix(cShal, cMid, smoothstep(.25, 1.6, depth));
      c = mix(c, cDeep, smoothstep(1.6, 4., depth));
      float w = vn(vW.xz * vec2(.09, .45) + vec2(time * .05, time * .12));
      float w2 = vn(vW.xz * vec2(.05, .25) - vec2(time * .03, 0.));
      c = mix(c, cShal, step(.74, w) * .28 * (1. - smoothstep(60., 400., length(vW.xz - cameraPosition.xz))));
      c = mix(c, cDeep * .85, step(.72, w2) * .25);
      float f = .09 + .04 * sin(time * 1.6 + vW.x * .15 + vW.z * .1);
      float ring = smoothstep(f + .05, f + .02, depth) * (1. - smoothstep(f - .01, f - .04, depth));
      c = mix(c, cFoam, clamp((1. - smoothstep(.02, .12, depth)) + ring * .8, 0., 1.));
      c = mix(c, cInk, 1. - smoothstep(.015, .04, depth));
      float sp = h21(floor(vW.xz * 1.5) + floor(time * 1.5));
      if (sp > .996 && depth > .5) c = mix(c, vec3(1.), .85);
      float dist = length(vW.xz - cameraPosition.xz);
      c = mix(c, cHor, smoothstep(150., 1400., dist));
      gl_FragColor = vec4(c * tint, 1.);
    }`
}));
water.receiveShadow = false;
scene.add(water);

// =====================================================================
// Props: rocks, bushes, trees, flowers
// =====================================================================
const colliders = [];   // {x, z, r}
const boxes = [];       // {x0, x1, z0, z1}
function rockGeo(detail, s) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position, seen = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = `${p.getX(i).toFixed(3)},${p.getY(i).toFixed(3)},${p.getZ(i).toFixed(3)}`;
    if (!seen.has(k)) seen.set(k, [rr(.75, 1.2), rr(.7, 1.1), rr(.75, 1.2)]);
    const [a, b, c] = seen.get(k);
    p.setXYZ(i, p.getX(i) * a * s[0], Math.max(-.3, p.getY(i)) * b * s[1], p.getZ(i) * c * s[2]);
  }
  g.computeVertexNormals();
  return g;

  if (state.mode === 'play') updateGame(dt);
  else if (state.mode === 'opening') updateOpening(dt);
  animateWizard(dt);
  for (const s of seals) if (!s.got) { s.mesh.rotation.y = state.t * 1.6 + s.i; s.mesh.position.y = s.y + Math.sin(state.t * 2.2 + s.i) * .18; }

}

function boot(data) {
  resize();
  placeRocks();
  placeFlora();
  buildKeep();
  buildHarbor();
  ship = buildShip();
  buildBridge();
  buildRowboat(-22, 76, .5);
  buildSign(4.2, 36);
  cypress(-13.2, -40.2, 11); cypress(13.8, -40.5, 10); cypress(-16.5, -45, 8); cypress(17, -47, 7.5);
  roundTree(-10.5, -37.5, 1.05); roundTree(9.5, -36.8, .95); roundTree(-8, -12, .9); roundTree(10, 8, 1); roundTree(-11, 55, .9);
  buildDistance();
  buildSeals();
  // perched gulls, like the white specks on posts, sign, roofs and masts in the painting
  for (const [x, z] of [[-19, 33], [-24.5, 44], [-16, 27], [26, 55], [42, -37]]) perchGull(post(x, z));
  perchGull(signTop);
  roofTips.forEach(v => perchGull(v, rnd() * 6.3, 1.4));
  buildFlock();
  resetRun(data);
  if (data && data.mode === 'play') { state.mode = 'play'; state.start = performance.now() - (data.elapsed || 0); $('title').hidden = true; $('hud').hidden = false; }
  else state.mode = 'title';
  camPos.copy(VISTA.pos); camLook.copy(VISTA.look);
  $('loading').hidden = true; $('start').hidden = false;
  window.claude?.hot?.snapshot?.(() => ({ mode: state.mode === 'play' ? 'play' : 'title', seals: seals.map(s => s.got), pos: [P.x, P.z], elapsed: performance.now() - state.start }));
  window.__game = { blocked: blockedAt, VISTA, camera, state, P, seals, groundH, setYaw: v => { yaw = v; }, setPitch: v => { pitch = v; }, SEAL_SPOTS };
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
