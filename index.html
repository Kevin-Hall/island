<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f5fc2">
<title>Driftseed Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --ink:#35232e; --paper:#f5ecd6; --paper2:#e9dcbd; --paper3:#dccca6;
  --leaf:#5e9a3a; --leaf-d:#3e6c2a; --sea:#2f5fc2; --gold:#f2c14a; --rose:#d8574a;
  --cream:#fff6e2; --muted:#7a6570;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#2f5fc2;}
body{
  font-family:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  color:var(--ink); font-size:15px;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;
  image-rendering:crisp-edges;image-rendering:pixelated;}
img.px{image-rendering:crisp-edges;image-rendering:pixelated}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.hud-r{justify-self:end}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;
  background:var(--paper);border:3px solid var(--ink);padding:3px 9px 3px 5px;
  box-shadow:inset -3px -3px 0 rgba(53,35,46,.12),inset 3px 3px 0 rgba(255,255,255,.6),0 3px 0 var(--ink);
  font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.chip img{width:26px;height:26px}
.lvl{flex-direction:row}
.lvl .lv{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.xpbar{display:block;width:54px;height:6px;background:var(--paper3);border:2px solid var(--ink)}
.xpbar b{display:block;height:100%;width:0;background:var(--leaf)}
.clock{text-align:center;color:var(--cream);text-shadow:0 2px 0 rgba(20,20,60,.45),0 0 1px rgba(20,20,60,.6)}
.clock .t{font-size:26px;font-weight:600;letter-spacing:.05em;line-height:1}
.clock .d{font-size:13px;white-space:nowrap;letter-spacing:.06em;margin-top:3px;opacity:.95}

/* ---------- Dock ---------- */
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;gap:5px;padding:5px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:0 4px 0 var(--ink);max-width:calc(100vw - 24px)}
.btn{position:relative;width:54px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:var(--paper2);border:2px solid var(--ink);padding:0;font-size:12px;line-height:1.1;
  box-shadow:inset -2px -3px 0 rgba(53,35,46,.14),inset 2px 2px 0 rgba(255,255,255,.55)}
.btn img{width:30px;height:30px}
.btn:active{transform:translateY(2px)}
.btn.on{background:#c7dd9a}
.btn.seed{background:#f3e0a8}
@media (max-width:380px){.btn{width:49px;font-size:11px}}
.btn.ready::after{content:'';position:absolute;top:3px;right:3px;width:10px;height:10px;background:var(--rose);border:2px solid var(--ink)}
.card img.sil{filter:brightness(0);opacity:.2}
.card .done{color:var(--leaf-d);font-weight:700}

/* ---------- Toasts / floats ---------- */
#toasts{position:fixed;z-index:6;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);
  padding:6px 12px;font-size:15px;max-width:340px;text-align:center;animation:tin .18s steps(3) both;display:flex;gap:8px;align-items:center}
.toast img{width:28px;height:28px}
.toast.rare{background:#fff3c4;border-color:#6a4a10;box-shadow:0 3px 0 #6a4a10,0 0 0 3px #f2c14a;font-weight:600}
.toast.out{animation:tout .3s steps(3) both}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:15px;color:var(--cream);
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);white-space:nowrap;animation:rise 1.2s steps(10) forwards}
.float.gold{color:#ffe07a}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}

/* ---------- Action bar ---------- */
.actionbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:min(420px,calc(100vw - 32px));box-sizing:border-box;
  background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 10px;
  display:flex;flex-direction:column;gap:8px}
.actionbar .msg{font-size:15px;text-align:center}
.actionbar .row{display:flex;gap:6px}
.actionbar .row button{flex:1}

.pbtn{background:var(--paper2);border:2px solid var(--ink);padding:9px 10px;font-size:15px;font-weight:600;
  box-shadow:inset -2px -3px 0 rgba(53,35,46,.14),inset 2px 2px 0 rgba(255,255,255,.55)}
.pbtn.go{background:var(--leaf);color:#fff;text-shadow:0 1px 0 var(--leaf-d)}
.pbtn.warn{background:var(--rose);color:#fff}
.pbtn:disabled{opacity:.45}
.pbtn:active:not(:disabled){transform:translateY(2px)}

/* ---------- Sheets ---------- */
.sheet{position:fixed;z-index:8;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;box-sizing:border-box;
  max-height:74%;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-bottom:0;
  box-shadow:0 -4px 0 rgba(53,35,46,.25);animation:sup .2s steps(4) both}
@keyframes sup{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 16px 8px;border-bottom:2px dashed var(--paper3)}
.sheet h2{margin:0;font-size:22px;flex:1;letter-spacing:.02em}
.sheet .x{width:40px;height:40px;background:var(--paper2);border:2px solid var(--ink);font-size:22px;line-height:1}
.tabs{display:flex;gap:6px;padding:10px 16px 0}
.tabs:empty{display:none}
.tab{flex:1;padding:8px;border:2px solid var(--ink);background:var(--paper2);font-weight:600}
.tab.on{background:var(--ink);color:var(--paper)}
.sbody{overflow:auto;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px);-webkit-overflow-scrolling:touch}
.note{font-size:14px;color:var(--muted);margin:0 0 10px;line-height:1.35}
.note b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.card{display:flex;gap:10px;align-items:center;text-align:left;background:var(--cream);border:2px solid var(--ink);padding:8px;
  box-shadow:0 2px 0 var(--ink)}
.card img{width:44px;height:44px;flex:none}
.card .nm{font-weight:700;font-size:15px}
.card .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.card.sel{background:#e4efc4;box-shadow:0 0 0 3px var(--leaf),0 2px 0 var(--ink)}
.card.lock{opacity:.5}
.card.wide{grid-column:1/-1}
.card .grow{flex:1;min-width:0}
.card .price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.shl{display:inline-flex;align-items:center;gap:3px}
.shl img{width:16px;height:16px}
.list{display:flex;flex-direction:column;gap:6px}
.sellall{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sellall .pbtn{flex:1}
.alm{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:86px repeat(6,1fr);gap:4px;align-items:center}
.arow .an{font-size:13px;font-weight:600;line-height:1.1}
.arow .an small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.acell{aspect-ratio:1;background:var(--cream);border:2px solid var(--paper3);display:flex;align-items:center;justify-content:center;position:relative}
.acell img{width:70%;height:70%}
.acell.no img{filter:brightness(0);opacity:.18}
.acell.done{border-color:var(--ink)}
.acell i{position:absolute;right:1px;bottom:0;font-style:normal;font-size:10px;font-weight:700}
.ahead{display:grid;grid-template-columns:86px repeat(6,1fr);gap:4px;font-size:10.5px;text-align:center;color:var(--muted);position:sticky;top:-12px;background:var(--paper);padding-block:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--paper3)}
.setrow:last-child{border-bottom:0}
.seg{display:flex;gap:4px}
.seg button{padding:7px 10px;border:2px solid var(--ink);background:var(--paper2);font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper)}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px;font-size:14px}
.stat b{font-size:18px}

/* variant looks for icons */
.v-giant{transform:scale(1.22)}
.v-golden{filter:sepia(1) saturate(5) hue-rotate(2deg) brightness(1.18) drop-shadow(0 0 2px #ffd34a)}
.v-crystal{filter:grayscale(.3) hue-rotate(170deg) saturate(1.4) brightness(1.35) drop-shadow(0 0 2px #9ae8ff);opacity:.9}
.v-moonlit{filter:grayscale(.6) sepia(.2) hue-rotate(190deg) saturate(2) brightness(1.1) drop-shadow(0 0 3px #8aa8ff)}
.v-rainbow{animation:rb 1.6s linear infinite}
@keyframes rb{from{filter:saturate(2) hue-rotate(0deg) drop-shadow(0 0 2px #fff)}to{filter:saturate(2) hue-rotate(360deg) drop-shadow(0 0 2px #fff)}}

#fade{position:fixed;inset:0;background:#10142e;z-index:9;opacity:0;pointer-events:none;transition:opacity .6s steps(6)}
#fade.on{opacity:1}
#boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:#2f5fc2;color:var(--cream);text-align:center;padding-inline:16px}
#boot h1{margin:0;font-size:38px;letter-spacing:.04em;text-shadow:0 3px 0 #1c3a8a}
#boot p{margin:0;font-size:15px;opacity:.9}
@media (prefers-reduced-motion:reduce){.toast,.sheet,.float{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>

<div class="hud">
  <div><button class="chip lvl" id="lvlChip" aria-label="Island and settings"><img class="px" id="icoStar" alt=""><span class="lv"><span id="lvlTxt">Lv 1</span><i class="xpbar"><b id="xpFill"></b></i></span></button></div>
  <div class="clock"><div class="t" id="timeTxt">morning</div><div class="d" id="dayTxt">Day 1 · 7:00</div></div>
  <div class="hud-r"><div class="chip"><img class="px" id="icoShell" alt="shells"><span id="shellTxt">0</span></div></div>
</div>
<div id="toasts"></div>
<div id="actionBar" class="actionbar" hidden><div class="msg" id="abMsg"></div><div class="row" id="abRow"></div></div>

<nav class="dock" aria-label="Tools">
  <button class="btn seed" id="bSeed" aria-label="Choose seed"><img class="px" id="seedImg" alt=""><span id="seedTxt">Turnip</span></button>
  <button class="btn" id="bMode" aria-label="Toggle farm or edit mode"><img class="px" id="modeImg" alt=""><span id="modeTxt">Farm</span></button>
  <button class="btn" id="bBag"><img class="px" id="icoBag" alt=""><span>Bag</span></button>
  <button class="btn" id="bShop"><img class="px" id="icoShop" alt=""><span>Shop</span></button>
  <button class="btn" id="bTask"><img class="px" id="icoTask" alt=""><span>Orders</span></button>
  <button class="btn" id="bBook"><img class="px" id="icoBook" alt=""><span>Almanac</span></button>
</nav>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Close">×</button></header>
  <div class="tabs" id="sheetTabs"></div>
  <div class="sbody" id="sheetBody"></div>
</section>
<div id="fade"></div>
<div id="boot"><h1>Driftseed Isle</h1><p id="bootMsg">washing ashore…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

if(!window.THREE){ document.getElementById('bootMsg').textContent='Could not load three.js — check your connection and reload.'; return; }

const FISH={

  dollar:{name:'Sand Dollar',price:60,w:10},star:{name:'Starfish',price:70,w:10},glass:{name:'Sea Glass',price:90,w:7},

};

const CANS=[{name:'Tin Can'},{name:'Copper Can',cost:700,lvl:2}];

const LAND_UP=[{cost:700,lvl:2},{cost:2200,lvl:4},{cost:6000,lvl:6},{cost:15000,lvl:8}];
const HOUSES=['Tent','Cabin','Cottage','Villa'];
const HOUSE_UP=[{cost:1200,lvl:3},{cost:5000,lvl:5},{cost:18000,lvl:7}];
const LV=[0,40,120,280,550,950,1500,2300,3400,5000,7500,11000];
const HOUSE_AT={x:-1,z:-3};   // 2x2 footprint anchor
const BIN_AT={x:1,z:-2};

/* =========================================================

    g.computeVertexNormals();
    _e.set(p.rx,p.ry,p.rz);_q.setFromEuler(_e);_v.set(p.x,p.y,p.z);_s.set(p.sx,p.sy,p.sz);_m.compose(_v,_q,_s);
    g.applyMatrix4(_m);gs.push([g,p.color]);total+=g.attributes.position.count;
  }

  for(const [g,color] of gs){

    const n=g.attributes.position.count;for(let i=0;i<n;i++){col[(o+i)*3]=_c.r;col[(o+i)*3+1]=_c.g;col[(o+i)*3+2]=_c.b;}

  out.setAttribute('position',new T.BufferAttribute(pos,3));out.setAttribute('normal',new T.BufferAttribute(nor,3));

  const mk=(list,top,colFn)=>{
    const im=new T.InstancedMesh(BOX,vcMatFlat,list.length);
    list.forEach(([x,z],i)=>{_m.compose(_v.set(x,(top-0.6)/2,z),_q.identity(),_s.set(1,top+0.6,1));im.setMatrixAt(i,_m);im.setColorAt(i,_c.set(colFn(x,z)));});

    let r=hasWindmill?1.15:1;if(C.night)r*=night?1:0;if(C.day)r*=night?0.4:1.4;const b=bonus.get(k);if(b&&b.bee)r*=1.3;if(weedSlow.has(k))r*=0.75;
    if(r<=0)continue;const s0=stageOf(c.p);c.p=Math.min(1,c.p+dt*r/C.grow);
    if(c.p>=1){const [x,z]=k.split(',').map(Number);c.v=rollVariant(x,z,c.m);if(out)out.push(c);
      if(!quiet){syncCrop(k);if(c.v!=='normal'){const V=VAR[c.v];toast(`A <b>${V.name} ${C.name}</b> is ready to harvest!`,'rare',seedIcon(c.t),c.v);SFX.rare();burst(x,0.9,z,0xfff0a0,14,1.4,0.07,2);}else SFX.pop();}}

function farmTap(x,z){
  const f=fixedAt(x,z);
  if(f==='bin'){walkTo(x,z);openSheet('bag');return;}
  if(f==='house'){walkTo(HOUSE_AT.x+0.5,HOUSE_AT.z+2);houseTap();return;}

  if(!t){if(type!=='grass'){toast('Sand is too loose to farm — try the grass.');SFX.no();return;}
    S.tiles[k]={w:S.rain?1:0,crop:null};rebuildSoil();SFX.till();burst(x,0.6,z,0x8a5a3a,8,1.2,0.07);walkTo(x,z);vil.hop=0.25;return;}

    if(S.tut===1){S.tut=1.5;setTimeout(()=>toast('Watered soil stays wet until the next dawn. Crops ripen while you play.','',ICON.sprout),600);}return;}
  if(c.td!==S.day){c.td=S.day;const s0=stageOf(c.p);c.p=Math.min(0.995,c.p+0.08);if(stageOf(c.p)!==s0)syncCrop(k);hearts(x,0.9,z);tone(880,0.08,'triangle',0.04);setTimeout(()=>tone(1175,0.1,'triangle',0.035),70);walkTo(x,z);vil.hop=0.25;
    floatText(x,1.2,z,'tended +8%');return;}
  let hint='';if(C.night&&!isNight())hint=' · blooms only at night';if(C.day&&isNight())hint=' · slow at night';

/* =========================================================
   Input: tap, drag-rotate, pinch-zoom, two-finger pan
   ========================================================= */
const ray=new T.Raycaster(),ndc=new T.Vector2();
function pick(cx,cy){ndc.set(cx/window.innerWidth*2-1,-(cy/window.innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([grassIM,sandIM,soilIM,cropRoot,objRoot,lifeRoot],true);
  for(const h of hits){const o=h.object;
    if(o===grassIM)return{x:grassIds[h.instanceId][0],z:grassIds[h.instanceId][1]};
    if(o===sandIM)return{x:sandIds[h.instanceId][0],z:sandIds[h.instanceId][1]};
    if(o===soilIM){const s=soilIds[h.instanceId];if(s)return{x:s[0],z:s[1]};continue;}
    let p=o;while(p&&!p.userData.tile)p=p.parent;if(p)return p.userData.tile;}
  return null;}
function onTap(cx,cy){
  if(fishing){reel();return;}
  const hit=pick(cx,cy);
  if(placing){if(hit)moveGhost(hit.x,hit.z);return;}
  if(tapLife(cx,cy)){clearAction();updateHUD();return;}
  if(!hit){clearAction();const w=waterPoint(cx,cy);if(w&&!isLand(Math.round(w.x),Math.round(w.z)))startFishing(w.x,w.z);return;}
  if(!$('actionBar').hidden)clearAction();
  cursorAt(hit.x,hit.z);
  {const wd=weedAt(hit.x,hit.z);if(wd){pullWeed(wd);updateHUD();return;}const fd=findAt(hit.x,hit.z);if(fd){collectFind(fd);updateHUD();return;}}
  if(S.mode==='edit')editTap(hit.x,hit.z);else farmTap(hit.x,hit.z);
  updateHUD();}
const ptrs=new Map();let drag=null,pinch=null;
function pinchInfo(){const [a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,btn:e.button};
  else if(ptrs.size===2){if(drag)drag.moved=true;const p=pinchInfo();pinch={d0:p.d,z0:cam.zoom,mx:p.mx,my:p.my};}
  if(!AC||!waves){ac();if(S.sound)startWaves();}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const p=pinchInfo();cam.zoom=clamp(pinch.z0*pinch.d0/p.d,2.5,24);panBy(p.mx-pinch.mx,p.my-pinch.my);pinch.mx=p.mx;pinch.my=p.my;applyCam();return;}
  if(ptrs.size===1&&drag){const dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;drag.lx=e.clientX;drag.ly=e.clientY;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>9)drag.moved=true;
    if(drag.moved){if(drag.btn===2||e.shiftKey)panBy(dx,dy);else{cam.yaw-=dx*0.009;cam.pitch=clamp(cam.pitch+dy*0.005,0.38,1.25);}applyCam();}}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;const wasOne=ptrs.size===1;ptrs.delete(e.pointerId);
  if(wasOne&&drag&&!drag.moved&&e.type==='pointerup')onTap(e.clientX,e.clientY);
  if(ptrs.size<2)pinch=null;if(ptrs.size===1){const p=[...ptrs.values()][0];drag={sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:true,btn:0};}if(ptrs.size===0)drag=null;}

function panBy(dx,dy){const s=cam.zoom*2/window.innerHeight;const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
  const k=1/Math.max(0.35,Math.sin(cam.pitch));cam.tx=clamp(cam.tx-(rx*dx*s)+(fx*dy*s*k),-12,12);cam.tz=clamp(cam.tz-(rz*dx*s)+(fz*dy*s*k),-12,12);}

function pickW(table,filter=()=>true,wf=(k,v)=>v.w){let tot=0;const en=[];for(const k in table){if(!filter(k))continue;const w=wf(k,table[k]);if(w>0){en.push([k,w]);tot+=w;}}
  let r=Math.random()*tot;for(const [k,w] of en){if((r-=w)<=0)return k;}return en.length?en[en.length-1][0]:null;}
function itemInfo(key){if(key.startsWith('f:'))return FISH[key.slice(2)];if(key.startsWith('b:'))return BUGS[key.slice(2)];if(key.startsWith('g:'))return FINDS[key.slice(2)];return null;}
function nameOf(key){const I=itemInfo(key);if(I)return I.name;if(key.startsWith('c:'))return CROPS[key.slice(2)].name;const [t,v]=key.split('|');return(VAR[v].name?VAR[v].name+' ':'')+CROPS[t].name;}

function findGroup(k,seed){const p=[],g=new T.Group();
  switch(k){

    if(f.dipT>0){f.dipT-=dt;dip=0.05;}
    bobber.position.set(f.px,Math.sin(tt*2.2)*0.015-dip,f.pz);
    if(f.t>=f.wait){f.state='bite';f.t=0;SFX.bite();burst(f.px,0.05,f.pz,0xffffff,14,1.4,0.07,5);floatText(f.px,0.8,f.pz,'!','gold');}}
  else if(f.state==='bite'){bobber.position.set(f.px+Math.sin(tt*40)*0.02,-0.13,f.pz);
    if(f.t>f.win){fishShadow.visible=false;endFishing('It got away…');return;}}
  const pa=lineGeo.attributes.position.array;pa[0]=TIP.x;pa[1]=TIP.y;pa[2]=TIP.z;pa[3]=bobber.position.x;pa[4]=bobber.position.y+0.18;pa[5]=bobber.position.z;lineGeo.attributes.position.needsUpdate=true;}
const _plane=new T.Plane(new T.Vector3(0,1,0),0),_hit=new T.Vector3();
function waterPoint(cx,cy){ndc.set(cx/window.innerWidth*2-1,-(cy/window.innerHeight)*2+1);ray.setFromCamera(ndc,camera);return ray.ray.intersectPlane(_plane,_hit)?_hit:null;}

/* ---- daily orders ---- */
function cropOrder(id){const C=CROPS[id],n=C.price<60?4:C.price<200?3:2;return{k:'c:'+id,n,reward:Math.round(C.price*n*1.8),xp:Math.round(C.price*n/20)+3};}
function makeOrders(){const lv=level(),un=CROP_IDS.filter(id=>CROPS[id].lvl<=lv);const o=[cropOrder(pickR(un))];
  if(Math.random()<0.5){let c=pickR(un);if(un.length>1)while('c:'+c===o[0].k)c=pickR(un);o.push(cropOrder(c));}
  else{const k=pickW(FINDS,k=>FINDS[k].w>=7),n=FINDS[k].w>=14?3:2;o.push({k:'g:'+k,n,reward:Math.round(FINDS[k].price*n*2.4+40),xp:6});}
  if(Math.random()<0.6){const k=pickW(FISH,k=>FISH[k].w>=6&&!FISH[k].junk&&!FISH[k].rain);o.push({k:'f:'+k,n:1,reward:Math.round(FISH[k].price*2.4+60),xp:10});}
  else{const k=pickW(BUGS,k=>BUGS[k].w>=9);o.push({k:'b:'+k,n:1,reward:Math.round(BUGS[k].price*2.4+60),xp:10});}
  S.orders=o;S.ordBonus=0;}
const TAKE_ORDER=['normal','giant','moonlit','golden','crystal','rainbow'];
function orderHave(o){if(o.k.startsWith('c:')){const t=o.k.slice(2);return TAKE_ORDER.reduce((s,v)=>s+(S.inv[t+'|'+v]||0),0);}return S.inv[o.k]||0;}
function take(key,n){S.inv[key]-=n;if(S.inv[key]<=0)delete S.inv[key];}
function deliver(i){const o=S.orders[i];if(!o||o.done||orderHave(o)<o.n)return;let n=o.n;
  if(o.k.startsWith('c:')){const t=o.k.slice(2);for(const v of TAKE_ORDER){const key=t+'|'+v,h=Math.min(n,S.inv[key]||0);if(h){take(key,h);n-=h;}if(!n)break;}}else take(o.k,n);
  o.done=1;S.shells+=o.reward;S.earned+=o.reward;addXP(o.xp);SFX.coin();toast(`Order delivered: +${fmt(o.reward)} shells`,'',ICON.shell);
  if(S.orders.every(q=>q.done)&&!S.ordBonus){S.ordBonus=1;const b=100+level()*60;S.shells+=b;S.free.mystery=(S.free.mystery||0)+1;
    setTimeout(()=>{SFX.level();toast(`All of today's orders done! Bonus +${fmt(b)} shells and a free Mystery Seed.`,'rare',ICON.mystery);},500);}}
function ordersReady(){return S.orders.some(o=>!o.done&&orderHave(o)>=o.n);}

let lifeT=4,bugT=2,crowT=40;
function updateLife(dt,tt){
  lifeT-=dt;if(lifeT<=0){lifeT=6;if(Math.random()<0.28)spawnFind();if(Math.random()<0.2)spawnWeed();}
  bugT-=dt;if(bugT<=0){bugT=4+Math.random()*5;spawnBug();}
  crowT-=dt;if(crowT<=0){crowT=55+Math.random()*50;spawnCrow();}
  for(const f of S.finds)if(Math.random()<dt*0.4)sparkle(f.x,topY(f.x,f.z)+0.15,f.z,0xf4f8ff);
  updateBugs(dt,tt);updateCrow(dt,tt);updateFishing(dt,tt);}
function tapLife(cx,cy){
  if(crow&&crow.state!=='out'){const [sx,sy]=screenOf(crowG.position.x,crowG.position.y+0.15,crowG.position.z);if(Math.hypot(sx-cx,sy-cy)<50){shooCrow();return true;}}
  let best=null,bd=46;for(const b of bugs){if(b.out)continue;const [sx,sy]=screenOf(b.g.position.x,b.g.position.y,b.g.position.z);const d=Math.hypot(sx-cx,sy-cy);if(d<bd){bd=d;best=b;}}
  if(best){catchBug(best);return true;}return false;}

/* =========================================================
   New island setup
   ========================================================= */
function setupNew(){
  S.land=0;buildTerrain();
  S.objs=[];const add=(k,x,z,r=0)=>{if(isLand(x,z)&&!fixedAt(x,z)&&!objAt(x,z)&&!S.tiles[K(x,z)])S.objs.push({id:S.nextId++,k,x,z,r});};
  for(const [x,z] of [[-1,0],[0,0],[1,0],[-1,1],[0,1],[1,1]])S.tiles[K(x,z)]={w:1,crop:null};
  S.tiles[K(-1,0)].crop={t:'turnip',p:0.55,v:null,m:0};S.tiles[K(0,0)].crop={t:'turnip',p:0.2,v:null,m:0};
  add('pine',2,-3);add('pine',3,-2);add('flowers',2,1);add('rock',-3,-1);
  const sand=sandIds.filter(([x,z])=>x<-2&&z>0).slice(0,2);sand.forEach(([x,z])=>add('cattail',x,z));
  S.hour=7.2;S.demand='carrot';S.rain=false;
  S.finds=[];S.weeds=[];for(let i=0;i<3;i++)spawnFind(true);for(let i=0;i<2;i++)spawnWeed(true);makeOrders();
}

/* =========================================================
   Main loop
   ========================================================= */
let last=performance.now(),tt=0,saveT=0,hudT=0,wakeT=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;tt+=dt;
  advance(dt,false);
  rainMix=clamp(rainMix+(S.rain?dt:-dt)*0.5,0,1);
  applyTime();
  // villager
  const dx=vil.tx-vil.x,dz=vil.tz-vil.z,d=Math.hypot(dx,dz);
  if(d>0.04){const sp=Math.min(d,dt*2.8);vil.x+=dx/d*sp;vil.z+=dz/d*sp;villager.rotation.y=Math.atan2(dx,dz);}
  else if(!fishing){vil.idle+=dt;if(vil.idle>7+Math.random()*4){vil.idle=0;const tx=Math.round(vil.x+(Math.random()-0.5)*5),tz=Math.round(vil.z+(Math.random()-0.5)*5);if(isLand(tx,tz)&&!objAt(tx,tz)&&!fixedAt(tx,tz)){vil.tx=tx+(Math.random()-0.5)*0.4;vil.tz=tz+(Math.random()-0.5)*0.4;}}}
  const ty=topY(Math.round(vil.x),Math.round(vil.z))||0.3;vil.y=lerp(vil.y,ty,Math.min(1,dt*10));vil.hop=Math.max(0,vil.hop-dt);
  villager.position.set(vil.x,vil.y+(d>0.04?Math.abs(Math.sin(tt*14))*0.07:0)+Math.sin(vil.hop/0.3*Math.PI)*0.25*(vil.hop>0),vil.z);
  // crops sway
  for(const {g} of cropMeshes.values())g.rotation.z=Math.sin(tt*1.6+g.userData.ph)*0.035;
  for(const {g,v,s} of cropMeshes.values())if(s===3&&v&&v!=='normal'&&Math.random()<dt*1.6)sparkle(g.position.x,0.8,g.position.z,v==='golden'?0xffe27a:v==='crystal'?0xbff4ff:v==='moonlit'?0xc8d4ff:0xffffff);
  rainbowMat.color.setHSL((tt*0.25)%1,0.85,0.6);rainbowMat.emissive.setHSL((tt*0.25)%1,0.9,0.18);
  for(const a of anims)a(tt,dt);
  updateLife(dt,tt);
  // sprinklers spray at dawn
  if(sprayT>0){sprayT-=dt;for(const o of S.objs)if(o.k==='sprinkler'&&Math.random()<0.8){const a=Math.random()*6.28;emit(o.x,topY(o.x,o.z)+0.4,o.z,{vx:Math.cos(a)*1.6,vy:1.6,vz:Math.sin(a)*1.6,life:0.6,max:0.6,size:0.05,color:0x9ad0ff,g:6});}}
  // clouds, gulls, boat
  for(const c of clouds){c.position.x+=dt*c.userData.sp;if(c.position.x>34)c.position.x=-34;}
  const day=1-nightF;
  for(const g of gulls){const u=g.userData,a=tt*u.sp+u.ph;g.visible=day>0.3;g.position.set(Math.cos(a)*u.r,u.y+Math.sin(tt*0.7+u.ph)*0.3,Math.sin(a)*u.r*0.8);g.rotation.y=-a;g.rotation.z=0.25;
    const f=Math.sin(tt*7+u.ph)*0.5;u.wl.rotation.z=f;u.wr.rotation.z=-f;}
  {const a=tt*0.03,r=21;sailboat.position.set(Math.cos(a)*r,Math.sin(tt*1.3)*0.03,Math.sin(a)*r*0.8);sailboat.rotation.y=-a;sailboat.rotation.z=Math.sin(tt*0.9)*0.04;
    if(Math.random()<dt*9)emit(sailboat.position.x-Math.cos(a+1.57)*0.9+(Math.random()-0.5)*0.3,0.03,sailboat.position.z-Math.sin(a+1.57)*0.72+(Math.random()-0.5)*0.3,{life:2.2,max:2.2,size:0.14,color:0xe8f0ff});}
  if(rowboat){rowboat.position.y=Math.sin(tt*1.5)*0.03;rowboat.rotation.z=Math.sin(tt*1.1)*0.05;}
  // glints
  for(let i=0;i<GLINTS;i++){const g=glintData[i];if(!g)continue;const s=Math.pow(Math.max(0,Math.sin(tt*g.sp+g.ph)),6);_e.set(0,cam.yaw,0);_q.setFromEuler(_e);
    _m.compose(_v.set(g.x,0.02,g.z),_q,_s.set(s,1,s));glints.setMatrixAt(i,_m);}
  glints.instanceMatrix.needsUpdate=true;
  // fireflies
  if(nightF>0.05){const pa=ffGeo.attributes.position.array;ffData.forEach((f,i)=>{pa[i*3]=f.x+Math.sin(tt*0.6+f.ph)*0.7;pa[i*3+1]=0.9+Math.sin(tt*1.3+f.ph*2)*0.4;pa[i*3+2]=f.z+Math.cos(tt*0.5+f.ph)*0.7;});ffGeo.attributes.position.needsUpdate=true;}
  fireflies.visible=nightF>0.05;
  // rain
  rain.visible=rainMix>0.02;rain.material.opacity=0.6*rainMix;
  if(rain.visible){const pa=rainGeo.attributes.position.array;for(let i=0;i<RAIN;i++){const r=rainData[i];r.y-=dt*16;r.x+=dt*2;if(r.y<0){r.y=12+Math.random()*2;r.x=cam.tx+(Math.random()-0.5)*30;r.z=cam.tz+(Math.random()-0.5)*30;}
    pa[i*6]=r.x;pa[i*6+1]=r.y;pa[i*6+2]=r.z;pa[i*6+3]=r.x-0.08;pa[i*6+4]=r.y+0.5;pa[i*6+5]=r.z;}rainGeo.attributes.position.needsUpdate=true;}
  // cursor
  if(cursorT>0){cursorT-=dt;cursor.visible=cursorT>0;cursor.position.y=(topY(Math.round(cursor.position.x),Math.round(cursor.position.z))||0.3)+0.1+Math.abs(Math.sin(tt*5))*0.04;}
  updateParticles(dt);
  // HUD
  hudT-=dt;if(hudT<=0){hudT=0.5;updateHUD();}
  tickShells(dt);
  saveT+=dt;if(saveT>5){saveT=0;save();}
  // render: scene -> low-res target -> post shader -> canvas
  renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(post.scene,post.cam);
  requestAnimationFrame(frame);
}

/* =========================================================
   Boot
   ========================================================= */
$('icoShell').src=ICON.shell;$('icoStar').src=ICON.star;$('icoBag').src=ICON.bag;$('icoShop').src=ICON.shop;$('icoBook').src=ICON.book;$('icoTask').src=ICON.task;
if(isNew)setupNew();
buildTerrain();syncObjs();rebuildSoil();if(!S.orders.length)makeOrders();syncLife();
let away=[];if(!isNew){const el=clamp((Date.now()-S.t)/1000,0,3*3600);if(el>5)away=simulate(el);}
syncAllCrops();resize();fitZoom();applyCam();
try{makeThumbs();}catch(e){console.warn(e);}
vil.x=vil.tx=0.3;vil.z=vil.tz=2.1;
shownShells=S.shells;$('shellTxt').textContent=fmt(S.shells);updateHUD();applyTime();
window.addEventListener('resize',()=>{resize();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const el=clamp((Date.now()-S.t)/1000,0,3*3600);if(el>5){const out=simulate(el);afterSim(out,'While you were away');}last=performance.now();}});
window.addEventListener('pagehide',save);
$('boot').remove();
if(isNew){setTimeout(()=>toast('Welcome to Driftseed Isle! Tap empty soil to plant a turnip, and tap ripe crops to harvest.','',ICON.sprout),500);
  setTimeout(()=>toast('Tap grass to till it. Drag to spin, pinch to zoom.','',ICON.sprout),3800);}
else if(S.tut<4)setTimeout(()=>toast('New: tap the sea to fish, pick up beach finds, catch butterflies, and check Orders!','',ICON.rod),800);
else if(away.length)afterSim(away,'While you were away');
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
