/* ---- tides: two highs and two lows a day; low tide uncovers tide-pool creatures ---- */
let tideY=0,lowTide=null;
const tideAt=t=>0.045*Math.cos((t-3)/12.4*Math.PI*2)-0.03;/* t: absolute hours on the island clock, so the tides drift about 50 minutes later each day */
const tideNow=()=>gameNow()/3600000;
function updateTides(){tideY=tideAt(tideNow());const low=tideY<-0.055;
  water.position.y=tideY;for(const isl of islands)if(isl.flats&&isl.group&&isl.group.visible)for(const m of isl.flats)m.position.y=tideY;
  if(low!==lowTide){const boot=lowTide===null;lowTide=low;const isl=S.sea?null:curIsl();
    if(!low&&S.finds.some(f=>f.tide)){S.finds=S.finds.filter(f=>!f.tide);syncLife();}
    tideTurn(low,low?isl:null,boot);/* 79b: the sweep, the pools opening */}}
/* =========================================================
   The island's heartbeat: the tide as an event (a countdown, a sweep across the screen when it turns, tide pools that
   open with rare finds only then), a morning report of what changed while you were away, tomorrow's forecast for the
   diary, and the chance rewards: golden fish shadows, shiny forage. Also `buzz`, a tiny haptic tap where supported.
   ========================================================= */
function buzz(ms=8){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

// ---- tides: when's the next turn? (the tide runs on absolute hours, so it shifts about 50 minutes a day) ----
const LOW_Y=-0.055;
const tideLowT=t=>tideAt(t)<LOW_Y;
// minutes until the tide next turns, stepping forward five minutes at a time
function tideNext(){const t0=tideNow(),low=tideLowT(t0);for(let i=1;i<=170;i++)if(tideLowT(t0+i*5/60)!==low)return{low,min:i*5};return{low,min:0};}
function fmtMin(m){return m<60?`${m}m`:`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;}
// when low tide starts on a given day (0 today, 1 tomorrow), as clock hours
function lowTimes(dd){const mid=tideNow()-S.hour+dd*24,out=[];let prev=tideLowT(mid);for(let m=10;m<24*60;m+=10){const l=tideLowT(mid+m/60);if(l&&!prev)out.push(m/60);prev=l;}return out;}
let tideWarned=false,tideSig='';
const WAVE_SVG='<svg viewBox="0 0 24 24"><path d="M2 14c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function tideHUD(){const el=$('tideTxt');if(!el)return;if(S.sea||inside||!S.home&&!S.scratch){el.hidden=true;return;}const t=tideNext();
  const txt=t.low?`Low tide · ${fmtMin(t.min)} left`:`Low tide in ${fmtMin(t.min)}`,soon=!t.low&&t.min<=10;
  const sig=txt+soon+t.low;if(sig!==tideSig){tideSig=sig;el.innerHTML=WAVE_SVG+`<span>${txt}</span>`;el.classList.toggle('low',t.low);el.classList.toggle('soon',soon);}el.hidden=false;
  if(soon&&!tideWarned){tideWarned=true;say('The tide is going out soon… the pools will open up.');}if(!soon)tideWarned=false;}
// the moment it turns: a wave sweeps across the screen, and at low tide the pools open with creatures that only show up now
function tideTurn(low,isl,boot){
  if(low&&isl){const edge=isl.sand.filter(([x,z])=>{const c=SAND_CH.get(K(x,z));return c&&Math.min(...c)<0.1&&freeTile(x,z);});
    const n=boot?3:4+Math.floor(Math.random()*2);for(let i=0;i<n&&edge.length;i++){const [x,z]=edge.splice(Math.floor(Math.random()*edge.length),1)[0];const r=Math.random();
      S.finds.push({k:r<0.12?'seahorse':r<0.2?'pearl':pickR(['hermit','anemone','star']),x,z,tide:1});}syncLife();}
  if(boot)return;
  tideSweep(low);if(low)say(isl?'The tide is out! The pools are full of life… for now.':'The tide is out.');else say('The tide is coming back in.');
  buzz(15);noise(1.2,0.06,500,0.5);setTimeout(()=>noise(0.9,0.04,900,0.6),300);}
function tideSweep(low){const el=document.createElement('div');el.className='tidesweep'+(low?' out':' in');el.innerHTML=`<b>${low?'Low tide':'High tide'}</b>`;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}

  S.giftN=(S.giftN||0)+n;return n;}

  if(lt.length)out.push(`Low tide at ${lt.join(' and ')}`);if(cr)out.push(`${cr} crop${cr>1?'s':''} growing in the dark`);out.push('Something may wash up on the beach');if(S.heartAt)out.push('The driftseed is stirring…');return out;}

  const wd=new Date(typeof gameNow==='function'?gameNow():Date.now()).toLocaleDateString(undefined,{weekday:'long'});

  const el=document.createElement('div');el.className='morning';el.innerHTML=`<div class="sun"></div><div class="mc"><div class="tab"></div>${stamp}<h5>Daily Field Report</h5><small>As filed by the ${(TOWN.name||'island')} field station</small>
    <div class="mrow"><label>Date</label><b>Day ${S.day} · ${wd}</b></div>${lines.map((l,i)=>`<div class="mrow"><label>${['I','II','III','IV','V','VI'][i]}.</label><span>${l}</span></div>`).join('')}<p class="mfoot">Tap to begin the day</p></div>`;
  document.body.appendChild(el);SFX.discover();buzz(12);const go=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500);};el.onclick=go;setTimeout(go,4200);}

const goldShadowMat=new T.MeshBasicMaterial({color:0xffc83a,transparent:true,opacity:0.55,depthWrite:false,blending:T.AdditiveBlending});
function shineLife(dt,tt){goldShadowMat.opacity=0.4+0.25*Math.sin(tt*5);
  for(const f of S.finds){if(!(f.shiny||f.tide||f.gift||f.map))continue;if(Math.abs(f.x-vil.x)>12||Math.abs(f.z-vil.z)>12)continue;
    if(Math.random()<dt*(f.map?4:f.shiny?2.2:0.5))sparkle(f.x,(topY(f.x,f.z)||0.2)+0.15,f.z,f.shiny||f.map?0xfff0a0:0xe8fbff);}
  for(const s of shadows)if(s.gold&&!s.out&&Math.random()<dt*3)sparkle(s.x,(s.wy||tideY)+0.05,s.z,0xffe27a);}

function goldFish(region,deep,river){return pickW(FISH,k=>{const F=FISH[k];if(F.junk||F.w>=6||!dexOk(F,S.sea?null:curIsl()))return false;if(F.hab==='river'?!river:river)return false;return F.bio.includes('any')||F.bio.includes(region);},(k,F)=>F.w);}
/* =========================================================
   Daily orders
   ========================================================= */
function cropOrder(id){const C=CROPS[id],n=C.price<60?4:C.price<200?3:2;return{k:'c:'+id,n,reward:Math.round(C.price*n*1.8),xp:Math.round(C.price*n/20)+3};}
function makeOrders(){const lv=level(),un=CROP_IDS.filter(id=>CROPS[id].lvl<=lv);const o=[cropOrder(pickR(un))];
  const bios=new Set(islands.filter(i=>S.disc[i.id]&&!i.home).map(i=>i.biome));
  if(bios.size&&Math.random()<0.55){const k=pickW(PLANTS,k=>PLANTS[k].w>=8&&PLANTS[k].bio.some(b=>bios.has(b)));o.push({k:'p:'+k,n:2,reward:Math.round(PLANTS[k].price*2*2.6+80),xp:12});}

  else{const k=pickW(BUGS,k=>BUGS[k].w>=9&&(BUGS[k].bio.includes('home')||BUGS[k].bio.some(b=>bios.has(b))));o.push({k:'b:'+k,n:1,reward:Math.round(BUGS[k].price*2.4+60),xp:10});}
  S.orders=o;S.ordBonus=0;}
const TAKE_ORDER=['normal','giant','moonlit','golden','crystal','rainbow'];
function orderHave(o){if(o.k.startsWith('c:')){const t=o.k.slice(2);return TAKE_ORDER.reduce((s,v)=>s+(S.inv[t+'|'+v]||0),0);}return S.inv[o.k]||0;}
function take(key,n){S.inv[key]-=n;if(S.inv[key]<=0)delete S.inv[key];}

  if(o.k.startsWith('c:')){const t=o.k.slice(2);for(const v of TAKE_ORDER){const key=t+'|'+v,h=Math.min(n,S.inv[key]||0);if(h){take(key,h);n-=h;}if(!n)break;}}else take(o.k,n);

  if(S.orders.every(q=>q.done)&&!S.ordBonus){S.ordBonus=1;const b=100+level()*60;S.shells+=b;S.free.mystery=(S.free.mystery||0)+1;
    setTimeout(()=>{SFX.level();toast(`All of today's orders done! Bonus +${fmt(b)} shells and a free Mystery Seed.`,'rare',ICON.mystery);},500);}}

  updateBugs(dt,tt);updateCritters(dt,tt);updateForage(dt);updateCrow(dt,tt);updateFishing(dt,tt);updateFlotsam(dt,tt);}

function traderSpot(){const isl=islands[0];return{x:DOCK.x-1.3,z:(isl.dockZ||DOCK.z)+3.3};}
function updateTrader(dt,tt){const want=traderOn()?1:0;
  if(want&&!trader.shown){trader.shown=true;trader.come=0;const s=traderSpot();trader.x=s.x;trader.z=s.z;
    if(Math.hypot(vil.x-s.x,vil.z-s.z)<30){SFX.horn();say(S.metMarlo?`${TRADER.name}'s boat is in!`:'A little boat is mooring at your dock…');}}
  if(trader.shown){trader.come=clamp(trader.come+(want?dt:-dt)/3,0,1);if(!want&&trader.come<=0){trader.shown=false;traderBoat.visible=false;return;}
    const u=smooth(0,1,trader.come),off=(1-u)*14;/* sails in from the south, and back out at closing */
    traderBoat.visible=true;traderBoat.position.set(trader.x,tideY+Math.sin(tt*1.4)*0.03-0.02,trader.z+off);traderBoat.rotation.set(Math.sin(tt*1.1)*0.02,0.05,Math.sin(tt*0.9)*0.025);
    const m=traderBoat.userData.marlo;if(m)m.rotation.y=-Math.PI/2+Math.sin(tt*0.7)*0.25;}}
// a tap close to the boat on screen
function traderTap(cx,cy){if(!trader.shown||trader.come<0.9)return false;const s=toScreen(trader.x,tideY+0.7,trader.z);if(Math.hypot(s[0]-cx,s[1]-cy)>Math.max(26,40*40/cam.dist))return false;
  const isl=islands[0];let best=null,bd=1e9;for(const [x,z] of [...isl.sand,...isl.grass]){const d=(x-trader.x)**2+(z-trader.z)**2;if(d<bd){bd=d;best=[x,z];}}
  clearAction();goTo(best[0],best[1],()=>{villager.rotation.y=Math.atan2(trader.x-vil.x,trader.z-vil.z);traderHello();openSheet('trader','buy');});return true;}
const MARLO_HI=['Fresh off the tide today!','Ahoy! Have a look, have a look.','Mind the crates. What can I get you?','Found some lovely bits out on the reef.','Business is slow… on account of there being one customer.'];
function traderHello(){const first=!S.metMarlo;S.metMarlo=1;say(first?`I'm ${TRADER.name}! I sail these islands trading bits and bobs. Leave things in your crate and I'll collect them at dawn.`:`${TRADER.name}: “${MARLO_HI[(S.day+Math.floor(S.hour))%MARLO_HI.length]}”`);}

// ---- today's stock: a handful of things, the same all day, different tomorrow ----
function traderStock(){if(S.tstock&&S.tstock.day===S.day)return S.tstock.items;const R=mulberry((S.worldSeed|0)+S.day*7919),lv=level(),items=[];
  const crops=CROP_IDS.filter(id=>CROPS[id].lvl<=lv+1);for(let i=0;i<2&&crops.length;i++){const id=crops.splice(Math.floor(R()*crops.length),1)[0],C=CROPS[id];items.push({t:'seed',id,n:5,price:C.seed*5});}
  items.push({t:'bait',n:5,price:CONSUM.bait.price*5});
  const decor=Object.keys(BUILD).filter(k=>!BUILD[k].craft&&BUILD[k].lvl<=lv+1);for(let i=0;i<2&&decor.length;i++){const k=decor.splice(Math.floor(R()*decor.length),1)[0];items.push({t:'decor',id:k,price:BUILD[k].cost});}
  if(RODS[S.rod+1]&&R()<0.5)items.push({t:'rod',price:RODS[S.rod+1].cost});else if(CANS[S.can+1])items.push({t:'can',price:CANS[S.can+1].cost});
  items.push({t:'map',price:320});
  const cur=Object.keys(FINDS).filter(k=>FINDS[k].w>0&&FINDS[k].w<6&&!S.alm['g:'+k]);if(cur.length){const k=cur[Math.floor(R()*cur.length)];items.push({t:'curio',id:k,price:Math.round(FINDS[k].price*2.2)});}
  S.tstock={day:S.day,items:items.map((q,i)=>Object.assign(q,{i,sold:0}))};return S.tstock.items;}
function stockInfo(q){switch(q.t){
  case'seed':return{name:`${CROPS[q.id].name} seeds ×${q.n}`,icon:seedIcon(q.id),desc:'Plant them in tilled soil. These ones are free to plant.'};
  case'bait':return{name:`Fish bait ×${q.n}`,icon:ICON['x:bait']||ICON.rod,desc:'Cast anywhere and something will come for it.'};
  case'decor':return{name:BUILD[q.id].name,icon:THUMB[q.id]||ICON.star,desc:BUILD[q.id].desc+' You choose where it goes.'};
  case'rod':return{name:RODS[S.rod+1].name,icon:ICON.rod,desc:'A longer bite window, rarer fish and fewer boots.'};
  case'can':return{name:CANS[S.can+1].name,icon:ICON.can,desc:'Waters the eight tiles round the one you tap.'};
  case'map':return{name:'Treasure map',icon:ICON['g:oldcoin']||ICON.star,desc:'Marks a spot on your island where something good is buried.'};
  case'curio':return{name:FINDS[q.id].name,icon:ICON['g:'+q.id]||ICON.star,desc:'A curio from another shore, new to your Islandex.'};}}
function buyStock(i){const q=traderStock()[i];if(!q||q.sold)return;if(S.shells<q.price){SFX.no();say(`${TRADER.name}: “That one's ${fmt(q.price)} shells, friend.”`);return;}
  if(q.t==='decor'){closeSheet();startPlace(q.id,false);return;}/* placing it is when you pay (72-farming) */
  S.shells-=q.price;q.sold=1;SFX.coin();buzz(12);
  if(q.t==='seed')S.free[q.id]=(S.free[q.id]||0)+q.n;
  else if(q.t==='bait')S.inv['x:bait']=(S.inv['x:bait']||0)+q.n;
  else if(q.t==='rod'){S.rod++;setRod();}else if(q.t==='can')S.can++;
  else if(q.t==='map')buryTreasure();
  else if(q.t==='curio')gain('g:'+q.id);
  say(`${TRADER.name}: “${['Pleasure doing business!','A fine choice.','You won\'t regret it.'][q.i%3]}”`);renderSheet();updateHUD();}
// the map: a golden dig spot somewhere on your island with something rare underneath
function buryTreasure(){const isl=islands[0],c=isl.grass.filter(([x,z])=>freeTile(x,z)&&Math.hypot(x-vil.x,z-vil.z)>8);if(!c.length)return;const [x,z]=pickR(c);
  S.finds.push({k:'dig',x,z,map:1});syncLife();const dir=Math.abs(x-vil.x)>Math.abs(z-vil.z)?(x>vil.x?'east':'west'):(z>vil.z?'south':'north');
  setTimeout(()=>say(`The map shows an X to the <b>${dir}</b> of here. Look for the golden glint!`),900);}

// ---- the crate by your tent: sell by leaving things for Marlo ----
function cratePos(){return{x:HOUSE_AT.x+1.75,z:HOUSE_AT.z-0.05};}
function crateTap(cx,cy){if(!S.scratch||!S.homeAt||S.house)return false;const c=cratePos(),s=toScreen(c.x,topY(Math.round(c.x),Math.round(c.z))+0.3,c.z);
  if(Math.hypot(s[0]-cx,s[1]-cy)>Math.max(18,22*40/cam.dist))return false;clearAction();goTo(c.x+0.4,c.z+0.9,()=>{villager.rotation.y=Math.atan2(c.x-vil.x,c.z-vil.z);openSheet('bag','all','crate');});return true;}
function crateWorth(){return Object.entries(S.crate||{}).reduce((t,[k,n])=>t+priceOf(k)*n,0);}
function toCrate(key,n){const have=S.inv[key]||0;n=Math.min(n,have);if(!n)return 0;S.crate=S.crate||{};S.crate[key]=(S.crate[key]||0)+n;S.inv[key]=have-n;if(!S.inv[key])delete S.inv[key];
  noise(0.08,0.05,600);return n;}
// at dawn Marlo empties it and leaves the shells
function collectCrate(){const w=crateWorth();if(!w)return;S.shells+=w;S.earned=(S.earned||0)+w;S.crateLast=(S.crateLast||0)+w;S.crate={};}
/* =========================================================
   Journal: today's little tasks, the discovery card, the bedtime diary, resting by the fire, and the title screen
   ========================================================= */
// --- today's tasks: four small things to do each day, ticked off as you play, each paying a few shells ---
const JR_TASKS={
  bug:{t:n=>`Catch ${n} bug${n>1?'s':''}`,n:[2,3],pay:90,ico:'net'},
  find:{t:n=>`Forage ${n} treasures`,n:[3,5],pay:80,ico:'bag'},
  shake:{t:n=>`Shake ${n} trees`,n:[2,4],pay:60,ico:'axe',ok:()=>S.debris.some(d=>d.k==='tree')},
  rustle:{t:n=>`Rustle ${n} bushes`,n:[2,3],pay:60,ico:'sprout',ok:()=>S.debris.some(d=>d.k==='bush')},
  dig:{t:()=>'Dig up something buried',n:[1,1],pay:110,ico:'shovel'},
  fish:{t:n=>`Catch ${n} fish`,n:[1,2],pay:120,ico:'rod'},
  wood:{t:n=>`Gather ${n} wood`,n:[3,5],pay:70,ico:'m:wood'},
  water:{t:n=>`Water ${n} crops`,n:[3,5],pay:60,ico:'can',ok:()=>Object.values(S.tiles).some(t=>t.crop)},
  harvest:{t:n=>`Harvest ${n} crops`,n:[2,4],pay:90,ico:'sprout',ok:()=>Object.values(S.tiles).some(t=>t.crop)},
  talk:{t:n=>`Chat with ${n} neighbour${n>1?'s':''}`,n:[1,2],pay:70,ico:'star',ok:()=>npcs.length>0,cap:()=>npcs.length},
  fire:{t:()=>'Warm up by the campfire',n:[1,1],pay:50,ico:'star',ok:()=>!!campfire()},
  fresh:{t:()=>'Discover something new',n:[1,1],pay:150,ico:'dex'},
  tent:{t:()=>'Pitch your tent',n:[1,1],pay:100,ico:'star',chk:()=>!!S.homeAt},
};
function jrMake(){const R=mulberry(S.worldSeed+S.day*977),pick=k=>{const T=JR_TASKS[k];let n=T.n[0]+Math.floor(R()*(T.n[1]-T.n[0]+1));if(T.cap)n=Math.min(n,T.cap());return{k,n,have:0,done:0};};
  let keys;if(S.day===1&&S.scratch)keys=[S.homeAt?'shake':'tent','bug','find','fire'];/* a gentle first day */
  else{const pool=Object.keys(JR_TASKS).filter(k=>k!=='tent'&&(!JR_TASKS[k].ok||JR_TASKS[k].ok()));keys=[];while(keys.length<4&&pool.length)keys.push(pool.splice(Math.floor(R()*pool.length),1)[0]);}
  S.jr={day:S.day,tasks:keys.map(pick),all:0};}
function jrNote(k,n=1){if(!S.jr||S.jr.day!==S.day)return;const t=S.jr.tasks.find(q=>q.k===k&&!q.done);if(!t)return;t.have=Math.min(t.n,t.have+n);if(t.have>=t.n)jrDone(t);else jrChip(true);}
function jrDone(t){t.done=1;const T=JR_TASKS[t.k],pay=T.pay+t.n*10;S.shells+=pay;addXP(4);
  setTimeout(()=>{SFX.level();stamp(`${T.t(t.n)}`,`+${pay} shells`);flyShells(6);jrChip(true);
    if(S.jr.tasks.every(q=>q.done)&&!S.jr.all){S.jr.all=1;setTimeout(()=>{const b=250+S.day*10;S.shells+=b;addXP(10);SFX.discover();stamp('A perfect day!',`Every task done · +${b} shells`,true);flyShells(12);
      for(let i=0;i<24;i++)sparkle(vil.x+(Math.random()-0.5)*2,1+Math.random(),vil.z+(Math.random()-0.5)*2,pickR([0xfff0a0,0xffc8e0,0xbff4ff]));},2600);}},500);}
// everything you pick up counts towards the day's tasks and diary; a first-ever catch or find gets the discovery card
function jrGain(key,n,first){todayNote(key,n,first);const c=key.slice(0,2);if(/^[bfgpm]:/.test(key)||key.includes('|')){streakBump();flyItem(key);}/* 87b */
  if(c==='b:')jrNote('bug',n);else if(c==='f:'){if(!FISH[key.slice(2)].junk)jrNote('fish',n);}else if(c==='g:')jrNote('find',n);else if(key==='m:wood')jrNote('wood',n);else if(key.includes('|'))jrNote('harvest',n);
  if(first&&/^[bfgp]:/.test(key)){jrNote('fresh');reveal(key);}}
// tasks that finish by reaching a state rather than by an action (like pitching your tent)
function jrCheck(){if(!S.jr||S.jr.day!==S.day)jrMake();for(const t of S.jr.tasks){const c=JR_TASKS[t.k].chk;if(c&&!t.done&&c()){t.have=t.n;jrDone(t);}}jrChip();}
const BOOK_SVG='<svg viewBox="0 0 32 32"><path d="M4 7c4-2 8-2 12 1v18c-4-3-8-3-12-1z" fill="#f7e4c0" stroke="#b07a4a" stroke-width="1.6" stroke-linejoin="round"/><path d="M28 7c-4-2-8-2-12 1v18c4-3 8-3 12-1z" fill="#fff4dc" stroke="#b07a4a" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 11c2-.6 4-.5 6 .5M7 15c2-.6 4-.5 6 .5M19 11.5c2-1 4-1.1 6-.5" stroke="#d8b07a" stroke-width="1.3" stroke-linecap="round"/><path d="M22 4v9l2-1.6 2 1.6V4z" fill="#f08878"/></svg>';
let jrSig='';
function jrChip(bump){const el=$('jrChip');if(!el||!S.jr){return;}const d=S.jr.tasks.filter(q=>q.done).length,n=S.jr.tasks.length;
  const sig=S.jr.day+':'+S.jr.tasks.map(q=>q.k+q.have).join(),changed=sig!==jrSig;if(changed){jrSig=sig;el.innerHTML=`${BOOK_SVG}<span><small>Today</small>${d===n?'All done!':`${d} / ${n} tasks`}</span><i>${S.jr.tasks.map(q=>`<b class="${q.done?'on':''}"></b>`).join('')}</i>`;}
  el.hidden=false;el.classList.toggle('done',d===n);if(bump){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');}

function jrOpen(){SFX.ui();let c=$('jrCard');if(c){c.remove();return;}c=document.createElement('div');c.id='jrCard';c.className='jrcard';c.innerHTML='<div class="fncard"></div>';document.body.appendChild(c);
  c.onclick=e=>{if(e.target===c||e.target.closest('.x')){SFX.ui();c.classList.add('out');setTimeout(()=>c.remove(),220);}};jrRender();}
function jrRender(){const c=$('jrCard');if(!c||!S.jr)return;const s=season();
  // a field-notes index card: the day's number, where and when, and the four tasks on ruled lines, stamped when done

  c.firstChild.innerHTML=`<i class="clip"></i><button class="x" aria-label="Close">×</button>
  <div class="fn-top"><span>Field Notes</span><span>No. ${no}</span></div>

  <div class="fn-subj"><label>Subject</label><h3>Today's Tasks</h3></div>
  <ol class="fn-list">${S.jr.tasks.map((q,i)=>{const T=JR_TASKS[q.k],ic=ICON[T.ico]||ICON.star;return`<li class="${q.done?'done':''}"><span class="n">${['I','II','III','IV','V'][i]}.</span><img class="px" src="${ic}" alt=""><span class="t">${T.t(q.n)}</span><span class="c">${q.done?'':q.n>1?`${q.have}/${q.n}`:''}</span><span class="r">+${T.pay+q.n*10}</span>${q.done?'<u>Done</u>':''}</li>`;}).join('')}</ol>
  <div class="fn-foot"><span>${S.jr.all?'A perfect day. Filed with pride.':`${done} of ${S.jr.tasks.length} complete · all four earn a bonus`}</span><span>Form ${no}-${S.jr.tasks.length} · Rev. ${s}</span></div>`;}
// a big stamp across the top when a task is done
function stamp(title,sub,big){const el=document.createElement('div');el.className='stamp'+(big?' big':'');el.innerHTML=`<i>✓</i><span><b>${title}</b><small>${sub}</small></span>`;document.body.appendChild(el);
  setTimeout(()=>el.classList.add('out'),big?3200:2400);setTimeout(()=>el.remove(),big?3700:2900);}
// little shells flying up into your purse
function flyShells(n){const to=$('icoShell');if(!to)return;const r=to.getBoundingClientRect(),cx=innerWidth/2,cy=innerHeight*0.2;
  for(let i=0;i<n;i++){const s=document.createElement('img');s.src=ICON.shell;s.className='flyshell';s.style.left=(cx+(Math.random()-0.5)*80)+'px';s.style.top=(cy+(Math.random()-0.5)*30)+'px';document.body.appendChild(s);
    setTimeout(()=>{s.style.transform=`translate(${r.left+r.width/2-parseFloat(s.style.left)-11}px,${r.top+r.height/2-parseFloat(s.style.top)-11}px) scale(.6)`;s.style.opacity='0.2';},40+i*70);
    setTimeout(()=>{s.remove();if(i%2===0)tone(1200+i*60,0.04,'triangle',0.02);const ch=to.closest('.chip');if(ch){ch.classList.remove('bump');void ch.offsetWidth;ch.classList.add('bump');}},700+i*70);}}

// --- the discovery card: a first-ever catch or find is held up in the middle of the screen, with a little line about it ---
const REVEAL_LINES={
  b:['It fluttered right into my net!','Gotcha! Careful now… careful…','Look at those little legs!','It tickles!','Quiet as a whisper, and I still got it!'],
  g:['Ooh, into the pocket it goes!','What a lucky find!','The island is full of surprises.','I\'ll treasure this one.','Finders keepers!'],
  p:['It smells wonderful.','Picked with care.','Such a pretty little thing.','The meadow gave me this.'],
};
const revQ=[];let revOn=false;
function reveal(key){if(!/^[bgp]:/.test(key))return;const I=itemInfo(key);if(I&&I.w>=5){const [dg,dt]=dexCount();say(`<b>New!</b> ${I.name} <small>· Islandex ${Math.floor(dg/dt*100)}%</small>`,ICON[key]);pluck(1318.5,0.025,0.6);setTimeout(()=>pluck(1568,0.025,0.8),110);return;}/* everyday firsts: a caption; the card is for rare ones */revQ.push(key);if(!revOn)revNext();}
function revNext(){const key=revQ.shift();if(!key){revOn=false;return;}revOn=true;const I=itemInfo(key);if(!I){revNext();return;}
  const L=REVEAL_LINES[key[0]],line=L[(hash(key.length*7,key.charCodeAt(2)+key.charCodeAt(key.length-1)*13)*L.length|0)%L.length];
  const cat={b:'Bug',g:'Treasure',p:'Wild plant'}[key[0]],el=document.createElement('div');el.className='reveal'+(I.w<5?' rare':'');
  el.innerHTML=`<div class="rays"></div><div class="rv"><small>New discovery</small><img class="px" src="${ICON[key]}" alt=""><b>${I.name}</b><em>${cat}${I.w?' · '+rarity(I.w):''}</em><p>“${line}”</p><u>Islandex ${(([g,t])=>Math.floor(g/t*100))(dexCount())}% complete</u></div>`;
  document.body.appendChild(el);SFX.discover();requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>el.classList.add('out'),2900);setTimeout(()=>{el.remove();setTimeout(revNext,250);},3400);}

// --- the day's diary: everything you did, written up when you go to sleep ---
function todayNote(key,n,first){if(!S.today||S.today.d!==S.day)S.today={d:S.day,got:{},nw:[]};S.today.got[key]=(S.today.got[key]||0)+n;if(first&&/^[bfgp]:/.test(key))S.today.nw.push(key);}
function diaryLine(t){const sum=p=>Object.keys(t.got).filter(k=>k.startsWith(p)).reduce((s,k)=>s+t.got[k],0),bits=[];
  const b=sum('b:'),f=sum('f:'),g=sum('g:'),w=sum('m:'),c=Object.keys(t.got).filter(k=>k.includes('|')).reduce((s,k)=>s+t.got[k],0);
  if(b)bits.push(`caught ${b} bug${b>1?'s':''}`);if(f)bits.push(`reeled in ${f} fish`);if(g)bits.push(`found ${g} treasure${g>1?'s':''}`);if(c)bits.push(`harvested ${c} crop${c>1?'s':''}`);if(w)bits.push(`gathered ${w} material${w>1?'s':''}`);
  if(!bits.length)return'A slow, quiet day. I listened to the waves and let the island be.';
  const last=bits.pop();return'Today I '+(bits.length?bits.join(', ')+' and '+last:last)+'.'+(t.nw.length?` I saw ${t.nw.length===1?'something':t.nw.length+' things'} I'd never seen before!`:'');}
function showDiary(then){const t=S.today&&S.today.d===S.day?S.today:{got:{},nw:[]},jr=S.jr&&S.jr.day===S.day?S.jr:null;
  const keys=Object.keys(t.got).sort((a,b)=>(t.nw.includes(b)-t.nw.includes(a))||t.got[b]-t.got[a]).slice(0,12);
  const el=document.createElement('div');el.id='diary';el.className='diary';
  // a page torn from the field notebook: the day in handwriting, what you collected in little specimen frames, and
  // tomorrow's forecast on a tag clipped to the page
  el.innerHTML=`<div class="page"><div class="perf"></div><div class="nhd"><h4>Notes</h4><span>Comments, statements</span><em>Day ${String(S.day).padStart(3,'0')} · ${season()}</em></div>
    <p class="hand">Dear diary, ${diaryLine(t).replace(/^T/,'t')}</p>
    ${keys.length?`<div class="grid">${keys.map(k=>`<span class="${t.nw.includes(k)?'nw':''}"><img class="px" src="${ICON[k]||ICON.star}" alt=""><i>×${t.got[k]}</i></span>`).join('')}</div>`:''}
    ${jr?`<div class="tasks"><label>Tasks</label>${jr.tasks.map(q=>`<b class="${q.done?'on':''}">${q.done?'✓':''}</b>`).join('')}<span>${jr.tasks.filter(q=>q.done).length} of ${jr.tasks.length}</span></div>`:''}
    <div class="tmw"><label>Forecast · tomorrow</label>${tomorrowLines().map(l=>`<span>${l}</span>`).join('')}</div>
    <button class="pbtn go">Lights out</button></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));el.querySelector('button').onclick=()=>{SFX.ui();el.classList.remove('on');setTimeout(()=>el.remove(),400);then();};}

// --- resting by the campfire: sit on the bench, the camera leans in, and time can slip by ---
let rest=null;
// the campfire: Acornfield's own, or the bonfire in front of your tent (a tile to its front-left, see houseGroup)
function campfire(){if(S.home&&S.home.fire)return S.home.fire;return S.scratch&&S.homeAt&&!S.house?[HOUSE_AT.x-1,HOUSE_AT.z+2]:null;}
function isFire(x,z){const f=campfire();return !!f&&Math.abs(x-f[0])<=0.5&&Math.abs(z-f[1])<=0.5;}
function isTent(x,z){const t=S.home&&S.home.tent;return !!t&&x>=t[0]&&x<=t[0]+1&&z>=t[1]&&z<=t[1]+1;}
// a tap close to the flames on screen (the tent stands behind the fire, so the tile under your finger is often the tent's)
function fireTap(cx,cy){const f=campfire();if(!f||rest)return false;const s=toScreen(f[0],topY(f[0],f[1])+0.25,f[1]);if(Math.hypot(s[0]-cx,s[1]-cy)>Math.max(18,24*40/cam.dist))return false;clearAction();restByFire();return true;}

function tentTap(){if(S.hour>=19||S.hour<5)setAction('Crawl into your tent and sleep until morning?',[{label:'Sleep',cls:'go',fn:sleep},{label:'Stay up',fn:clearAction}],'Tent');

function updateJournal(dt,tt){
  if(rest){rest.t+=dt;if(Math.hypot(vil.tx-vil.x,vil.tz-vil.z)>0.05||vil.path&&vil.path.length){rest=null;if(!$('actionBar').hidden)clearAction();}
    else{vil.idle=0;villager.rotation.y=Math.atan2(rest.fx-vil.x,rest.fz-vil.z);villager.position.y-=0.1;const body=villager.children[0];if(body)body.scale.set(1.04,0.93+Math.sin(tt*1.6)*0.012,1.04);
      if(!drag&&!pinch)cam.dist=lerp(cam.dist,Math.max(12,rest.d0*0.55),Math.min(1,dt*0.8));
      if(Math.random()<dt*6)emit(rest.fx+(Math.random()-0.5)*0.2,topY(rest.fx,rest.fz)+0.5,rest.fz+(Math.random()-0.5)*0.2,{vx:(Math.random()-0.5)*0.3,vy:0.9+Math.random()*0.6,life:1.4,max:1.4,size:0.035,color:pickR([0xffc860,0xff9a40,0xfff0b0]),g:-0.2});
      if(Math.random()<dt*0.9)noise(0.05,0.03,2400+Math.random()*1600,2);}}
  if(titleCam){const c=titleCam;if(c.out>=0){c.out+=dt;const u=smooth(0,1,c.out/2.2);cam.dist=lerp(c.fd,c.d,u);cam.pitch=lerp(c.fp,c.p,u);cam.yaw=lerp(c.fy,c.y,u);if(u>=1)titleCam=null;}
    else{cam.yaw+=dt*0.045;cam.pitch=lerp(cam.pitch,0.3,Math.min(1,dt));}}}

/* =========================================================
   Thumbnails of 3D models for the shop
   ========================================================= */
const THUMB={};
// renders a model to a small transparent PNG (data URL), from a close 3/4 view so the world-curve shader doesn't bend it
let thumbRig=null;
function snapThumb(g,size=48){
  if(!thumbRig||thumbRig.size!==size){if(thumbRig)thumbRig.trt.dispose();const ts=new T.Scene();ts.add(new T.HemisphereLight(0xfff4e0,0x6a6a8a,0.8));const dl=new T.DirectionalLight(0xffffff,0.8);dl.position.set(3,6,5);ts.add(dl);
    const cv=document.createElement('canvas');cv.width=cv.height=size;const cx=cv.getContext('2d');
    thumbRig={size,ts,tc:new T.OrthographicCamera(-1,1,1,-1,0.1,60),trt:new T.WebGLRenderTarget(size,size,{minFilter:T.NearestFilter,magFilter:T.NearestFilter}),buf:new Uint8Array(size*size*4),cv,cx,img:cx.createImageData(size,size)};}
  const {ts,tc,trt,buf,cv,cx,img}=thumbRig;
  g.traverse(o=>{if(o.userData.noThumb)o.visible=false;});ts.add(g);const box=new T.Box3().setFromObject(g);const c=box.getCenter(new T.Vector3());const s=box.getSize(new T.Vector3());
  const r=Math.max(s.x,s.y,s.z)*0.62;tc.left=-r;tc.right=r;tc.top=r;tc.bottom=-r;tc.position.set(c.x+2.2,c.y+1.55,c.z+2.2);tc.lookAt(c);tc.updateProjectionMatrix();tc.updateMatrixWorld();
  const old=glowMat.emissiveIntensity;glowMat.emissiveIntensity=0.4;renderer.setRenderTarget(trt);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(ts,tc);
  renderer.readRenderTargetPixels(trt,0,0,size,size,buf);renderer.setRenderTarget(null);renderer.setClearColor(0x000000,1);glowMat.emissiveIntensity=old;ts.remove(g);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const si=((size-1-y)*size+x)*4,di=(y*size+x)*4;img.data[di]=buf[si];img.data[di+1]=buf[si+1];img.data[di+2]=buf[si+2];img.data[di+3]=buf[si+3];}
  cx.putImageData(img,0,0);return cv.toDataURL();}
function makeThumbs(){const snap=g=>snapThumb(g,96);
  for(const k in BUILD)THUMB[k]=snap(objGroup(k,3,0));
  for(let i=0;i<4;i++)THUMB['house'+i]=snap(houseGroup(i));
  const isl=new T.Group();for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++){const d=Math.hypot(x*0.9,z);if(d<3.4){const m=new T.Mesh(BOX,toon({color:d<2.2?0x6aa843:0xe9d3a4}));m.scale.set(1,d<2.2?1:0.8,1);m.position.set(x,0,z);isl.add(m);}}
  isl.add(objGroup('pine',2).translateX(-0.5).translateY(0.5));THUMB.land=snap(isl);
}

   New game: arriving by sea. You drift on a raft past islands the currents bring you to; each one is generated in
   full (coastline, cliffs, rivers and waterfalls, forests and meadows, its style) and shown from the water in a slow
   flyover, with a few words about what's there. Keep drifting until one feels like home, then make landfall: the game
   boots on that island (bootGame(true) in 90-main), with you on its beach and nothing built.
   A candidate: seed (world and cliffs), style (HOME_STYLES), coastline wobble and carved coves, cliff layout, wildness.
   ========================================================= */

// Each beam is pinned to a real gap between trees and slants along the actual sun direction, so it stays put as you walk

const rayMat=new T.MeshBasicMaterial({map:RAY_TEX,transparent:true,blending:T.AdditiveBlending,depthWrite:false,depthTest:false,side:T.DoubleSide,fog:false,opacity:0.4});/* shafts of light hang in the air in front of the leaves */
const RAY_N=9,RAY_GEO=(()=>{/* two planes crossed at right angles along the beam */const a=new T.PlaneGeometry(1,1).translate(0,0.5,0),b=a.clone().rotateY(Math.PI/2),g=new T.BufferGeometry();

const _sunD=new T.Vector3(),RAY_UP=new T.Vector3(0,1,0);let rayT=0,rayK=0;
function rayGap(){const ts=S.debris.filter(d=>d.k==='tree'&&Math.abs(d.x-cam.tx)<10&&Math.abs(d.z-cam.tz)<10);rayK=Math.min(1,ts.length/6);if(!ts.length)return null;
  for(let it=0;it<6;it++){const t=pickR(ts);for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1],[1,1],[-1,1]]){const x=t.x+a,z=t.z+b;if(!debrisAt(x,z)&&isLand(x,z)&&!rays.some(r=>(r.a>0.01||r.want)&&Math.abs(r.x-x)<1.6&&Math.abs(r.z-z)<1.6))return[x+(Math.random()-0.5)*0.5,z+(Math.random()-0.5)*0.5];}}return null;}
function updateRays(dt,tt){const h=S.hour,golden=S.rain||S.sea||inside?0:Math.max(smooth(6,7.2,h)*(1-smooth(9.5,11,h)),smooth(15.5,16.8,h)*(1-smooth(18.6,19.4,h)));

function senseEnv(){const x=Math.round(vil.x),z=Math.round(vil.z);let sea=9,riv=9,tr=0;
  for(let dx=-6;dx<=6;dx++)for(let dz=-6;dz<=6;dz++){const d=Math.hypot(dx,dz);if(d>6.5)continue;const k=K(x+dx,z+dz);
    if(riverSurf.has(k))riv=Math.min(riv,d);else if(!isLand(x+dx,z+dz))sea=Math.min(sea,d);const db=S.debris.length&&d<5?debrisAt(x+dx,z+dz):null;if(db&&db.k==='tree')tr++;}
  env.sea=S.sea?1:clamp(1-(sea-1)/6,0,1);env.river=clamp(1-(riv-0.5)/5,0,1);env.trees=clamp(tr/14,0,1);}
function updateBeds(dt,tt){if(!AC)return;if(!beds){if(noiseBuf)startBeds();return;}const on=S.sound&&!inside?1:0,k=Math.min(1,dt*1.5),gust=0.55+0.45*Math.sin(tt*0.23)*Math.sin(tt*0.61+1);

/* =========================================================
   Dev: the showcase farm. One tap turns this save into a late-game, hand-planned farm (what a player who has

const REAL_KEY=SAVE_KEY+'-real';

function loadShowcase(){

  S.boat=null;S.tut=2;S.tipTools=1;S.tipSeed=1;S.tipPaint=1;S.boatTip=1;S.farmInit=1;S.farmClear=1;S.rain=false;S.sea=false;

  for(const id of CROP_IDS){for(const v of VARIANTS)S.alm[id+'|'+v.id]=1;S.almR[id]=1;}

  delete S.scratch;delete S.wild;delete S.home;delete S.homeAt;delete S.heartAt;S.builds=[];S.debris=[];S.paths={};applyHomeStyle();

let showcaseGate=[FARM.x,FARM.z];
function layShowcaseFarm(){
  const home=islands[0],F=new Set(),occ=new Set();let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(const [x,z] of home.grass)if(farmQ(x,z)<1){F.add(K(x,z));x0=Math.min(x0,x);x1=Math.max(x1,x);z0=Math.min(z0,z);z1=Math.max(z1,z);}
  const inField=(x,z)=>farmQ(x,z)<1.3&&islMap.get(K(x,z))===0&&x<FARM.x+12;
  S.debris=[];S.weeds=[];S.finds=(S.finds||[]).filter(f=>!inField(Math.round(f.x),Math.round(f.z)));
  S.objs=S.objs.filter(o=>!inField(o.x,o.z));for(const k of Object.keys(S.tiles)){const [x,z]=k.split(',').map(Number);if(inField(x,z))delete S.tiles[k];}
  const has=(x,z)=>F.has(K(x,z)),ring=(x,z)=>has(x,z)&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>!has(x+a,z+b));
  const free=(x,z)=>has(x,z)&&!occ.has(K(x,z)),inner=(x,z)=>free(x,z)&&!ring(x,z);
  const obj=(k,x,z,r=0)=>{if(!free(x,z))return false;occ.add(K(x,z));S.objs.push({id:S.nextId++,k,x,z,r});return true;};
  const R=mulberry((S.worldSeed|0)^0x5c0a);
  const crop=(t,x,z,ripe=0.85)=>{if(!inner(x,z))return false;occ.add(K(x,z));const r=R(),on=r<ripe;
    const v=!on?null:r<0.035?'golden':r<0.05?'crystal':r<0.055?'rainbow':r<0.14?'giant':'normal';
    S.tiles[K(x,z)]={w:1,crop:{t,p:on?1:0.55+R()*0.35,v,m:0}};return true;};
  const GZ=[FARM.z-1,FARM.z],PX=Math.round((x0+x1)/2)-1;showcaseGate=[x1,FARM.z];
  // fence ring with an open gate where the bridge comes in; posts either side of the gate get flower pots
  for(const k of F){const [x,z]=k.split(',').map(Number);if(!ring(x,z))continue;
    if(GZ.includes(z)&&x>PX){obj('stonepath',x,z);continue;}
    if(x===x1&&(z===GZ[0]-1||z===GZ[1]+1)){obj('flowerpot',x,z);continue;}
    obj('fence',x,z,has(x,z-1)&&has(x,z+1)?Math.PI/2:0);}
  // a two-wide stone avenue from the gate, and a cross path through the middle
  for(let x=x0;x<=x1;x++)for(const z of GZ)obj('stonepath',x,z);
  for(let z=z0;z<=z1;z++)if(!GZ.includes(z))obj('stonepath',PX,z);
  // the avenue's edges: tulip planters and lanterns on the vegetable side, hedges on the orchard side, pots on the garden side
  for(let x=x0+1;x<x1;x++){if(x===PX)continue;const n=GZ[0]-1,s=GZ[1]+1,lamp=(x-PX)%4===2||(x-PX)%4===-2;
    if(lamp){obj('lantern',x,n);obj('lantern',x,s);continue;}
    if(x>PX){obj('planter',x,n);if(x===PX+1)obj('well',x,s);else if(x===x1-2)obj('signpost',x,s,-Math.PI/2);else obj('planter',x,s);}
    else{obj('hedge',x,n);if(x===PX-1)obj('bench',x,s,Math.PI);else if(x===PX-3)obj('birdhouse',x,s);else if(x===PX-5)obj('gnome',x,s);else obj('flowerpot',x,s);}}
  // east: packed 3×3 vegetable plots, each round a sprinkler (a few round a scarecrow, beehive or lucky clover); leftover edges
  // get a border of sunflowers along the fence and wheat elsewhere
  const plots=(dir,list,centres)=>{let b=0;
    for(let cz=(dir<0?GZ[0]:GZ[1])+dir*3;cz>z0&&cz<z1;cz+=dir*3)for(let cx=PX+2;cx<x1;cx+=3){if(!inner(cx,cz))continue;
      const t=list[b%list.length],c=centres[b%centres.length];b++;obj(c,cx,cz);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)if(dx||dz)crop(t,cx+dx,cz+dz);}};
  plots(-1,['tomato','corn','cabbage','pepper','carrot','eggplant','potato','onion'],['sprinkler','sprinkler','scarecrow','sprinkler','sprinkler','beehive']);
  plots(1,['pumpkin','strawberry','blueberry','watermelon','lettuce','wheat','radish','turnip'],['sprinkler','clover','sprinkler','sprinkler','scarecrow','sprinkler']);
  for(const k of F){const [x,z]=k.split(',').map(Number);if(x<=PX||!inner(x,z)||z===GZ[0]-1||z===GZ[1]+1)continue;
    crop([[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>ring(x+a,z+b))?'sunflower':'wheat',x,z,0.95);}
  // north-west: a windmill in the far corner with hay bales, then an orchard of fruit trees on a two-tile grid, and a trellis row by the avenue
  {let wm=null;for(let s=2;s<8&&!wm;s++)for(let dx=0;dx<=s&&!wm;dx++){const x=x0+1+dx,z=z0+1+(s-dx);if(inner(x,z)&&inner(x+1,z)&&inner(x,z+1)&&inner(x+1,z+1))wm=[x,z];}
    if(wm){obj('windmill',wm[0],wm[1],Math.PI*0.25);occ.add(K(wm[0]+1,wm[1]));occ.add(K(wm[0],wm[1]+1));obj('haybale',wm[0]+1,wm[1]+1);obj('haybale',wm[0]+2,wm[1]);}}
  const trellisZ=GZ[0]-2;for(let x=x0+1;x<PX;x++)crop((x-PX)%2?'grape':'peas',x,trellisZ,0.95);
  for(let z=trellisZ-2;z>z0;z-=2)for(let x=PX-2;x>x0;x-=2){const t=((PX-x)/2+(trellisZ-z)/2)%3;crop(t===0?'peach':t===1?'starfruit':'peach',x,z,0.95);}
  for(let z=trellisZ-3;z>z0;z-=4){const x=PX-3;if(inner(x,z))obj('beehive',x,z);}
  // south-west: striped flower beds (two rows each, a grass row between), beehives along the path end
  const beds=['tulip','lavender','sunflower','moonflower','tulip','lavender'];let row=0;
  for(let z=GZ[1]+2;z<z1;z++,row++){const band=Math.floor(row/3),gap=row%3===2;if(gap)continue;
    for(let x=x0+1;x<PX;x++){if(x===PX-1&&row%3===0){obj('beehive',x,z);continue;}crop(beds[band%beds.length],x,z,0.95);}}
  // wildflowers along the inside of the fence
  for(const k of F){const [x,z]=k.split(',').map(Number);if(inner(x,z)&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>ring(x+a,z+b))&&hash(x*2.3,z*1.7)<0.45)obj('flowers',x,z);}
}
