<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#78b4ee">
<title>Driftseed Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#6b4f2f; --ink2:#9a8266; --cream:#fbf5e1; --paper:#fffcf2; --line:#eadfc2; --wash:#f1e8cf;
  --yellow:#f8d35e; --yellow-d:#d8a933; --teal:#2cc3b2; --teal-d:#1c9a8c; --green:#82c96e; --green-d:#5aa447;
  --blue:#7ab4ee; --blue-d:#4d8ccc; --rose:#f08878; --rose-d:#c9604f; --pink:#f7a9bb;
  --shadow:0 3px 0 rgba(107,79,47,.14),0 10px 24px rgba(60,40,20,.12);
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#78b4ee;}
body{
  font-family:'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
  color:var(--ink); font-size:15px; font-weight:500;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:crisp-edges;image-rendering:pixelated;}
img.px{image-rendering:crisp-edges;image-rendering:pixelated}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.clockb{pointer-events:none;background:var(--paper);border-radius:22px;padding:8px 16px 9px;box-shadow:var(--shadow);min-width:112px}
.clockb .t{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
.clockb .t small{font-size:14px;font-weight:600;margin-left:4px;color:var(--ink2)}
.clockb .d{font-size:13px;font-weight:600;color:var(--ink2);margin-top:3px;white-space:nowrap}
.loc{display:inline-block;margin-top:8px;margin-left:6px;background:var(--teal);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;
  box-shadow:0 3px 0 var(--teal-d);white-space:nowrap;transform:rotate(-2deg)}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;background:var(--paper);border-radius:999px;padding:5px 14px 5px 6px;
  box-shadow:var(--shadow);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.chip img{width:26px;height:26px;background:#fde7ec;border-radius:50%;padding:3px}
.lvl{font-size:14px}
.lvl img{background:#fff1bf}
.lvl .lv{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.xpbar{display:block;width:58px;height:7px;background:var(--wash);border-radius:99px;overflow:hidden}
.xpbar b{display:block;height:100%;width:0;background:var(--green);border-radius:99px}

/* ---------- Dock: a little phone of apps ---------- */
.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;gap:2px;padding:8px 8px 6px;background:var(--paper);border-radius:30px;box-shadow:var(--shadow);max-width:calc(100vw - 20px)}
.btn{position:relative;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;padding:0;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.05}
.btn .ico{width:46px;height:46px;border-radius:16px;background:var(--c,#eee);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1);transition:transform .12s}
.btn img{width:30px;height:30px}
.btn:active .ico{transform:scale(.9)}
.btn .lb{white-space:nowrap;max-width:58px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.btn{width:52px}.btn .ico{width:42px;height:42px}}
.btn.ready::after{content:'!';position:absolute;top:-4px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 2px 0 var(--rose-d);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* ---------- Context buttons ---------- */
.ctx{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:max-content;max-width:calc(100vw - 32px);pointer-events:none}
.ctx > *{pointer-events:auto}
.ctx .msg{background:var(--paper);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow)}

/* ---------- Toasts / floats ---------- */
#toasts{position:fixed;z-index:6;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 118px);
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:9px 16px 9px 10px;font-size:15px;max-width:340px;display:flex;gap:10px;align-items:center;
  animation:tin .35s cubic-bezier(.3,1.6,.5,1) both;color:var(--ink)}
.toast img{width:30px;height:30px;flex:none}
.toast.rare{background:#fff6cf;box-shadow:0 0 0 3px var(--yellow),var(--shadow);font-weight:600}
.toast.out{animation:tout .25s ease-in both}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-100%);font-weight:700;font-size:16px;color:#fff;
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);white-space:nowrap;animation:rise 1.2s ease-out forwards}
.float.gold{color:#ffe07a}
@keyframes rise{to{transform:translate(-50%,-200%);opacity:0}}

/* ---------- Dialog (speech bubble) ---------- */
.actionbar{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:min(440px,calc(100vw - 28px));box-sizing:border-box;
  background:var(--paper);border-radius:34px;box-shadow:var(--shadow);padding:20px 20px 14px;display:flex;flex-direction:column;gap:12px;animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{transform:translateX(-50%) scale(.92);opacity:0}to{transform:translateX(-50%);opacity:1}}
.actionbar .tag{position:absolute;top:-14px;left:24px;background:var(--yellow);color:var(--ink);font-weight:700;font-size:14px;padding:4px 14px;border-radius:999px;transform:rotate(-4deg);box-shadow:0 3px 0 var(--yellow-d)}
.actionbar .tag:empty{display:none}
.actionbar .msg{font-size:17px;line-height:1.35;text-align:center;color:var(--ink)}
.actionbar .msg small{color:var(--ink2);font-weight:500}
.actionbar .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.actionbar .row button{flex:1;min-width:92px}
.actionbar .row:empty{display:none}
.actionbar.tapnext{cursor:pointer;padding-bottom:36px}
.actionbar.tapnext::after{content:'';position:absolute;left:50%;bottom:10px;width:0;height:0;border:8px solid transparent;border-top:10px solid var(--yellow-d);transform:translateX(-50%);animation:bob 0.9s ease-in-out infinite}
.pbtn{background:var(--yellow);border-radius:999px;padding:11px 18px;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 4px 0 var(--yellow-d);transition:transform .08s,box-shadow .08s}
.pbtn.go{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.pbtn.sea{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.pbtn.warn{background:var(--rose);color:#fff;box-shadow:0 4px 0 var(--rose-d)}
.pbtn:disabled{opacity:.45}
.pbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}

/* ---------- Sheets ---------- */
.sheet{position:fixed;z-index:8;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;box-sizing:border-box;max-height:78%;display:flex;flex-direction:column;
  background-color:var(--cream);background-image:radial-gradient(var(--line) 1.4px,transparent 1.6px);background-size:18px 18px;
  border-radius:32px 32px 0 0;box-shadow:0 -8px 30px rgba(60,40,20,.22);animation:sup .35s cubic-bezier(.3,1.3,.5,1) both}
@keyframes sup{from{transform:translate(-50%,60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.sheet h2{margin:0;flex:0 1 auto;font-size:21px;font-weight:700;background:var(--yellow);padding:6px 20px;border-radius:999px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--yellow-d)}
.sheet header::after{content:'';flex:1;order:1}
.sheet .x{order:2;width:42px;height:42px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);font-size:24px;line-height:1;color:var(--ink2)}
.tabs{display:flex;gap:2px;margin:10px 16px 0;padding:4px;background:var(--wash);border-radius:999px}
.tabs:empty{display:none}
.tab{flex:1;padding:8px 2px;border-radius:999px;background:transparent;font-weight:600;font-size:14px;color:var(--ink2)}
.tab.on{background:var(--paper);color:var(--teal-d);box-shadow:0 2px 0 var(--line)}
.sbody{overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 20px);-webkit-overflow-scrolling:touch}
.note{font-size:14.5px;color:var(--ink2);margin:0 0 12px;line-height:1.4}
.note b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border-radius:20px;padding:10px 12px;box-shadow:0 2px 0 var(--line),0 6px 14px rgba(107,79,47,.06);color:var(--ink)}
button.card:active{transform:scale(.98)}
.card img{width:46px;height:46px;flex:none;background:var(--cream);border-radius:14px;padding:3px}
.card img.sil{background:none;filter:brightness(0);opacity:.2}
.card .nm{font-weight:700;font-size:15.5px}
.card .sub{font-size:13px;color:var(--ink2);line-height:1.3}
.card .done{color:var(--green-d);font-weight:700}
.card.sel{box-shadow:0 0 0 3px var(--teal),0 6px 14px rgba(107,79,47,.08)}
.card.lock{opacity:.5}
.card.wide{grid-column:1/-1}
.card .grow{flex:1;min-width:0}
.card .price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .pbtn{padding:8px 14px;font-size:14px}
.shl{display:inline-flex;align-items:center;gap:3px}
.shl img{width:17px;height:17px;background:none;padding:0}
.list{display:flex;flex-direction:column;gap:8px}
.sellall{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.sellall .pbtn{flex:1}
.alm{display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:86px repeat(6,1fr);gap:5px;align-items:center}
.arow .an{font-size:13px;font-weight:700;line-height:1.1}
.arow .an small{display:block;font-weight:500;color:var(--ink2);font-size:11px}
.acell{aspect-ratio:1;background:var(--paper);border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 0 var(--line)}
.acell img{width:70%;height:70%}
.acell.no img{filter:brightness(0);opacity:.15}
.acell.done{box-shadow:0 0 0 2px var(--teal)}
.acell i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:10px;font-weight:700}
.ahead{display:grid;grid-template-columns:86px repeat(6,1fr);gap:5px;font-size:10.5px;font-weight:600;text-align:center;color:var(--ink2);position:sticky;top:-14px;background:var(--cream);padding-block:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border-radius:18px;margin-bottom:8px;box-shadow:0 2px 0 var(--line)}
.seg{display:flex;gap:2px;background:var(--wash);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--teal-d);box-shadow:0 2px 0 var(--line)}
.sech{margin:18px 4px 8px;font-size:15px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.setrow.col{flex-direction:column;align-items:stretch;gap:8px}
.rowtop{display:flex;justify-content:space-between;align-items:center}
input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:14px;align-items:baseline;color:var(--ink2)}
.stat b{font-size:20px;color:var(--ink)}
.meter{height:12px;background:var(--wash);border-radius:99px;margin:6px 0 12px;overflow:hidden}
.meter b{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px}
#chart{display:block;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto 12px;border-radius:26px;border:5px solid var(--paper);box-shadow:var(--shadow);image-rendering:pixelated;touch-action:manipulation;background:#3565cc;box-sizing:border-box}
.isles{display:flex;flex-direction:column;gap:8px}

.v-giant{transform:scale(1.22)}
.v-golden{filter:sepia(1) saturate(5) hue-rotate(2deg) brightness(1.18) drop-shadow(0 0 2px #ffd34a)}
.v-crystal{filter:grayscale(.3) hue-rotate(170deg) saturate(1.4) brightness(1.35) drop-shadow(0 0 2px #9ae8ff);opacity:.9}
.v-moonlit{filter:grayscale(.6) sepia(.2) hue-rotate(190deg) saturate(2) brightness(1.1) drop-shadow(0 0 3px #8aa8ff)}
.v-rainbow{animation:rb 1.6s linear infinite}
@keyframes rb{from{filter:saturate(2) hue-rotate(0deg) drop-shadow(0 0 2px #fff)}to{filter:saturate(2) hue-rotate(360deg) drop-shadow(0 0 2px #fff)}}

#fade{position:fixed;inset:0;background:#1a2450;z-index:9;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(#8fc6f4,#5c9be0);color:#fff;text-align:center;padding-inline:16px}
#boot h1{margin:0;font-size:44px;font-weight:700;letter-spacing:.01em;text-shadow:0 4px 0 #3c78c0}
#boot p{margin:0;font-size:16px;font-weight:600;opacity:.95}
@media (prefers-reduced-motion:reduce){.toast,.sheet,.float,.actionbar,.btn.ready::after{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="floats"></div>

<div class="hud">
  <div><div class="clockb"><div class="t" id="timeTxt">7:00</div><div class="d" id="dayTxt">Day 1 · morning</div></div><div class="loc" id="locTxt">Home</div></div>
  <div class="hud-r"><div class="chip"><img class="px" id="icoShell" alt="shells"><span id="shellTxt">0</span></div>
    <button class="chip lvl" id="lvlChip" aria-label="Island and settings"><img class="px" id="icoStar" alt=""><span class="lv"><span id="lvlTxt">Lv 1</span><i class="xpbar"><b id="xpFill"></b></i></span></button></div>
</div>
<div id="toasts"></div>
<div id="ctx" class="ctx"></div>
<div id="actionBar" class="actionbar" hidden><div class="tag" id="abTag"></div><div class="msg" id="abMsg"></div><div class="row" id="abRow"></div></div>

<nav class="dock" aria-label="Apps">
  <button class="btn" id="bSeed" style="--c:#fbe39a" aria-label="Choose seed"><span class="ico"><img class="px" id="seedImg" alt=""></span><span class="lb" id="seedTxt">Seeds</span></button>
  <button class="btn" id="bBag" style="--c:#f3d3a8"><span class="ico"><img class="px" id="icoBag" alt=""></span><span class="lb">Bag</span></button>
  <button class="btn" id="bShop" style="--c:#a6e3d8"><span class="ico"><img class="px" id="icoShop" alt=""></span><span class="lb">Shop</span></button>
  <button class="btn" id="bTask" style="--c:#ffc9a3"><span class="ico"><img class="px" id="icoTask" alt=""></span><span class="lb">Orders</span></button>
  <button class="btn" id="bChart" style="--c:#b7d7f7"><span class="ico"><img class="px" id="icoChart" alt=""></span><span class="lb">Chart</span></button>
  <button class="btn" id="bDex" style="--c:#fac3cf"><span class="ico"><img class="px" id="icoDex" alt=""></span><span class="lb" id="dexTxt">Dex</span></button>
</nav>

<section class="sheet" id="sheet" hidden>
  <header><h2 id="sheetTitle"></h2><button class="x" id="sheetX" aria-label="Close">×</button></header>
  <div class="tabs" id="sheetTabs"></div>
  <div class="sbody" id="sheetBody"></div>
</section>
<div id="fade"></div>
<div id="boot"><h1>Driftseed Isle</h1><p id="bootMsg">washing ashore…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('bootMsg').textContent='Could not load three.js — check your connection and reload.'; return; }
const T=THREE;
const $=id=>document.getElementById(id);

/* =========================================================
   Curved world: every vertex drops away with distance from the camera
   (shadow depth passes stay flat so shadows line up with lighting)
   ========================================================= */
const CURVE=0.0042;
T.ShaderChunk.project_vertex=`
vec4 mvPosition = vec4( transformed, 1.0 );
#ifdef USE_INSTANCING
	mvPosition = instanceMatrix * mvPosition;
#endif
#if defined( DEPTH_PACKING ) || defined( DISTANCE )
	mvPosition = modelViewMatrix * mvPosition;
#else
	vec4 cw_ = modelMatrix * mvPosition;
	vec3 vt_ = viewMatrix[3].xyz;
	vec3 cp_ = -vec3( dot( viewMatrix[0].xyz, vt_ ), dot( viewMatrix[1].xyz, vt_ ), dot( viewMatrix[2].xyz, vt_ ) );
	vec2 cd_ = cw_.xz - cp_.xz;
	cw_.y -= dot( cd_, cd_ ) * ${CURVE.toFixed(5)};
	mvPosition = viewMatrix * cw_;
#endif
gl_Position = projectionMatrix * mvPosition;
`;

/* =========================================================
   Utilities
   ========================================================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const K=(x,z)=>x+','+z;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash(x,z){const h=Math.sin(x*127.1+z*311.7)*43758.5453;return h-Math.floor(h);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hi(...a){let h=2166136261;for(const v of a){h^=(v|0)+0x9e3779b9+(h<<6)+(h>>>2);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
const pickR=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const shuffle=(a,R)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function pickW(table,filter=()=>true,wf=(k,v)=>v.w,rand=Math.random){let tot=0;const en=[];for(const k in table){if(!filter(k))continue;const w=wf(k,table[k]);if(w>0){en.push([k,w]);tot+=w;}}
  let r=rand()*tot;for(const [k,w] of en){if((r-=w)<=0)return k;}return en.length?en[en.length-1][0]:null;}
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;};

/* =========================================================
   Game data
   ========================================================= */
const DAY_LEN=480;
const CROPS={
  turnip:    {name:'Turnip',     seed:10,  price:28,  grow:36,  lvl:1, kind:'root',  col:0xf3eef4, top:0xb46ad0},
  radish:    {name:'Radish',     seed:12,  price:34,  grow:40,  lvl:1, kind:'root',  col:0xe8465a},
  carrot:    {name:'Carrot',     seed:15,  price:44,  grow:50,  lvl:1, kind:'root',  col:0xf08a2a},
  lettuce:   {name:'Lettuce',    seed:18,  price:52,  grow:55,  lvl:1, kind:'leafy', col:0x9ad060},
  onion:     {name:'Red Onion',  seed:20,  price:60,  grow:62,  lvl:2, kind:'root',  col:0xa04a8a},
  potato:    {name:'Potato',     seed:22,  price:66,  grow:70,  lvl:2, kind:'root',  col:0xc9a06a},

function sprite(rows,pal={}){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const cv=document.createElement('canvas');cv.width=w+2;cv.height=h+2;const cx=cv.getContext('2d');
  const on=(x,y)=>{const r=rows[y-1];if(!r)return false;const ch=r[x-1];return ch&&ch!=='.';};
  for(let y=0;y<h+2;y++)for(let x=0;x<w+2;x++){
    if(on(x,y)){const ch=rows[y-1][x-1];cx.fillStyle=pal[ch]||PAL[ch]||'#f0f';cx.fillRect(x,y,1,1);}
    else if(on(x+1,y)||on(x-1,y)||on(x,y+1)||on(x,y-1)){cx.fillStyle=PAL.k;cx.fillRect(x,y,1,1);}
  }
  return cv.toDataURL();
}

  uniforms:{tC:{value:null},tD:{value:null},res:{value:new T.Vector2(1,1)},levels:{value:22},cn:{value:NEAR},cf:{value:FAR}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`
    uniform sampler2D tC;uniform sampler2D tD;uniform vec2 res;uniform float levels;uniform float cn;uniform float cf;varying vec2 vUv;
    float b2(vec2 a){a=floor(a);return fract(a.x*.5+a.y*a.y*.75);}
    float bayer(vec2 a){return b2(.5*a)*.25+b2(a);}
    float lin(vec2 uv){float d=texture2D(tD,uv).r*2.-1.;return 2.*cn*cf/(cf+cn-d*(cf-cn));}
    void main(){
      vec3 c=texture2D(tC,vUv).rgb;
      float d=lin(vUv);
      vec2 px=1./res;
      float dn=max(max(lin(vUv+vec2(px.x,0.)),lin(vUv-vec2(px.x,0.))),max(lin(vUv+vec2(0.,px.y)),lin(vUv-vec2(0.,px.y))));
      float e=step(max(.45,d*.035),dn-d)*step(d,cf*.6);
      c=mix(c,c*vec3(.36,.32,.46),e*.9);
      float b=bayer(gl_FragCoord.xy)-.5;
      c=floor(c*levels+b+.5)/levels;
      gl_FragColor=vec4(c,1.);
    }`,
  depthTest:false,depthWrite:false
});

  S.rain=Math.random()<0.18;S.rainUntil=S.rain&&Math.random()<0.6?11+Math.random()*5:0;S.meteor=false;
  const wishes=Math.min(4,S.wishes||0);S.wishes=0;for(let i=0;i<wishes;i++){const c=islands[0].sand.filter(([x,z])=>freeTile(x,z));if(c.length){const [x,z]=pickR(c);S.finds.push({k:'starfrag',x,z});}}
  if(wishes&&!quiet)setTimeout(()=>toast('Star fragments washed up on your beach overnight!','rare',ICON['g:starfrag']),1200);
  if(S.rain)for(const k in S.tiles)S.tiles[k].w=1;
  let spr=0;for(const o of S.objs)if(o.k==='sprinkler'){spr++;for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const t=S.tiles[K(o.x+dx,o.z+dz)];if(t)t.w=1;}}
  const un=CROP_IDS.filter(id=>CROPS[id].lvl<=level());S.demand=pickR(un);
  for(let i=0;i<2;i++)spawnFind(true,islands[0]);for(let i=0;i<2;i++)spawnWeed(true);makeOrders();
  if(!quiet){rebuildSoil();syncLife();if(spr&&!S.rain){sprayT=2.5;}
    toast(`Day ${S.day} — ${S.rain?'rain is watering everything':'crops are thirsty'}. New orders are in, and wild plants have regrown.`,'',ICON.sprout);}
}
function rollVariant(x,z,mystery){
  const b=bonus.get(K(x,z));let boost=1+(b?Math.min(3,b.clover)*0.5:0);if(mystery)boost*=3;
  const r=Math.random();let acc=0;
  for(const id of ['rainbow','crystal','golden','moonlit','giant']){const v=VAR[id];const ch=id==='moonlit'?(isNight()?v.chance:0):v.chance;acc+=ch*boost;if(r<acc)return id;}
  return'normal';
}
function growCrops(dt,quiet,out){
  const night=isNight();
  for(const k in S.tiles){const t=S.tiles[k],c=t.crop;if(!c||c.p>=1||!t.w)continue;const C=CROPS[c.t];
    let r=hasWindmill?1.15:1;if(C.night)r*=night?1:0;if(C.day)r*=night?0.4:1.4;const b=bonus.get(k);if(b&&b.bee)r*=1.3;if(weedSlow.has(k))r*=0.75;
    if(r<=0)continue;const s0=stageOf(c.p);c.p=Math.min(1,c.p+dt*r/C.grow);
    if(c.p>=1){const [x,z]=k.split(',').map(Number);c.v=rollVariant(x,z,c.m);if(out)out.push(c);
      if(!quiet){syncCrop(k);if(c.v!=='normal'){const V=VAR[c.v];toast(`A <b>${V.name} ${C.name}</b> is ready to harvest!`,'rare',seedIcon(c.t),c.v);SFX.rare();burst(x,0.9,z,0xfff0a0,14,1.4,0.07,2);}else SFX.pop();}}
    else if(!quiet&&stageOf(c.p)!==s0)syncCrop(k);}
}
function advance(dt){const prev=S.hour;S.hour+=dt*24/DAY_LEN;if(S.hour>=24)S.hour-=24;if(prev<6&&S.hour>=6)dawn(false);if(prev<19&&S.hour>=19)duskEvent();
  if(S.rain&&S.rainUntil&&S.hour>=S.rainUntil&&S.hour<19&&S.hour>6)stopRain();growCrops(dt,false);}
function simulate(sec){const out=[];let left=sec;while(left>0){const d=Math.min(1,left);left-=d;const prev=S.hour;S.hour+=d*24/DAY_LEN;if(S.hour>=24)S.hour-=24;if(prev<6&&S.hour>=6)dawn(true);growCrops(d,true,out);}return out;}

let AC=null,waves=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d=0.12,type='square',v=0.04,f2){if(!S.sound)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
let noiseBuf=null;
function noise(d=0.15,v=0.05,freq=800,q=1){if(!S.sound)return;const a=ac();if(!a)return;
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random());s.stop(t+d+0.02);}
function startWaves(){const a=ac();if(!a||waves)return;noise(0.01,0.0001);if(!noiseBuf)return;
  const s=a.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
  const g=a.createGain();g.gain.value=0;const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=0.12;lg.gain.value=0.012;lfo.connect(lg);lg.connect(g.gain);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();lfo.start();waves={g,f};setWaveVol();}
function setWaveVol(){if(waves)waves.g.gain.value=S.sound?0.018:0;}

function toast(html,cls='',icon,variant){const el=document.createElement('div');el.className='toast '+cls;
  el.innerHTML=(icon?`<img class="px v-${variant||'normal'}" src="${icon}" alt="">`:'')+`<span>${html}</span>`;
  const box=$('toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);},cls==='rare'?4200:2800);}
function floatText(x,y,z,text,cls=''){const [sx,sy]=toScreen(x,y,z);
  const el=document.createElement('div');el.className='float '+cls;el.textContent=text;el.style.left=sx+'px';el.style.top=sy+'px';$('floats').appendChild(el);setTimeout(()=>el.remove(),1250);}
function setAction(msg,btns,tag='',onTap=null){const ab=$('actionBar');$('abMsg').innerHTML=msg;$('abTag').textContent=tag;ab.classList.toggle('tapnext',!!onTap);ab.onclick=onTap?(e=>{if(!e.target.closest('button'))onTap();}):null;
  ab.style.animation='none';void ab.offsetWidth;ab.style.animation='';const row=$('abRow');row.innerHTML='';
  for(const b of btns){const e=document.createElement('button');e.className='pbtn '+(b.cls||'');e.textContent=b.label;if(b.disabled)e.disabled=true;e.onclick=()=>{SFX.ui();b.fn&&b.fn();};row.appendChild(e);}
  ab.hidden=false;updateCtx();}
function clearAction(){const ab=$('actionBar');ab.hidden=true;ab.onclick=null;ab.classList.remove('tapnext');updateCtx();}

function locName(){if(S.sea){const [isl,d]=nearestIsland(vil.x,vil.z);return d<9&&S.disc[isl.id]?'Near '+isl.name:d<9?'Uncharted waters':'Open sea';}
  const isl=curIsl()||nearestIsland(vil.x,vil.z)[0];return isl?(isl.home?(farmQ(vil.x,vil.z)<1.1?'Farm':'Home'):isl.name):'';}
function updateHUD(){

function tickShells(dt){if(shownShells!==S.shells){const d=S.shells-shownShells;shownShells+=Math.sign(d)*Math.max(1,Math.abs(d)*Math.min(1,dt*8));if(Math.abs(S.shells-shownShells)<1)shownShells=S.shells;$('shellTxt').textContent=fmt(shownShells);}}

const rarity=w=>w>=15?'Common':w>=6?'Uncommon':w>=2.5?'Rare':'Legendary';
function itemInfo(key){const pre=key.slice(0,2),id=key.slice(2);if(pre==='f:')return FISH[id];if(pre==='b:')return BUGS[id];if(pre==='g:')return FINDS[id];if(pre==='p:')return PLANTS[id];if(pre==='m:')return MATS[id];return null;}
function nameOf(key){const I=itemInfo(key);if(I)return I.name;if(key.startsWith('c:'))return CROPS[key.slice(2)].name;const [t,v]=key.split('|');return(VAR[v].name?VAR[v].name+' ':'')+CROPS[t].name;}
function iconOf(key){if(key.startsWith('c:'))return seedIcon(key.slice(2));if(key.includes(':'))return ICON[key];return seedIcon(key.split('|')[0]);}
function varOf(key){return key.includes(':')?'normal':key.split('|')[1];}
function gain(key,n=1){S.inv[key]=(S.inv[key]||0)+n;const first=!S.alm[key];S.alm[key]=(S.alm[key]||0)+n;if(first&&key.includes(':'))setTimeout(()=>checkDex(key),600);return first;}
function checkDex(key){const cat=DEX_CATS.find(c=>key.startsWith(c[2]));if(!cat)return;const [id,label,pre,tab]=cat;
  if(!S.dexR[id]&&Object.keys(tab).every(k=>S.alm[pre+k])){S.dexR[id]=1;const r=5000;S.shells+=r;SFX.discover();toast(`Islandex: every ${label.toLowerCase()} recorded! +${fmt(r)} shells`,'rare',ICON.dex);}
  const [g,t]=dexCount();if(g===t&&!S.dexR.all){S.dexR.all=1;setTimeout(()=>{SFX.discover();toast('You completed the Islandex! Every creature, plant and treasure of the archipelago is yours.','rare',ICON.star);for(let i=0;i<40;i++)sparkle(vil.x+(Math.random()-0.5)*4,1,vil.z+(Math.random()-0.5)*4,0xfff0a0);},1500);}}
function priceOf(key){const I=itemInfo(key);if(I)return I.price;const [t,v]=key.split('|');return Math.round(CROPS[t].price*VAR[v].mult*(S.demand===t?1.5:1));}
function sell(key,n){const have=S.inv[key]||0;n=Math.min(n,have);if(!n)return 0;const g=priceOf(key)*n;S.inv[key]=have-n;if(!S.inv[key])delete S.inv[key];S.shells+=g;S.earned+=g;return g;}

/* =========================================================
   Farming & island actions
   ========================================================= */
function walkTo(x,z){const dx=x-vil.x,dz=z-vil.z,d=Math.hypot(dx,dz)||1;vil.tx=x-dx/d*0.62;vil.tz=z-dz/d*0.62;vil.idle=0;vil.cb=null;}
function goTo(x,z,cb){vil.tx=x;vil.tz=z;vil.idle=0;vil.cb=cb||null;}
function plant(k,x,z){
  const id=S.seed,info=id==='mystery'?MYSTERY:CROPS[id];
  if(S.free[id]){S.free[id]--;if(!S.free[id])delete S.free[id];}
  else if(S.shells<info.seed){toast(`You need ${info.seed} shells for ${info.name}. Sell something or go exploring.`);SFX.no();return;}
  else S.shells-=info.seed;
  const type=id==='mystery'?pickR(CROP_IDS):id;
  S.tiles[k].crop={t:type,p:0,v:null,m:id==='mystery'?1:0};syncCrop(k);SFX.plant();burst(x,0.6,z,0x6a4a30,6,0.8,0.06);walkTo(x,z);
  if(id==='mystery')floatText(x,1.2,z,'? '+CROPS[type].name);
  if(S.tut===0){S.tut=1;setTimeout(()=>toast(`Seeds only grow on days they're watered — tap the planted soil to water it.`,'',ICON.sprout),600);}
}
function harvest(k,x,z){
  const t=S.tiles[k],c=t.crop,C=CROPS[c.t],V=VAR[c.v||'normal'];const key=c.t+'|'+V.id;
  const first=gain(key);S.harvested++;
  t.crop=null;syncCrop(k);walkTo(x,z);vil.hop=0.3;
  burst(x,0.8,z,C.col,10,1.5,0.08);if(V.id!=='normal')for(let i=0;i<10;i++)sparkle(x,0.8,z,0xfff0a0);
  floatText(x,1.3,z,'+ '+(V.name?V.name+' ':'')+C.name,V.id!=='normal'?'gold':'');
  addXP(Math.max(2,Math.round(C.price*V.mult/8)));
  if(first&&V.id!=='normal'){SFX.rare();toast(`New discovery! <b>${V.name} ${C.name}</b> added to your Islandex.`,'rare',seedIcon(c.t),V.id);}else SFX.harvest();
  checkRow(c.t);
  if(S.tut<2){S.tut=2;setTimeout(()=>toast('Tap the shipping bin by your tent, or open your Bag, to sell.','',ICON.bag),700);
    setTimeout(()=>toast('While crops grow, board your boat at the dock and explore other islands to fill your Islandex!','',ICON.boat),5200);}
}
function checkRow(type){if(S.almR[type])return;if(VARIANTS.every(v=>S.alm[type+'|'+v.id])){S.almR[type]=1;const r=CROPS[type].price*6;S.shells+=r;SFX.level();
  toast(`Crop page complete: ${CROPS[type].name}! Reward +${fmt(r)} shells`,'rare',seedIcon(type),'rainbow');}}

function farmTap(x,z){
  const f=fixedAt(x,z);
  if(f==='bin'){walkTo(x,z);openSheet('bag');return;}
  if(f==='house'){walkTo(HOUSE_AT.x+0.5,HOUSE_AT.z+2);houseTap();return;}
  const o=objAt(x,z);if(o){const B=BUILD[o.k];toast(`<b>${B.name}</b> — ${B.desc}`);return;}
  const type=landMap.get(K(x,z));if(!isLandT(type))return;
  const k=K(x,z),t=S.tiles[k];
  if(!t){if(type!=='grass'){goTo(x,z);return;}
    S.tiles[k]={w:S.rain?1:0,crop:null};rebuildSoil();SFX.till();burst(x,0.6,z,0x8a5a3a,8,1.2,0.07);walkTo(x,z);vil.hop=0.25;return;}
  if(!t.crop){plant(k,x,z);return;}
  const c=t.crop,C=CROPS[c.t];
  if(c.p>=1){harvest(k,x,z);return;}
  if(!t.w){const r=S.can?1:0;for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){const q=S.tiles[K(x+dx,z+dz)];if(!q)continue;q.w=1;for(let i=0;i<6;i++)emit(x+dx+(Math.random()-0.5)*0.5,1.2,z+dz+(Math.random()-0.5)*0.5,{vy:-1,life:0.5,max:0.5,size:0.06,color:0x8ac4ff,g:6});}
    rebuildSoil();SFX.water();walkTo(x,z);
    if(S.tut===1){S.tut=1.5;setTimeout(()=>toast('Watered soil stays wet until the next dawn. Crops ripen while you explore.','',ICON.sprout),600);}return;}
  if(c.td!==S.day){c.td=S.day;const s0=stageOf(c.p);c.p=Math.min(0.995,c.p+0.08);if(stageOf(c.p)!==s0)syncCrop(k);hearts(x,0.9,z);tone(880,0.08,'triangle',0.04);setTimeout(()=>tone(1175,0.1,'triangle',0.035),70);walkTo(x,z);vil.hop=0.25;
    floatText(x,1.2,z,'tended +8%');return;}
  let hint='';if(C.night&&!isNight())hint=' · blooms only at night';if(C.day&&isNight())hint=' · slow at night';
  toast(`${C.name} · ${Math.floor(c.p*100)}% grown · already tended today${hint}`,'',seedIcon(c.t));
}
function houseTap(){
  if(S.hour>=19||S.hour<5){setAction(`It's getting late… sleep until morning in your ${HOUSES[S.house].toLowerCase()}?`,[{label:'Sleep',cls:'go',fn:sleep},{label:'Stay up',fn:clearAction}],'Home');}
  else toast(`Your ${HOUSES[S.house].toLowerCase()}.${S.house<3?' Upgrade it in Shop → Island.':' Home sweet villa.'}`);
}

  setTimeout(()=>{const sec=((6.02-S.hour+24)%24)*DAY_LEN/24;const out=simulate(sec);afterSim(out,'While you slept');$('fade').classList.remove('on');},650);}
function afterSim(out,label){rebuildSoil();syncAllCrops();syncLife();for(const isl of islands)if(isl.pgroup)syncPlants(isl);
  if(out.length){const rare=out.filter(c=>c.v!=='normal').length;toast(`${label}: ${out.length} crop${out.length>1?'s':''} ripened${rare?` — ${rare} rare!`:''}`,rare?'rare':'',ICON.sprout);}
  toast(`Day ${S.day}${S.rain?' — rain today':''}. The market wants <b>${CROPS[S.demand].name}</b>.`,'',seedIcon(S.demand));}
function editTap(x,z){
  if(!onHome(x,z))return;
  const f=fixedAt(x,z);if(f){toast(f==='house'?'Your home stays put — upgrade it in Shop → Island.':'The shipping bin stays by your home.');return;}
  const o=objAt(x,z);
  if(o){const B=BUILD[o.k];setAction(`<b>${B.name}</b>`,[
    {label:'Move',cls:'go',fn:()=>{removeObj(o);S.store[o.k]=(S.store[o.k]||0)+1;startPlace(o.k,true,o.r||0);}},
    {label:'Store',fn:()=>{removeObj(o);S.store[o.k]=(S.store[o.k]||0)+1;toast(`${B.name} put in storage. Place it again from the Shop.`);clearAction();}},

const THUMB={};
function makeThumbs(){
  const ts=new T.Scene();ts.add(new T.HemisphereLight(0xfff4e0,0x6a6a8a,0.8));const dl=new T.DirectionalLight(0xffffff,0.8);dl.position.set(3,6,5);ts.add(dl);
  const tc=new T.OrthographicCamera(-1,1,1,-1,0.1,60);const size=48;const trt=new T.WebGLRenderTarget(size,size,{minFilter:T.NearestFilter,magFilter:T.NearestFilter});
  const buf=new Uint8Array(size*size*4);const cv=document.createElement('canvas');cv.width=cv.height=size;const cx=cv.getContext('2d');const img=cx.createImageData(size,size);
  const snap=(g)=>{g.traverse(o=>{if(o.userData.noThumb)o.visible=false;});ts.add(g);const box=new T.Box3().setFromObject(g);const c=box.getCenter(new T.Vector3());const s=box.getSize(new T.Vector3());
    const r=Math.max(s.x,s.y,s.z)*0.62;tc.left=-r;tc.right=r;tc.top=r;tc.bottom=-r;tc.position.set(c.x+10,c.y+7,c.z+10);tc.lookAt(c);tc.updateProjectionMatrix();tc.updateMatrixWorld();
    const old=glowMat.emissiveIntensity;glowMat.emissiveIntensity=0.4;renderer.setRenderTarget(trt);renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(ts,tc);
    renderer.readRenderTargetPixels(trt,0,0,size,size,buf);renderer.setRenderTarget(null);glowMat.emissiveIntensity=old;ts.remove(g);
    for(let y=0;y<size;y++)for(let x=0;x<size;x++){const si=((size-1-y)*size+x)*4,di=(y*size+x)*4;img.data[di]=buf[si];img.data[di+1]=buf[si+1];img.data[di+2]=buf[si+2];img.data[di+3]=buf[si+3];}
    cx.putImageData(img,0,0);return cv.toDataURL();};
  for(const k in BUILD)THUMB[k]=snap(objGroup(k,3,0));
  for(let i=0;i<4;i++)THUMB['house'+i]=snap(houseGroup(i));
  const isl=new T.Group();for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++){const d=Math.hypot(x*0.9,z);if(d<3.4){const m=new T.Mesh(BOX,toon({color:d<2.2?0x6aa843:0xe9d3a4}));m.scale.set(1,d<2.2?1:0.8,1);m.position.set(x,0,z);isl.add(m);}}
  isl.add(objGroup('pine',2).translateX(-0.5).translateY(0.5));THUMB.land=snap(isl);
  trt.dispose();renderer.setClearColor(0x000000,1);
}

function drawChart(){const cv=$('chart');if(!cv)return;const g=cv.getContext('2d'),N=320;g.imageSmoothingEnabled=false;
  const disc=islands.filter(i=>S.disc[i.id]);let E=40;for(const i of disc)E=Math.max(E,Math.hypot(i.cx,i.cz)+14);E=Math.max(E,Math.hypot(vil.x,vil.z)+14);
  const und=islands.filter(i=>!S.disc[i.id]).sort((a,b)=>Math.hypot(a.cx-vil.x,a.cz-vil.z)-Math.hypot(b.cx-vil.x,b.cz-vil.z)).slice(0,2);
  for(const i of und)E=Math.max(E,Math.hypot(i.cx,i.cz)+14);
  const sc=(N/2-10)/E;const X=x=>N/2+x*sc,Y=z=>N/2+z*sc;
  g.fillStyle='#3565cc';g.fillRect(0,0,N,N);g.fillStyle='rgba(255,255,255,.12)';for(let x=0;x<N;x+=20)for(let y=0;y<N;y+=20)g.fillRect(x,y,2,2);
  const px=2,hex=c=>'#'+c.toString(16).padStart(6,'0');
  for(const isl of disc){const R=islR(isl)/0.62+2.2;const B=BIOMES[isl.biome];
    for(let wx=isl.home?Math.min(-R,FARM.x-11):-R;wx<=R;wx+=px/sc)for(let wz=-R;wz<=R;wz+=px/sc){const t=tileTypeI(isl,Math.round(isl.cx+wx),Math.round(isl.cz+wz));if(!t)continue;
      g.fillStyle=t==='grass'?hex(B.grass[0]):t==='sand'?hex(B.sand[0]):t==='s1'?'#7ea6e8':'#5584da';
      g.fillRect(Math.round(X(isl.cx+wx)/px)*px,Math.round(Y(isl.cz+wz)/px)*px,px,px);}}
  g.fillStyle='#a27a50';for(const [x,z] of islands[0].bridge||[])g.fillRect(Math.round(X(x-0.5)),Math.round(Y(z-0.5)),Math.max(2,Math.ceil(sc)),Math.max(2,Math.ceil(sc)));
  g.font='12px "Fredoka", sans-serif';g.textAlign='center';
  for(const isl of disc){const R=islR(isl)/0.7;const y=Math.max(12,Y(isl.cz)-R*sc-5);g.fillStyle='#2b1e2e';g.fillText(isl.name,X(isl.cx)+1,y+1);g.fillStyle='#fff6e2';g.fillText(isl.name,X(isl.cx),y);}
  g.font='bold 16px "Fredoka", sans-serif';for(const i of und){const jx=(hash(i.id,1)-0.5)*16,jz=(hash(1,i.id)-0.5)*16;g.fillStyle='#2b1e2e';g.fillText('?',X(i.cx+jx)+1,Y(i.cz+jz)+6);g.fillStyle='#fff3c4';g.fillText('?',X(i.cx+jx),Y(i.cz+jz)+5);}
  g.fillStyle='#2b1e2e';g.fillRect(Math.round(X(vil.x))-4,Math.round(Y(vil.z))-4,8,8);g.fillStyle=S.sea?'#f6d04a':'#d8453a';g.fillRect(Math.round(X(vil.x))-2,Math.round(Y(vil.z))-2,4,4);
  cv.onclick=e=>{const r=cv.getBoundingClientRect();const wx=((e.clientX-r.left)/r.width*N-N/2)/sc,wz=((e.clientY-r.top)/r.height*N-N/2)/sc;
    let best=null,bd=1e9;for(const isl of disc){const d=Math.hypot(isl.cx-wx,isl.cz-wz);if(d<bd){bd=d;best=isl;}}if(best&&bd<18/sc+islR(best)){chartGo(best);}};}

function stopRain(){S.rain=false;S.rainUntil=0;if(S.hour>7&&S.hour<18){rainbowT=50;toast('The rain has stopped… look, a rainbow!','rare',ICON.star);}}
function duskEvent(){S.meteor=!S.rain&&Math.random()<0.22;if(S.meteor)toast('Tonight there will be a meteor shower! Tap the sky when a star falls to make a wish.','rare',ICON.star);}
const STAR_T=[],STAR_F=[];for(let i=0;i<STARN;i++){STAR_T.push(Math.random()*6.283);STAR_F.push(Math.random()*1.3);}
function skyPos(theta,f,d,out,curved=true){const cp=camera.position,hc=cp.y,aT=cam.pitch-camera.fov/2*Math.PI/180,aH=Math.atan(2*Math.sqrt(Math.max(0.05,hc)*CURVE)),a=lerp(aH,aT,f);
  return out.set(cp.x+Math.sin(theta)*d,hc-d*Math.tan(a)+(curved?CURVE*d*d:0),cp.z+Math.cos(theta)*d);}
function skySpan(d){const hc=camera.position.y,aT=cam.pitch-camera.fov/2*Math.PI/180,aH=Math.atan(2*Math.sqrt(Math.max(0.05,hc)*CURVE));return d*(Math.tan(aH)-Math.tan(aT));}
function updateSky(dt,tt){
  const cp=camera.position,sky=skyHz,night=nightF,fwd=cam.yaw+Math.PI;
  for(const c of skyClouds){c.a+=dt*0.004*(0.5+wind);skyPos(c.a,c.f,c.d,c.m.position);c.m.scale.setScalar(c.s*c.d/140);c.m.lookAt(cp.x,c.m.position.y,cp.z);}
  skyCloudMat.color.setRGB(1,1,1).lerp(sky,0.25+rainMix*0.35).lerp(skyGlow,skyGA*0.45).multiplyScalar(1-night*0.6);skyCloudMat.opacity=0.95;
  moon.visible=night>0.05;
  if(moon.visible){skyPos(fwd+0.28,0.55,150,moon.position);moon.scale.setScalar(0.8);moon.lookAt(cp);moon.traverse(o=>{if(o.material)o.material.opacity=(o.material.color.getHex()===0xfff4d6&&o.geometry.parameters.radius===9?0.12:1)*night*(1-rainMix);});}
  stars.visible=night>0.02;if(stars.visible){const pa=starGeo.attributes.position.array;for(let i=0;i<STARN;i++){skyPos(STAR_T[i],STAR_F[i],190,_v,false);pa[i*3]=_v.x;pa[i*3+1]=_v.y;pa[i*3+2]=_v.z;}starGeo.attributes.position.needsUpdate=true;}
  // shooting stars
  if(!shoot&&night>0.8&&!S.rain&&Math.random()<dt*(S.meteor?0.35:0.025))spawnShootingStar();
  if(shoot){shoot.t+=dt;shoot.th+=shoot.vth*dt;shoot.f+=shoot.vf*dt;const pa=shootGeo.attributes.position.array,tl=0.18;
    skyPos(shoot.th,shoot.f,140,_v);pa[0]=_v.x;pa[1]=_v.y;pa[2]=_v.z;skyPos(shoot.th-shoot.vth*tl,shoot.f-shoot.vf*tl,140,_v);pa[3]=_v.x;pa[4]=_v.y;pa[5]=_v.z;shootGeo.attributes.position.needsUpdate=true;
    shootLine.material.opacity=Math.sin(Math.min(1,shoot.t/shoot.life)*Math.PI);if(shoot.t>shoot.life){shoot=null;shootLine.visible=false;}}
  // rainbow opposite the sun
  if(rainbowT>0){rainbowT-=dt;rainbow.visible=true;skyPos(fwd+0.2,-0.05,175,rainbow.position);rainbow.scale.setScalar(skySpan(175)*0.95/58);rainbow.lookAt(cp.x,rainbow.position.y,cp.z);
    const o=Math.min(1,rainbowT/8,(50-rainbowT)/4)*0.5*(1-night);rainbow.children.forEach(m=>m.material.opacity=o);}else rainbow.visible=false;
}

// --- falling petals, leaves, snow, embers and spores around the player ---
const MOTEN=150,moteGeo=new T.BufferGeometry(),motePos=new Float32Array(MOTEN*3),moteCol=new Float32Array(MOTEN*3);
moteGeo.setAttribute('position',new T.BufferAttribute(motePos,3));moteGeo.setAttribute('color',new T.BufferAttribute(moteCol,3));
const moteMat=new T.PointsMaterial({size:3,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false});
const motes=new T.Points(moteGeo,moteMat);motes.frustumCulled=false;scene.add(motes);
const MOTE_KINDS={petals:{n:40,size:3,cols:[0xf7c3d3,0xfbe3ea,0xffffff],vy:-0.35,sway:0.7},leaves:{n:65,size:3,cols:[0xe8803a,0xd8502a,0xf0b040,0xb8602a],vy:-0.5,sway:0.9},
  snow:{n:150,size:2,cols:[0xffffff,0xe8f0ff],vy:-0.6,sway:0.4},embers:{n:60,size:2,cols:[0xff9a3a,0xffcf6a,0xff6a2a],vy:0.7,sway:0.5},
  pollen:{n:45,size:2,cols:[0xfff4b0,0xffffff],vy:-0.05,sway:0.25},spores:{n:55,size:2,cols:[0xc8f0a8,0xe0ffc8],vy:0.12,sway:0.3}};
let moteKind='',moteSt=[];
function wantMotes(){if(S.rain)return'';const isl=S.sea?null:curIsl(),b=isl?isl.biome:(S.sea?regionAt(vil.x,vil.z):'open');const night=nightF>0.6;
  if(b==='snow')return'snow';if(b==='autumn')return'leaves';if(b==='volcano')return'embers';if(b==='swamp')return'spores';
  if(night)return'';if(b==='home'||b==='meadow')return'petals';if(b==='tropic'||b==='pine')return'pollen';return'';}
function updateMotes(dt,tt){const k=wantMotes();
  if(k!==moteKind){moteKind=k;moteSt=[];const K2=MOTE_KINDS[k];moteGeo.setDrawRange(0,K2?K2.n:0);
    if(K2){moteMat.size=K2.size;for(let i=0;i<K2.n;i++){const c=_c.set(K2.cols[i%K2.cols.length]);moteCol.set([c.r,c.g,c.b],i*3);
      moteSt.push({x:cam.tx+(Math.random()-0.5)*28,y:Math.random()*8,z:cam.tz+(Math.random()-0.5)*28,ph:Math.random()*6.28,sp:0.6+Math.random()*0.8});}moteGeo.attributes.color.needsUpdate=true;}}
  const K2=MOTE_KINDS[moteKind];if(!K2)return;
  for(let i=0;i<moteSt.length;i++){const m=moteSt[i];m.y+=K2.vy*m.sp*dt;m.x+=(wind*0.8+Math.sin(tt*1.2+m.ph)*K2.sway)*dt;m.z+=Math.cos(tt*0.9+m.ph)*K2.sway*dt;
    if(K2.vy<0&&m.y<0.1)m.y=8;if(K2.vy>0&&m.y>8){m.y=0.3;}
    if(m.x-cam.tx>14)m.x-=28;if(m.x-cam.tx<-14)m.x+=28;if(m.z-cam.tz>14)m.z-=28;if(m.z-cam.tz<-14)m.z+=28;
    motePos[i*3]=m.x;motePos[i*3+1]=m.y;motePos[i*3+2]=m.z;}
  moteGeo.attributes.position.needsUpdate=true;moteMat.opacity=moteKind==='snow'||moteKind==='embers'?0.95:0.9*(1-nightF*0.7);}

// --- soundscape: music box melody, birdsong, crickets, rain ---
const SCALES={day:[523.25,587.33,659.25,783.99,880,1046.5,1174.66],eve:[392,440,523.25,587.33,659.25,783.99],night:[293.66,329.63,392,440,493.88,587.33]};
let musT=1,beat=0,mel=2,birdT=4,crickT=3;
function pluck(f,v=0.02,d=0.9){const a=AC;if(!a||!S.sound)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);}
function chirp(){const a=AC;if(!a||!S.sound)return;const n=2+Math.floor(Math.random()*3),base=2200+Math.random()*1400;
  for(let i=0;i<n;i++){const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*0.11;o.type='sine';o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*1.35,t+0.07);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.012,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+0.1);}}
function crickets(){for(let i=0;i<6;i++)setTimeout(()=>noise(0.03,0.012,4800,6),i*55);}
function updateAudio(dt){if(!AC||!S.sound)return;
  if(waves){waves.g.gain.value=0.018+rainMix*0.035;if(waves.f)waves.f.frequency.value=420+rainMix*1600;}
  if(S.music!==false){musT-=dt;if(musT<=0){const night=nightF>0.6,sc=night?SCALES.night:S.hour>16?SCALES.eve:SCALES.day;musT=night?0.85:0.55;beat++;
    mel=clamp(mel+Math.round((Math.random()-0.5)*3),0,sc.length-1);if(Math.random()<(night?0.45:0.6))pluck(sc[mel],night?0.014:0.017,night?1.4:0.9);
    if(beat%8===0)pluck(sc[0]/2,0.02,1.8);if(beat%8===4)pluck(sc[2]/2,0.014,1.4);}}
  const land=!S.sea;
  if(nightF<0.3&&!S.rain&&land){birdT-=dt;if(birdT<=0){birdT=3+Math.random()*7;chirp();}}
  if(nightF>0.6&&!S.rain&&land){crickT-=dt;if(crickT<=0){crickT=1.5+Math.random()*3;crickets();}}}

function updateAtmos(dt,tt){
  windT-=dt;if(windT<=0){windT=4+Math.random()*6;}wind=lerp(wind,0.3+0.5*Math.sin(tt*0.13)+0.25*Math.sin(tt*0.41),Math.min(1,dt));
  updateFoam(tt);updatePrints(dt);updateSky(dt,tt);updateMotes(dt,tt);updateAudio(dt);
  if(!S.sea){if(lastVX!==null){const d=Math.hypot(vil.x-lastVX,vil.z-lastVZ);if(d>0.001&&d<1){stepAcc+=d;if(stepAcc>0.3){stepAcc=0;footstep();}}}
    else stepAcc=0;}
  lastVX=vil.x;lastVZ=vil.z;
  // idle: glance around like a villager
  if(!S.sea&&!fishing&&!caught&&vil.idle>2.5)villager.rotation.y+=Math.sin(tt*0.9)*0.006;
  // swamp islands hold a low mist
  const sw=(curIsl()||{}).biome==='swamp'?1:0;fogBoost=lerp(fogBoost,sw,Math.min(1,dt*0.8));
}
let fogBoost=0;

/* =========================================================
   Main loop
   ========================================================= */
let last=performance.now(),tt=0,saveT=0,hudT=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;tt+=dt;
  advance(dt*devSpeed);
  rainMix=clamp(rainMix+(S.rain?dt:-dt)*0.5,0,1);
  grassU.uTime.value=tt;grassU.uWind.value=1+rainMix*1.3;grassU.uPl.value.set(vil.x,S.sea?-99:vil.y,vil.z);
  if(!S.sea){
    const dx=vil.tx-vil.x,dz=vil.tz-vil.z,d=Math.hypot(dx,dz);
    if(d>0.04){const sp=Math.min(d,dt*3);vil.x+=dx/d*sp;vil.z+=dz/d*sp;villager.rotation.y=Math.atan2(dx,dz);}
    else{if(vil.cb){const cb=vil.cb;vil.cb=null;cb();}
      else if(!fishing){vil.idle+=dt;if(vil.idle>7+Math.random()*4){vil.idle=0;const isl=curIsl();if(isl){const tx=Math.round(vil.x+(Math.random()-0.5)*5),tz=Math.round(vil.z+(Math.random()-0.5)*5);
        if(islMap.get(K(tx,tz))===isl.id&&isLand(tx,tz)&&!objAt(tx,tz)&&!fixedAt(tx,tz)){vil.tx=tx+(Math.random()-0.5)*0.4;vil.tz=tz+(Math.random()-0.5)*0.4;}}}}}
    if(!S.sea){const ty=topY(Math.round(vil.x),Math.round(vil.z))||0.15;if(ty-vil.y>0.3&&vil.hop<=0)vil.hop=0.4;vil.y=lerp(vil.y,ty,Math.min(1,dt*10));vil.hop=Math.max(0,vil.hop-dt);
      villager.position.set(vil.x,vil.y+(d>0.04?Math.abs(Math.sin(tt*14))*0.07:0)+Math.sin(vil.hop/0.4*Math.PI)*0.3*(vil.hop>0),vil.z);}
  }
  updateBoat(dt,tt);
  if(S.sea){vil.hop=Math.max(0,vil.hop-dt);villager.position.set(vil.x,0.14+Math.sin(tt*1.5)*0.04+Math.sin(vil.hop/0.35*Math.PI)*0.3*(vil.hop>0),vil.z);if(!fishing)villager.rotation.y=S.boat.r;}
  const k=paint?0:Math.min(1,dt*3);cam.tx+=(vil.x-cam.tx)*k;cam.tz+=(vil.z-cam.tz)*k;applyCam(); // hold the view still while drag-farming so tiles stay under the finger
  applyTime();
  water.position.set(Math.round(cam.tx/10)*10,0,Math.round(cam.tz/10)*10);
  scene.fog.near=cam.dist+18-fogBoost*14;scene.fog.far=cam.dist+95-fogBoost*45;
  for(const {g} of cropMeshes.values())g.rotation.z=Math.sin(tt*1.6+g.userData.ph)*0.035;
  for(const {g,v,s} of cropMeshes.values())if(s===3&&v&&v!=='normal'&&Math.random()<dt*1.6)sparkle(g.position.x,0.8,g.position.z,v==='golden'?0xffe27a:v==='crystal'?0xbff4ff:v==='moonlit'?0xc8d4ff:0xffffff);
  rainbowMat.color.setHSL((tt*0.25)%1,0.85,0.6);rainbowMat.emissive.setHSL((tt*0.25)%1,0.9,0.18);
  for(const a of anims)a(tt,dt);
  updateLife(dt,tt);updateAtmos(dt,tt);updateSeaLife(dt,tt);updateDebris(dt,tt);
  if(sprayT>0){sprayT-=dt;for(const o of S.objs)if(o.k==='sprinkler'&&Math.random()<0.8){const a=Math.random()*6.28;emit(o.x,topY(o.x,o.z)+0.4,o.z,{vx:Math.cos(a)*1.6,vy:1.6,vz:Math.sin(a)*1.6,life:0.6,max:0.6,size:0.05,color:0x9ad0ff,g:6});}}
  for(const c of clouds){const u=c.userData;u.ox+=dt*u.sp;const rx=((u.ox-cam.tx)%80+120)%80-40,rz=((u.oz-cam.tz)%80+120)%80-40;c.position.set(cam.tx+rx,11,cam.tz+rz);}
  const day=1-nightF;
  for(const g of gulls){const u=g.userData,a=tt*u.sp+u.ph;g.visible=day>0.3;g.position.set(cam.tx+Math.cos(a)*u.r,u.y+Math.sin(tt*0.7+u.ph)*0.3,cam.tz+Math.sin(a)*u.r*0.8);g.rotation.y=-a;g.rotation.z=0.25;
    const f=Math.sin(tt*7+u.ph)*0.5;u.wl.rotation.z=f;u.wr.rotation.z=-f;}
  {const a=tt*0.03,r=21;npcBoat.position.set(Math.cos(a)*r,Math.sin(tt*1.3)*0.03,Math.sin(a)*r*0.8);npcBoat.rotation.y=-a;npcBoat.rotation.z=Math.sin(tt*0.9)*0.04;
    if(Math.random()<dt*9&&Math.hypot(npcBoat.position.x-cam.tx,npcBoat.position.z-cam.tz)<50)emit(npcBoat.position.x-Math.cos(a+1.57)*0.9+(Math.random()-0.5)*0.3,0.03,npcBoat.position.z-Math.sin(a+1.57)*0.72+(Math.random()-0.5)*0.3,{life:2.2,max:2.2,size:0.14,color:0xe8f0ff});}
  _e.set(0,cam.yaw,0);_q.setFromEuler(_e);
  for(let i=0;i<GLINTS;i++){const g=glintData[i];const s=Math.pow(Math.max(0,Math.sin(tt*g.sp+g.ph)),6);const gx=cam.tx+((g.x-cam.tx)%70+105)%70-35,gz=cam.tz+((g.z-cam.tz)%70+105)%70-35;
    _m.compose(_v.set(gx,0.02,gz),_q,_s.set(s,1,s));glints.setMatrixAt(i,_m);}
  glints.instanceMatrix.needsUpdate=true;
  if(nightF>0.05&&ffData.length){const pa=ffGeo.attributes.position.array;ffData.forEach((f,i)=>{pa[i*3]=f.x+Math.sin(tt*0.6+f.ph)*0.7;pa[i*3+1]=0.9+Math.sin(tt*1.3+f.ph*2)*0.4;pa[i*3+2]=f.z+Math.cos(tt*0.5+f.ph)*0.7;});ffGeo.attributes.position.needsUpdate=true;}
  fireflies.visible=nightF>0.05&&ffData.length>0;
  rain.visible=rainMix>0.02;rain.material.opacity=0.6*rainMix;
  if(rain.visible){const pa=rainGeo.attributes.position.array;for(let i=0;i<RAIN;i++){const r=rainData[i];r.y-=dt*16;r.x+=dt*2;if(r.y<0){r.y=12+Math.random()*2;r.x=cam.tx+(Math.random()-0.5)*30;r.z=cam.tz+(Math.random()-0.5)*30;}
    pa[i*6]=r.x;pa[i*6+1]=r.y;pa[i*6+2]=r.z;pa[i*6+3]=r.x-0.08;pa[i*6+4]=r.y+0.5;pa[i*6+5]=r.z;}rainGeo.attributes.position.needsUpdate=true;}
  if(cursorT>0){cursorT-=dt;cursor.visible=cursorT>0;cursor.position.y=(topY(Math.round(cursor.position.x),Math.round(cursor.position.z))||0.3)+0.1+Math.abs(Math.sin(tt*5))*0.04;}
  updateParticles(dt);
  hudT-=dt;if(hudT<=0){hudT=0.5;updateHUD();}
  tickShells(dt);
  saveT+=dt;if(saveT>5){saveT=0;save();}
  updateSkyDome();renderer.setRenderTarget(rt);renderer.render(skyScene,post.cam);renderer.autoClear=false;renderer.clearDepth();renderer.render(scene,camera);renderer.autoClear=true;renderer.setRenderTarget(null);renderer.render(post.scene,post.cam);
  requestAnimationFrame(frame);
}

/* =========================================================
   Boot
   ========================================================= */
$('icoShell').src=ICON.shell;$('icoStar').src=ICON.star;$('icoBag').src=ICON.bag;$('icoShop').src=ICON.shop;$('icoTask').src=ICON.task;$('icoChart').src=ICON.chart;$('icoDex').src=ICON.dex;
genIslands();for(const isl of islands)buildIsland(isl);rebuildSeaGrid();
if(S.wv!==2){if(!isNew){S.sea=false;S.boat=null;S.picked={};vil.x=vil.tx=0.3;vil.z=vil.tz=2.1;}S.wv=2;}
ensureBoat(true);if(S.sea&&isLand(Math.round(S.boat.x),Math.round(S.boat.z))){S.sea=false;S.boat=null;ensureBoat(false);}
if(isNew)setupNew();
const farmNew=!S.farmInit;if(farmNew){genDebris();S.farmInit=1;}
if(!S.sea&&!isLand(Math.round(vil.x),Math.round(vil.z))){vil.x=vil.tx=0.3;vil.z=vil.tz=2.1;}
if(S.sea){vil.x=vil.tx=S.boat.x;vil.z=vil.tz=S.boat.z;}
syncObjs();rebuildSoil();if(!S.orders.length)makeOrders();syncLife();setRod();
let away=[];if(!isNew){const el=clamp((Date.now()-S.t)/1000,0,3*3600);if(el>5)away=simulate(el);}
syncAllCrops();fitZoom();cam.tx=vil.x;cam.tz=vil.z;resize();
try{makeThumbs();}catch(e){console.warn(e);}
shownShells=S.shells;$('shellTxt').textContent=fmt(S.shells);applyTime();updateHUD();
window.addEventListener('resize',()=>{resize();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{const el=clamp((Date.now()-S.t)/1000,0,3*3600);if(el>5){const out=simulate(el);afterSim(out,'While you were away');}last=performance.now();}});
window.addEventListener('pagehide',save);
$('boot').remove();
if(farmNew)setTimeout(()=>toast('Across the bridge to the west is your farm field, overgrown with weeds, rocks and stumps. Clear it to make room for crops. Tip: press and hold, then drag, to till, plant, water or harvest a whole row.','',ICON.sprout),isNew?9000:1500);
if(isNew){setTimeout(()=>toast('Welcome to Driftseed Isle! Tap soil to plant, and tap ripe crops to harvest.','',ICON.sprout),500);
  setTimeout(()=>toast('Your boat waits at the dock. Sail to other islands to fill your Islandex!','',ICON.boat),4200);}
else if(!S.boatTip)setTimeout(()=>toast('New: your boat waits at the dock! Sail to new islands and fill your Islandex.','',ICON.boat),800);
if(away.length)afterSim(away,'While you were away');
requestAnimationFrame(t=>{last=t;frame(t);});
})();
