<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sporeholm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed ink-and-paper scene; HUD sits on paper slips at the corners; hotbar docked bottom-centre; market and journal open as a centred ledger sheet. */
:root {
  --paper: #f1ece1;
  --paper-glass: rgba(241, 236, 225, 0.94);
  --ink: #2b2926;
  --ink-soft: #6f6a61;
  --rule: rgba(43, 41, 38, 0.16);
  --coin: #e0a72e;
  --ground: #e7e1d3;
  --display: 'Pixelify Sans', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --body: 'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--body); }
canvas.scene { display: block; touch-action: none; }
.chip {
  background: var(--paper-glass); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 3px;
  box-shadow: 3px 3px 0 rgba(43, 41, 38, 0.28);
}
button { font: 500 14px/1 var(--display); color: var(--ink); cursor: pointer; padding: 8px 10px; min-width: 36px; }
button:hover:not(:disabled) { background: var(--paper); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 3px solid var(--coin); outline-offset: 2px; }
.px { image-rendering: pixelated; display: block; }

#top {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
#top > * { pointer-events: auto; }
#title { padding: 6px 12px 8px; }
#title h1 { margin: 0; font: 700 20px/1.1 var(--display); letter-spacing: 0.02em; }
#title .sub { font: 500 13px/1.3 var(--display); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
#tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
#coins { display: flex; align-items: center; gap: 6px; padding: 7px 10px; font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.coin { width: 12px; height: 12px; border-radius: 50%; background: var(--coin); border: 2px solid var(--ink); flex: none; }

#bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 24px); overflow-x: auto;
}
.slot {
  position: relative; flex: none; width: 52px; height: 52px; padding: 0; display: grid; place-items: center;
  border: 2px solid transparent; border-radius: 2px; background: rgba(43, 41, 38, 0.05); box-shadow: none;
}
.slot[aria-pressed="true"] { border-color: var(--ink); background: var(--paper); }
.slot canvas { width: 40px; height: 40px; }
.slot .key { position: absolute; top: 2px; left: 4px; font: 500 10px/1 var(--display); color: var(--ink-soft); }
.slot .n { position: absolute; bottom: 2px; right: 4px; font: 700 13px/1 var(--display); font-variant-numeric: tabular-nums; }

#notes { position: fixed; left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); padding: 10px 12px; width: 260px; font-size: 12.5px; }
#notes h2 { margin: 0 0 6px; font: 700 12px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
#notes ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
#notes li { display: grid; grid-template-columns: 16px 1fr; gap: 4px; color: var(--ink-soft); }
#notes li.done { text-decoration: line-through; text-decoration-color: var(--rule); }
#notes li.now { color: var(--ink); font-weight: 600; }
#notes .keys { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink-soft); font-size: 11.5px; }

#toast {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
  padding: 6px 12px; font: 500 14px/1.25 var(--display); opacity: 0; transition: opacity .25s; pointer-events: none; max-width: min(420px, calc(100vw - 24px)); text-align: center;
}
#tip {
  position: fixed; pointer-events: none; padding: 4px 8px; font: 500 13px/1.2 var(--display); white-space: nowrap;
  border-width: 1.5px; box-shadow: 2px 2px 0 rgba(43, 41, 38, 0.25);
}
.pop {
  position: fixed; z-index: 1; pointer-events: none; font: 700 15px/1 var(--display); color: var(--paper);
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink);
  transform: translate(-50%, -100%); animation: pop 1.3s ease-out forwards; white-space: nowrap;
}
@keyframes pop { from { opacity: 1; margin-top: 0 } to { opacity: 0; margin-top: -44px } }

#panel {
  position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(540px, calc(100vw - 32px)); max-height: min(78vh, 680px); overflow: auto; padding: 16px 18px 18px;
}
#panel header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
#panel h2 { margin: 0; font: 700 22px/1.1 var(--display); }
#panel h3 { margin: 16px 0 6px; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
#panel .close { min-width: 32px; padding: 6px 8px; }
.row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); }
.row canvas { width: 40px; height: 40px; }
.row .nm { font-weight: 600; min-width: 0; }
.row .meta { color: var(--ink-soft); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.row .acts { display: flex; gap: 6px; }
.row button { padding: 6px 8px; font-size: 13px; }
.order { border: 2px dashed var(--ink); padding: 10px 12px; display: grid; gap: 6px; }
.order .want { font: 700 17px/1.2 var(--display); }
.empty { color: var(--ink-soft); padding: 8px 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.card { border: 1.5px solid var(--rule); padding: 8px; display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.card canvas { width: 60px; height: 60px; }
.card .nm { font-weight: 600; font-size: 12.5px; line-height: 1.25; }
.card .meta { color: var(--ink-soft); font-size: 11.5px; font-variant-numeric: tabular-nums; }

@media (max-width: 700px) {
  #notes { width: auto; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); padding: 8px 10px; }
  #notes ol li:not(.now) { display: none; }
  #notes .keys { display: none; }
  .slot { width: 46px; height: 46px; }
  .slot canvas { width: 34px; height: 34px; }
  #title h1 { font-size: 17px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: .01s; } #toast { transition: none; } }
</style>

<div id="top">
  <div id="title" class="chip"><h1 id="isle-name">Sporeholm</h1><div class="sub" id="clock">Day 1 · 08:00</div></div>
  <div id="tools">
    <div id="coins" class="chip" aria-label="Coins"><span class="coin"></span><span id="coin-n">0</span></div>
    <button class="chip" id="journal-btn" title="Journal (J)">Journal</button>
    <button class="chip hide-sm" id="rot-l" title="Rotate view left (Q)" aria-label="Rotate view left">⟲</button>
    <button class="chip hide-sm" id="rot-r" title="Rotate view right (E)" aria-label="Rotate view right">⟳</button>
    <button class="chip" id="time" title="Skip ahead six hours (T)">+6h</button>
    <button class="chip" id="regen" title="Start over on a new island">New island</button>
  </div>
</div>

<div id="bar" class="chip" role="toolbar" aria-label="Hotbar"></div>

<div id="tip" class="chip" hidden></div>
<div id="panel" class="chip" role="dialog" aria-modal="false" hidden></div>

<script type="module">
import * as THREE from 'three';

/* ================= constants ================= */
const SIZE = 26, HALF = SIZE / 2, STEP = 0.4, SEA = STEP * 1.35, REACH = 2.1, DAY_LEN = 240, GROW_TIME = 30;
const INK = '#2b2926';
const TILE_COL = ['#b8c4c0', '#ccd6d1', '#ece3cd', '#e8e2d4', '#e0dacb', '#d8d1c1', '#cfc8b8', '#f6f4ef'];
const SAVE_KEY = 'sporeholm-v1';
const BED_PRICE = 12, GLOW_PRICE = 60, WILD_PACK_PRICE = 6;

/* ================= random + noise (seeded, world gen only) ================= */
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const rand = (a = 0, b = 1) => a + R() * (b - a);
const pick = arr => arr[Math.floor(R() * arr.length)];
const mr = (a = 0, b = 1) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const fbm = (x, y) => vnoise(x, y) * 0.6 + vnoise(x * 2.1 + 7, y * 2.1 + 3) * 0.3 + vnoise(x * 4.3 + 1, y * 4.3 + 9) * 0.1;

/* ================= mushroom genetics ================= */
// Genome: hue 0-360, shape 0 cap/1 parasol/2 spire/3 bell, w cap width 0-1, h stem height 0-1, pattern 0 plain/1 speckled/2 banded, glow, gen
const HUES = [[12, 'Crimson'], [28, 'Ember'], [42, 'Amber'], [60, 'Saffron'], [90, 'Lime'], [130, 'Moss'], [165, 'Jade'], [190, 'Tide'], [215, 'Azure'], [240, 'Cobalt'], [265, 'Indigo'], [290, 'Violet'], [320, 'Orchid'], [345, 'Rose'], [361, 'Crimson']];
const COLOR_NAMES = [...new Set(HUES.map(h => h[1]))];
const SHAPES = ['Cap', 'Parasol', 'Spire', 'Bell'], PATTERNS = ['', 'Speckled', 'Banded'];
const WILD = [
  { hue: 5, shape: 0, w: 0.6, h: 0.45, pattern: 1, glow: false, gen: 0 },
  { hue: 50, shape: 3, w: 0.35, h: 0.75, pattern: 0, glow: false, gen: 0 },
  { hue: 203, shape: 1, w: 0.9, h: 0.55, pattern: 2, glow: false, gen: 0 },
  { hue: 278, shape: 2, w: 0.4, h: 0.3, pattern: 0, glow: false, gen: 0 },
];
const hueDist = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const hueName = h => HUES.find(([e]) => ((h % 360) + 360) % 360 < e)[1];
const nameOf = g => [g.glow ? 'Glowing' : '', PATTERNS[g.pattern], hueName(g.hue), SHAPES[g.shape]].filter(Boolean).join(' ');
const valueOf = g => Math.round(4 + Math.min(g.gen, 8) * 2 + (g.pattern ? 3 : 0) + (g.glow ? 22 : 0)
  + Math.min(...WILD.map(w => hueDist(g.hue, w.hue))) * 0.3 + (g.w > 0.85 || g.h > 0.85 ? 3 : 0));
function cross(a, b) {
  const d = ((b.hue - a.hue + 540) % 360) - 180;
  const hue = (a.hue + d * mr(0.25, 0.75) + mr(-12, 12) + (Math.random() < 0.08 ? mr(-70, 70) : 0) + 720) % 360;
  return {
    hue,
    shape: Math.random() < 0.1 ? Math.floor(mr(0, 4)) : (Math.random() < 0.5 ? a.shape : b.shape),
    w: clamp(lerp(a.w, b.w, Math.random()) + mr(-0.15, 0.15), 0, 1),
    h: clamp(lerp(a.h, b.h, Math.random()) + mr(-0.15, 0.15), 0, 1),
    pattern: Math.random() < 0.12 ? Math.floor(mr(0, 3)) : (Math.random() < 0.5 ? a.pattern : b.pattern),
    glow: (a.glow || b.glow) ? Math.random() < 0.55 : Math.random() < 0.04,
    gen: Math.max(a.gen, b.gen) + 1,
  };
}

/* ---- pixel portrait of a genome (20x20, drawn per pixel) ---- */
function portrait(g) {
  const W = 20, cx = 10, base = 18;
  const c = document.createElement('canvas'); c.width = c.height = W; c.className = 'px';
  const x2 = c.getContext('2d');
  const hw = 3.2 + g.w * 2.8, stemH = Math.round(3 + g.h * 5), yb = base - stemH;
  const hs = l => `hsl(${g.hue} 78% ${l}%)`;

    if (dy < -0.5) return false;
    if (g.shape === 0) return (dx / hw) ** 2 + (dy / (hw * 0.75)) ** 2 <= 1;
    if (g.shape === 1) return dy <= 2.5 && Math.abs(dx) <= hw + 0.5 - dy * 1.1;
    if (g.shape === 2) { const H = hw * 1.6; return dy <= H && Math.abs(dx) <= hw * 0.75 * (1 - dy / H) + 0.3; }

  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
    const dx = x + 0.5 - cx, dy = yb - (y + 0.5);

      if (dy < 0.6) col = hs(40);

      if (g.pattern === 2 && dy >= 1 && dy < 2) col = hs(30);

    } else if (y + 0.5 > yb && y <= base && Math.abs(dx) <= 0.9 + g.w * 0.6) {

    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) if (inside(x, y) && (x * 3 + y * 5) % 7 === 0) px[y][x] = '#fbf7ee';
  }

  const out = px.map(r => r.slice());

    x2.fillStyle = `hsla(${g.hue} 95% 70% / 0.35)`;
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      if (out[y][x]) continue;
      let near = false;
      for (let a = -2; a <= 2 && !near; a++) for (let b = -2; b <= 2; b++) if (out[y + a]?.[x + b] === INK && Math.abs(a) + Math.abs(b) <= 2) { near = true; break; }
      if (near && y < base) x2.fillRect(x, y, 1, 1);

  }
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) if (out[y][x]) { x2.fillStyle = out[y][x]; x2.fillRect(x, y, 1, 1); }

}
function iconCanvas(kind) {
  const c = document.createElement('canvas'); c.width = c.height = 20; c.className = 'px';
  const x = c.getContext('2d');
  const r = (col, ...rects) => { x.fillStyle = col; rects.forEach(q => x.fillRect(...q)); };
  if (kind === 'hand') { r(INK, [6, 6, 10, 11], [5, 3, 3, 6], [8, 2, 3, 6], [11, 2, 3, 6], [14, 4, 3, 6]); r('#e8d6bd', [7, 7, 8, 9], [6, 4, 1, 4], [9, 3, 1, 4], [12, 3, 1, 4], [15, 5, 1, 4]); }
  if (kind === 'bed') { r(INK, [2, 8, 16, 8]); r('#4a4541', [3, 9, 14, 6]); r('#8a7862', [2, 7, 16, 2], [2, 15, 16, 2]); r(INK, [2, 6, 16, 1], [2, 17, 16, 1]); r('#7d7266', [6, 11, 2, 1], [11, 12, 2, 1]); }
  return c;
}

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.className = 'scene';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e3ddd0');
scene.fog = new THREE.Fog('#e3ddd0', 58, 110);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
const cam = { angle: Math.PI / 4, targetAngle: Math.PI / 4, zoom: 1, target: new THREE.Vector3() };

const hemi = new THREE.HemisphereLight('#d9e2ee', '#e8e1d2', 1);
const sun = new THREE.DirectionalLight('#fff6e6', 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 0.5, far: 100 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;

/* ---- ink outlines: back-face shell pushed out along smoothed normals, constant width in world units ---- */
const inkMat = new THREE.ShaderMaterial({
  uniforms: { color: { value: new THREE.Color(INK) }, thick: { value: 0.018 } },
  vertexShader: `uniform float thick; void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vec3 wn = normalize(mat3(modelMatrix) * normal); wp.xyz += wn * thick; gl_Position = projectionMatrix * viewMatrix * wp; }`,

const matCache = new Map();
function mat(hex) {
  if (!matCache.has(hex)) matCache.set(hex, new THREE.MeshLambertMaterial({ color: hex, flatShading: true }));
  return matCache.get(hex);
}
const G = {
  trunk: new THREE.CylinderGeometry(0.05, 0.08, 0.5, 6).translate(0, 0.25, 0),
  blob: new THREE.IcosahedronGeometry(1, 0),
  cone: new THREE.ConeGeometry(1, 1, 7),
  twig: new THREE.CylinderGeometry(0.03, 0.05, 1, 5).translate(0, 0.5, 0),
  rock: new THREE.DodecahedronGeometry(1, 0),
  box: new THREE.BoxGeometry(1, 1, 1),
  log: new THREE.CylinderGeometry(1, 1, 1, 7),
  petal: new THREE.OctahedronGeometry(0.06, 0),
  blade: new THREE.ConeGeometry(0.018, 0.2, 3).translate(0, 0.1, 0),
  puff: new THREE.IcosahedronGeometry(0.18, 0),
  bit: new THREE.BoxGeometry(0.06, 0.06, 0.06),
  mstem: new THREE.CylinderGeometry(0.8, 1, 1, 7).translate(0, 0.5, 0),
  band: new THREE.TorusGeometry(1, 0.09, 4, 14).rotateX(Math.PI / 2),
};
const CAP_GEO = [
  new THREE.SphereGeometry(1, 10, 5, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.CylinderGeometry(0.25, 1, 0.35, 11).translate(0, 0.175, 0),
  new THREE.ConeGeometry(0.8, 1.7, 9).translate(0, 0.85, 0),
  new THREE.SphereGeometry(1, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.62),
];
const CAP_SY = [0.75, 1, 1, 1.3];
// radius and height on the cap's surface at t (0 = rim, 1 = top), in unscaled cap units
function prof(shape, t) {
  if (shape === 0) return [Math.sqrt(1 - t * t), t];

/* ================= world generation ================= */
const NAMES_A = ['Spore', 'Moss', 'Fern', 'Gill', 'Heather', 'Bramble', 'Willow', 'Morel', 'Thistle', 'Alder', 'Birch', 'Rowan'];
const NAMES_B = ['holm', 'fall', 'reach', 'mere', 'hollow', 'cay', 'wick', 'rest', 'ness', 'combe'];

function generate(sd, saved) {
  seed = sd; R = mulberry(seed); initNoise();
  if (world) { scene.remove(world); glowMats.clear(); capMats.clear(); }
  world = new THREE.Group(); scene.add(world);
  lv = new Uint8Array(SIZE * SIZE); river = new Uint8Array(SIZE * SIZE); deck = new Float32Array(SIZE * SIZE);
  occ = new Array(SIZE * SIZE).fill(null); ents = new Set();
  islandName = pick(NAMES_A) + pick(NAMES_B);
  document.getElementById('isle-name').textContent = islandName;

  const ox = rand(0, 40), oy = rand(0, 40);
  const theta = rand(0, Math.PI * 2), sx = rand(-2, 2), sz = rand(-2, 2), wob = rand(1, 2.2), ph = rand(0, 6), path = [];
  for (let s = 0; s <= 80; s++) {
    const t = s / 80, d = t * HALF * 1.3, perp = Math.sin(t * 7 + ph) * wob * t;
    path.push([sx + Math.cos(theta) * d - Math.sin(theta) * perp, sz + Math.sin(theta) * d + Math.cos(theta) * perp]);
  }
  for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
    const x = wx(i), z = wx(j), k = idx(i, j), d = Math.hypot(x, z) / HALF;
    const e = 0.62 + (fbm(i * 0.13 + ox, j * 0.13 + oy) - 0.5) * 0.9 - d * d * 1.05;
    let L = e < 0.1 ? 0 : e < 0.2 ? 1 : e < 0.28 ? 2 : Math.min(7, 3 + Math.floor((e - 0.28) / 0.12));
    let md = 99; for (const [px, pz] of path) md = Math.min(md, Math.hypot(px - x, pz - z));
    if (L >= 2 && (md < 0.75 || Math.hypot(sx - x, sz - z) < 1.3)) { L = 1; river[k] = 1; }
    lv[k] = L;
  }

  // homestead: cabin 2x2, a 3x2 block of log beds beside it, a clearing and campfire in front
  site = null; let best = 1e9;
  for (const tol of [1, 2]) {
    for (let i = 1; i < SIZE - 6; i++) for (let j = 1; j < SIZE - 5; j++) {
      const ls = [];
      for (let a = 0; a < 5; a++) for (let b = 0; b < 4; b++) ls.push(lv[idx(i + a, j + b)]);
      if (Math.min(...ls) < 3 || Math.max(...ls) - Math.min(...ls) > tol || Math.max(...ls) >= 7) continue;
      const dist = Math.hypot(wx(i) + 2, wx(j) + 1.5);
      if (dist < best) { best = dist; site = { i, j, L: Math.round(ls.reduce((a, b) => a + b) / ls.length) }; }
    }
    if (site) break;
  }
  if (!site) site = { i: HALF - 2, j: HALF - 2, L: 3 };
  for (let a = 0; a < 5; a++) for (let b = 0; b < 4; b++) { const k = idx(site.i + a, site.j + b); lv[k] = site.L; river[k] = 0; }

  // terrain tiles
  const geo = G.box.clone().translate(0, -0.5, 0), vc = [], nor = geo.attributes.normal;
  for (let v = 0; v < nor.count; v++) { const ny = nor.getY(v), s = ny > 0.5 ? 1 : ny < -0.5 ? 0.6 : 0.86; vc.push(s, s, s); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(vc, 3));
  tilesMesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), SIZE * SIZE);
  tilesMesh.receiveShadow = tilesMesh.castShadow = true;
  const _m = new THREE.Matrix4(), _c = new THREE.Color(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
  for (let i = 0; i < SIZE; i++) for (let j = 0; j < SIZE; j++) {
    const k = idx(i, j), L = lv[k], top = L * STEP;
    tilesMesh.setMatrixAt(k, _m.compose(_p.set(wx(i), top, wx(j)), _q, _s.set(1, top + 3, 1)));
    _c.set(river[k] ? '#c3d2cc' : TILE_COL[L]).offsetHSL(0, 0, (fbm(i * 0.9 + 3, j * 0.9 + 5) - 0.5) * 0.05);
    tilesMesh.setColorAt(k, _c);
  }
  world.add(tilesMesh);

  // ink contour along every terrace edge that drops away

    if (nb(i + 1, j) < t) seg.push(x + 0.5, y, z - 0.5, x + 0.5, y, z + 0.5);
    if (nb(i - 1, j) < t) seg.push(x - 0.5, y, z - 0.5, x - 0.5, y, z + 0.5);
    if (nb(i, j + 1) < t) seg.push(x - 0.5, y, z + 0.5, x + 0.5, y, z + 0.5);

    if (lv[idx(i, j)] > 1 || river[idx(i, j)]) continue;
    let nd = 9, ni = 0, nj = 0;

  dp.raycast = () => {}; world.add(dp);

  else for (let a = 2; a < 5; a++) for (let b = 0; b < 2; b++) makeBed(site.i + a, site.j + b);

  if (!inReach(i, j)) return;
  player.pending = player.goal = null;
  player.facing = Math.atan2(wx(i) - player.pos.x, wx(j) - player.pos.z);
  if (p.type === 'wild' && ents.has(e)) harvestWild(e);
  else if (p.type === 'harvest' && ents.has(e) && e.plant?.growth >= 1) harvestBed(e);
  else if (p.type === 'plant' && ents.has(e) && !e.plant) plantSelected(e);

    if (e.kind === 'bed') {
      if (ev.button === 2) return go({ type: 'pickup', ent: e });
      if (e.plant?.growth >= 1) return go({ type: 'harvest', ent: e });
      if (e.plant) return toast(`${nameOf(e.plant.g)} is ${Math.floor(e.plant.growth * 100)}% grown`);
      if (spores.find(s => s.name === selected)) return go({ type: 'plant', ent: e });
      return toast(spores.some(s => s.n) ? 'Choose spores in the hotbar, then click the bed' : 'You need spores. Pick a wild mushroom first');
    }
    if (e.kind === 'wild') return go({ type: 'wild', ent: e });
    if (e.kind === 'market') return go({ type: 'market', ent: e });
    if (e.kind === 'cabin') return openJournal();
    if (e.kind === 'fire') return toast('The fire crackles. Mushrooms like the dark, damp nights here.');
  }
  if (selected === 'bed' && h.kind === 'tile') return go({ type: 'bed', i, j });
  player.pending = null; player.goal = new THREE.Vector2(h.point.x, h.point.z); player.stuck = 0;
});
addEventListener('wheel', ev => { if (panel.hidden) cam.zoom = clamp(cam.zoom * (ev.deltaY > 0 ? 0.9 : 1.1), 0.55, 2.6); }, { passive: true });

const keys = new Set();
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'BUTTON' && (ev.key === ' ' || ev.key === 'Enter')) return;
  const k = ev.key.toLowerCase();
  if (k === 'escape') return closePanel();
  keys.add(k);
  if (k === 'q') rotate(-1);
  if (k === 'e') rotate(1);
  if (k === 't') skipTime();
  if (k === 'j') panelKind === 'journal' ? closePanel() : openJournal();
  if (/^[1-9]$/.test(k)) { const s = slotList()[+k - 1]; if (s) { selected = s.id; renderBar(); } }
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
function rotate(d) { cam.targetAngle += d * Math.PI / 2; }
let clock = 8 / 24, dayNo = 1, lastH = 8;
function skipTime() { const before = clock; clock += 0.25; growAll(0.25 * DAY_LEN, before); }
$('rot-l').onclick = () => rotate(-1);
$('rot-r').onclick = () => rotate(1);
$('time').onclick = skipTime;
$('journal-btn').onclick = () => (panelKind === 'journal' ? closePanel() : openJournal());
let regenArmed = false;
$('regen').onclick = () => {
  if (!regenArmed) { regenArmed = true; $('regen').textContent = 'Lose progress?'; setTimeout(() => { regenArmed = false; $('regen').textContent = 'New island'; }, 3000); return; }
  regenArmed = false; $('regen').textContent = 'New island';
  newGame(Math.floor(Math.random() * 1e9));
  toast(`You arrive on ${islandName} with an empty basket`);
};

/* ================= movement ================= */
function tryMove(dx, dz) {
  let moved = 0;
  for (const [mx, mz] of [[dx, 0], [0, dz]]) {
    if (!mx && !mz) continue;
    const nx = player.pos.x + mx, nz = player.pos.z + mz;
    const px = nx + Math.sign(mx) * 0.18, pz = nz + Math.sign(mz) * 0.18;
    const cy = topAt(ti(player.pos.x), ti(player.pos.z));
    if (walkable(ti(px), ti(pz), cy) && walkable(ti(nx), ti(nz), cy)) { player.pos.x = nx; player.pos.z = nz; moved += Math.abs(mx) + Math.abs(mz); }
  }
  return moved;
}
function updatePlayer(dt) {
  const fwd = new THREE.Vector2(-Math.sin(cam.angle), -Math.cos(cam.angle)), right = new THREE.Vector2(-fwd.y, fwd.x);
  let ix = 0, iz = 0;
  if (panel.hidden) {
    if (keys.has('w') || keys.has('arrowup')) { ix += fwd.x; iz += fwd.y; }
    if (keys.has('s') || keys.has('arrowdown')) { ix -= fwd.x; iz -= fwd.y; }
    if (keys.has('d') || keys.has('arrowright')) { ix += right.x; iz += right.y; }
    if (keys.has('a') || keys.has('arrowleft')) { ix -= right.x; iz -= right.y; }
  }
  if (ix || iz) { player.goal = null; player.pending = null; }
  else if (player.goal) {
    ix = player.goal.x - player.pos.x; iz = player.goal.y - player.pos.z;
    if (Math.hypot(ix, iz) < 0.08) { player.goal = null; ix = iz = 0; }
  }
  const ci = ti(player.pos.x), cj = ti(player.pos.z), wet = !deck[idx(ci, cj)] && lv[idx(ci, cj)] <= 1;
  const len = Math.hypot(ix, iz);
  if (len > 0) {
    const sp = (wet ? 1.4 : 2.6) * dt, step = Math.min(sp, player.goal ? len : sp);
    const moved = tryMove(ix / len * step, iz / len * step);
    player.facing = Math.atan2(ix, iz);
    player.walk += dt * (wet ? 7 : 11);
    if (player.goal) {
      if (moved < step * 0.2) { player.stuck += dt; if (player.stuck > 0.25) { if (player.pending) toast("Can't reach that from here"); player.goal = player.pending = null; } }
      else player.stuck = 0;
    }
  } else player.walk = 0;
  runPending();
  const ty = topAt(ti(player.pos.x), ti(player.pos.z)) - (wet ? 0.12 : 0);
  player.y = lerp(player.y, ty, 1 - Math.exp(-dt * 14));
  pmesh.position.set(player.pos.x, player.y + (len > 0 ? Math.abs(Math.sin(player.walk)) * 0.03 : 0), player.pos.z);
  let da = player.facing - pmesh.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
  pmesh.rotation.y += da * (1 - Math.exp(-dt * 14));
  const sw = Math.sin(player.walk) * 0.6 * (len > 0 ? 1 : 0);
  pmesh.userData.legs[0].rotation.x = sw; pmesh.userData.legs[1].rotation.x = -sw;
}

/* ================= growth + crossing ================= */
let nightF = 0, crossTimer = 0, wildTimer = 0;
function growAll(seconds, fromClock = clock) {
  for (const e of ents) {
    if (e.kind !== 'bed' || !e.plant || e.plant.growth >= 1) continue;
    const rate = (1 + nightF * 0.6) * (e.wet ? 1.25 : 1) / GROW_TIME;
    const before = e.plant.growth;
    e.plant.growth = Math.min(1, before + seconds * rate);
    setPlantScale(e);
    if (before < 1 && e.plant.growth >= 1) burst(e.mesh.position.clone().add(new THREE.Vector3(0, 0.3, 0)), '#fbf7ee', 5);
  }
}
function tryCrosses() {
  for (const e of ents) {
    if (e.kind !== 'bed' || e.plant) continue;
    const parents = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const n = (a || b) && inb(e.i + a, e.j + b) ? occ[idx(e.i + a, e.j + b)] : null;
      if (n?.kind === 'bed' && n.plant?.growth >= 1) parents.push(n.plant.g);
    }
    if (parents.length < 2 || Math.random() > 0.12) continue;
    const p1 = parents.splice(Math.floor(mr(0, parents.length)), 1)[0], p2 = parents[Math.floor(mr(0, parents.length))];
    plantBed(e, cross(p1, p2), 0);
    stats.hybrids++;
    toast(nameOf(p1) === nameOf(p2) ? 'Spores drifted into an empty bed' : `A cross is sprouting: ${hueName(p1.hue)} × ${hueName(p2.hue)}`);
    burst(e.mesh.position.clone().add(new THREE.Vector3(0, 0.2, 0)), '#fbf7ee', 8);
    renderNotes(); save();
  }
}

/* ================= day / night ================= */
const C = s => new THREE.Color(s);
const DAY = { sky: C('#d9e2ee'), gnd: C('#e8e1d2'), bg: C('#e3ddd0'), sea: C('#cbd5d1') };
const NIGHT = { sky: C('#3a4560'), gnd: C('#1d2222'), bg: C('#1b2024'), sea: C('#2c3a40') };
const DUSK = C('#ffc39a'), NOON = C('#fff6e6');
function updateSky(dt) {
  clock += dt / DAY_LEN;
  const h = (clock % 1) * 24;
  if (h < lastH) dayNo++;
  lastH = h;
  const el = Math.sin((h - 6) / 24 * Math.PI * 2), day = smooth(-0.12, 0.25, el), az = (h - 6) / 12 * Math.PI;
  nightF = 1 - day;
  sun.position.set(-Math.cos(az) * 26, Math.max(el, 0.12) * 24 + 6, 14 - Math.sin(az) * 4).add(sun.target.position);
  sun.intensity = day * 2.4;
  sun.color.copy(DUSK).lerp(NOON, smooth(0.05, 0.55, el));
  moon.intensity = nightF * 0.6;
  hemi.intensity = 0.4 + day * 0.7;
  hemi.color.copy(NIGHT.sky).lerp(DAY.sky, day);
  hemi.groundColor.copy(NIGHT.gnd).lerp(DAY.gnd, day);
  scene.background.copy(NIGHT.bg).lerp(DAY.bg, day);
  scene.fog.color.copy(scene.background);
  waterMat.color.copy(NIGHT.sea).lerp(DAY.sea, day);
  if (windowMat) windowMat.emissiveIntensity = nightF * 1.6;
  if (fireLight) fireLight.intensity = (1 + nightF * 9) * (0.85 + Math.sin(performance.now() * 0.02) * 0.08 + Math.random() * 0.1);
  if (fireflies) fireflies.material.opacity = nightF * 0.95;
  const pulse = 0.85 + Math.sin(performance.now() * 0.003) * 0.15;
  for (const m of glowMats) m.emissiveIntensity = 0.3 + nightF * 1.3 * pulse;
  for (const m of capMats) m.emissiveIntensity = 0.22 + nightF * 0.3;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 6) * 10;
  $('clock').textContent = `Day ${dayNo} · ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}${nightF > 0.5 ? ' · night growth' : ''}`;
}

/* ================= camera ================= */
function updateCamera(dt) {
  cam.angle = lerp(cam.angle, cam.targetAngle, 1 - Math.exp(-dt * 8));
  cam.target.lerp(new THREE.Vector3(player.pos.x, player.y, player.pos.z), 1 - Math.exp(-dt * 4));
  const D = 40;
  camera.position.set(cam.target.x + Math.sin(cam.angle) * D, cam.target.y + D * 0.85, cam.target.z + Math.cos(cam.angle) * D);
  camera.lookAt(cam.target);
  const aspect = innerWidth / innerHeight, view = (aspect < 1 ? 11 : 8.5) / cam.zoom;
  camera.left = -view * aspect; camera.right = view * aspect; camera.top = view; camera.bottom = -view;
  camera.updateProjectionMatrix();
  sun.target.position.set(cam.target.x, 0, cam.target.z);
}

/* ================= save / load ================= */
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      seed, coins, basket, spores, bedsItem, order, stats, clock, dayNo, journal: [...journal.entries()],
      beds: [...ents].filter(e => e.kind === 'bed').map(b => ({ i: b.i, j: b.j, plant: b.plant ? { g: b.plant.g, growth: b.plant.growth } : null })),
    }));
  } catch { /* storage unavailable: progress lasts for this visit only */ }
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && typeof s.seed === 'number' ? s : null; } catch { return null; }
}
function newGame(sd, saved) {
  coins = saved?.coins ?? 0; basket = saved?.basket ?? []; spores = saved?.spores ?? []; bedsItem = saved?.bedsItem ?? 0;
  journal = new Map(saved?.journal ?? []); stats = saved?.stats ?? { planted: 0, hybrids: 0, sold: 0, orders: 0 };
  order = saved?.order ?? null; clock = saved?.clock ?? 8 / 24; dayNo = saved?.dayNo ?? 1; lastH = (clock % 1) * 24;
  if (!order) order = makeOrder();
  selected = 'hand';
  generate(sd, saved);
  cam.target.set(player.pos.x, player.y, player.pos.z);
  closePanel(); renderBar(); save();
}

/* ================= main loop ================= */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const timer = new THREE.Clock();
let saveTimer = 0;
function frame() {
  const dt = Math.min(timer.getDelta(), 0.05), t = timer.elapsedTime;
  updatePlayer(dt);
  updateSky(dt);
  updateCamera(dt);
  growAll(dt);
  if ((crossTimer += dt) > 1) { crossTimer = 0; tryCrosses(); }
  if ((wildTimer += dt) > 14) {
    wildTimer = 0;
    if ([...ents].filter(e => e.kind === 'wild').length < 12) spawnWild(Math.floor(mr(0, WILD.length)));
  }
  if ((saveTimer += dt) > 5) { saveTimer = 0; save(); }

  if (!reduced) {
    const a = waterGeo.attributes.position.array;
    for (let v = 0; v < a.length; v += 3) a[v + 1] = Math.sin(waterBase[v] * 0.7 + t * 1.1) * 0.02 + Math.cos(waterBase[v + 2] * 0.8 + t * 0.9) * 0.02;
    waterGeo.attributes.position.needsUpdate = true;
    waterGeo.computeVertexNormals();
    if (boat) { boat.position.y = SEA - 0.05 + Math.sin(t * 1.3) * 0.025; boat.rotation.x = Math.sin(t * 0.9) * 0.03; }
  }
  // ripe mushrooms sway gently so they read as "ready"
  for (const e of ents) if (e.kind === 'bed' && e.plant?.growth >= 1) e.plant.model.rotation.z = Math.sin(t * 2.2 + e.i + e.j) * 0.06;
  for (const p of smoke) {
    const u = p.userData; u.t = (u.t + dt * 0.12) % 1;
    p.position.copy(u.base).add(new THREE.Vector3(u.t * 1.6 + Math.sin(u.t * 9 + t) * 0.15, u.t * 2.4, -u.t * 0.6));
    p.scale.setScalar(0.5 + u.t * 1.8);
    p.material.opacity = 0.75 * (1 - u.t) * smooth(0, 0.08, u.t);
  }
  flames.forEach((f, k) => { f.scale.y = (k ? 0.19 : 0.3) * (0.85 + Math.sin(t * (12 + k * 5)) * 0.15); f.rotation.y = t * (k ? -3 : 2); });
  if (fireflies && fireflies.material.opacity > 0.01) {
    const a = fireflies.geometry.attributes.position.array, b = fireflies.geometry.userData.base;
    for (let v = 0; v < a.length; v += 3) { a[v] = b[v] + Math.sin(t * 0.7 + v) * 0.3; a[v + 1] = b[v + 1] + Math.sin(t * 1.3 + v * 2) * 0.15; a[v + 2] = b[v + 2] + Math.cos(t * 0.6 + v) * 0.3; }
    fireflies.geometry.attributes.position.needsUpdate = true;
  }
  for (let k = bits.length - 1; k >= 0; k--) {
    const m = bits[k], u = m.userData;
    u.life -= dt; u.v.y -= 9 * dt; m.position.addScaledVector(u.v, dt); m.rotation.x += dt * 6;
    m.scale.setScalar(Math.max(0, u.life / 0.9));
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); bits.splice(k, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
const saved = load();
newGame(saved ? saved.seed : Math.floor(Math.random() * 1e9), saved);
frame();
setTimeout(() => toast(saved ? `Back on ${islandName}` : `Welcome to ${islandName}. Wild mushrooms grow in patches around the island.`), 400);
</script>
</body>
</html>
