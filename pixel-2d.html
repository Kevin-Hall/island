<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Seaward Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed pixel canvas; storybook-parchment UI floats over it (HUD top, dialog bottom). */
:root {
  --ink: #22252f;
  --paper: #f7eed3;
  --paper-shade: #e6d5a8;
  --roof: #b4533a;
  --sea: #1d4a8c;
  --gold: #f2c14e;
  --ui: "Pixelify Sans", "Lucida Console", "Courier New", monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--sea); color: var(--ink); overflow: hidden; }
body { font-family: var(--ui); touch-action: none; -webkit-user-select: none; user-select: none; }
#stage { position: fixed; inset: 0; overflow: hidden; background: var(--sea); }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }

.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 6px; }

#hud { position: absolute; left: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#hud .panel { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
#hearts svg { display: block; }
#seals .star { color: var(--gold); -webkit-text-stroke: 1px var(--ink); font-size: 20px; line-height: 1; }

#mute { position: absolute; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); font: 600 15px var(--ui); color: var(--ink); padding: 5px 10px; cursor: pointer; }
#mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#toast { position: absolute; left: 50%; top: calc(58px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; font-size: 18px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .3s; }
#toast.off { opacity: 0; }

#dialog { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(600px, calc(100% - 32px)); box-sizing: border-box; padding: 16px 18px 14px; font-size: 19px; line-height: 1.4; cursor: pointer; }
#dialog .who { position: absolute; top: -16px; left: 14px; background: var(--roof); color: var(--paper); border: 3px solid var(--ink); border-radius: 4px; padding: 1px 10px; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
#dialog .who:empty { display: none; }
#dialog .more { position: absolute; right: 12px; bottom: 6px; font-size: 14px; animation: nudge .7s steps(2) infinite; }
@keyframes nudge { 50% { transform: translateY(3px); } }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: calc(5vh + env(safe-area-inset-top, 0px)) 16px calc(6vh + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; text-align: center; gap: 14px; }
.screen h1 { margin: 0; font-size: clamp(40px, 9vw, 86px); line-height: .95; font-weight: 700; color: var(--paper); letter-spacing: .02em; text-shadow: 3px 3px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink), 0 7px 0 var(--ink); text-wrap: balance; }
.screen .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.screen p { margin: 0; max-width: 46ch; font-size: clamp(16px, 2.4vw, 20px); color: var(--paper); text-shadow: 2px 2px 0 var(--ink); text-wrap: balance; }
.btn { font: 700 20px var(--ui); color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 6px; box-shadow: 0 4px 0 var(--ink); padding: 8px 22px; cursor: pointer; }
.btn:hover { background: #fff7de; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.keys { font-size: 15px !important; opacity: .95; }
kbd { font: inherit; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 3px; padding: 0 5px; text-shadow: none; }

#touch { position: absolute; inset: 0; pointer-events: none; }
#stick { position: absolute; left: 22px; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: 116px; height: 116px; border-radius: 50%; background: rgba(247,238,211,.28); border: 3px solid rgba(34,37,47,.55); pointer-events: auto; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); }
#abtn { position: absolute; right: 26px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); font: 700 30px var(--ui); color: var(--roof); pointer-events: auto; }
#abtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
body.dialog-open #touch { display: none; }

#fade { position: absolute; inset: 0; background: #fffbe9; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="panel" id="hearts" aria-label="Health"></div>
    <div class="panel" id="seals"><span class="star">★</span><span id="sealCount">0 / 5</span></div>
  </div>
  <button id="mute" class="panel" type="button" hidden>Sound: on</button>
  <div id="toast" class="panel off" aria-live="polite"></div>

  <div id="dialog" class="panel" hidden role="dialog" aria-live="polite">
    <div class="who" id="who"></div>
    <div id="line"></div>
    <div class="more" id="more">▼</div>
  </div>

  <div id="touch" hidden>
    <div id="stick"><div id="knob"></div></div>
    <button id="abtn" type="button" aria-label="Action">✦</button>
  </div>

  <div id="fade"></div>

  <div id="title" class="screen">
    <h1>The Seaward Keep</h1>
    <p>The Keep has stood locked since its last keeper sailed away. You have come to open it.</p>
    <div class="foot">
      <button class="btn" id="start" type="button">Set out</button>
      <p class="keys"><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> walk &nbsp;·&nbsp; <kbd>Space</kbd> talk or cast</p>
    </div>
  </div>

  <div id="end" class="screen" hidden>
    <h1>The Keep is yours</h1>
    <p id="endStats"></p>
    <div class="foot"><button class="btn" id="again" type="button">Play again</button></div>
  </div>
</div>

<script>
(() => {
'use strict';

// ------------------------------------------------------------------ setup
const cv = document.getElementById('cv');
const g = cv.getContext('2d');
const $ = id => document.getElementById(id);
let VW = 320, VH = 200, SCALE = 3;

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  SCALE = Math.max(2, Math.round(Math.min(W, H) / 210));
  VW = Math.ceil(W / SCALE); VH = Math.ceil(H / SCALE);
  cv.width = VW; cv.height = VH;
  cv.style.width = VW * SCALE + 'px'; cv.style.height = VH * SCALE + 'px';
  g.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const INK = '#22252f';
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 90210;
const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * .5 + vnoise(x * 2.1 + 17, y * 2.1) * .3 + vnoise(x * 4.3, y * 4.3 + 9) * .2;

// ------------------------------------------------------------------ island shape
const WW = 896, WH = 1152;
const DEEP = 0, SHAL = 1, SHOAL = 2, SAND = 3, GRASS = 4, PATH = 5, CREEK = 6, BRIDGE = 7, STONE = 8, PLANK = 9;
const T = new Uint8Array(WW * WH);
const LV = new Float32Array(WW * WH);
const RV = new Float32Array(WW * WH);

const E = (x, y, cx, cy, rx, ry) => { const dx = (x - cx) / rx, dy = (y - cy) / ry; return 1 - Math.sqrt(dx * dx + dy * dy); };
const rc = y => 448 + 10 * Math.sin(y * 0.005);
const pathX = y => 448 + 12 * Math.sin(y * 0.007 + 1) + 6 * Math.sin(y * 0.023);
const creekY = x => 770 + 5 * Math.sin(x * 0.04);
function ridgeV(x, y) {
  if (y < 240) return -9;
  const t = clamp((y - 288) / 736, 0, 1), hw = 88 + t * 100;
  let v = 1 - Math.abs(x - rc(y)) / hw;
  if (y > 1040) v -= (y - 1040) / 50;
  return v;
}
const QUAY = { x0: 556, y0: 412, x1: 712, y1: 468 };
const PIER = { x0: 712, y0: 428, x1: 810, y1: 456 };
const CASTLE = { x: 448, y: 372, x0: 346, x1: 562, y0: 290, y1: 370 };

function buildTerrain() {
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x;
    const n = fbm(x / 40, y / 40) - .5;
    const rL = Math.max(E(x, y, 448, 256, 176, 128), ridgeV(x, y), E(x, y, 608, 440, 96, 48));
    const sL = Math.max(E(x, y, 448, 1060, 390, 110), E(x, y, 650, 900, 100, 64), E(x, y, 262, 640, 86, 54), E(x, y, 144, 905, 46, 32));
    const L = Math.max(rL, sL) + n * .12;
    LV[i] = L; RV[i] = rL;
    let t;
    if (L < 0) {
      t = (E(x, y, 150, 975, 40, 62) + n * .3 > 0) ? SHOAL : (L > -.09 ? SHAL : DEEP);
    } else t = (rL + n * .15 > .12) ? GRASS : SAND;
    if (t >= SAND) {
      const n2 = fbm(x / 9 + 100, y / 9) - .5;
      if (y > 372 && y < 1062) {
        const hw = 7 + n2 * 5 - (y > 1030 ? (y - 1030) / 6 : 0);
        if (Math.abs(x - pathX(y)) < hw) t = PATH;
      }
      if (y > 430 + n2 * 4 && y < 446 + n2 * 4 && x > pathX(y) && x < 560) t = PATH;
      if (E(x, y, 448, 382, 30, 14) + n2 * .3 > 0) t = PATH;
      if (Math.abs(y - creekY(x)) < 5) t = Math.abs(x - pathX(y)) < 13 ? BRIDGE : CREEK;
    }
    if (x >= QUAY.x0 && x < QUAY.x1 && y >= QUAY.y0 && y < QUAY.y1) t = STONE;
    if (x >= PIER.x0 && x < PIER.x1 && y >= PIER.y0 && y < PIER.y1) t = PLANK;
    T[i] = t;
  }
}
const isWater = t => t <= SHOAL || t === CREEK;
const tAt = (x, y) => (x < 0 || y < 0 || x >= WW || y >= WH) ? DEEP : T[(y | 0) * WW + (x | 0)];

// ------------------------------------------------------------------ ground painting
const ground = mk(WW, WH);
const shore = [], glints = [];
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const C = {
  deep1: hex('#3474be'), deep2: hex('#1c4787'), shal1: hex('#58b1d2'), shal2: hex('#3a86c4'),
  shoal: hex('#7fc8c6'), foam: hex('#d8f2ee'), sand: hex('#edd598'), sandWet: hex('#d6b97a'), sandDk: hex('#d9bd80'),
  g1: hex('#4a9531'), g2: hex('#98d452'), gEdge: hex('#3b7a2b'), path: hex('#dcc48c'), pathDk: hex('#bb9f64'),
  creek: hex('#3f8acb'), plank: hex('#a9763f'), plankDk: hex('#5b3a22'), stone: hex('#cfc1a0'), mortar: hex('#8f836d'),
  wall: hex('#8a7a62'), ink: hex('#2a2f3c'), white: hex('#fff6dc'), yellow: hex('#f7d64a'), pebble: hex('#9a9083'), pink: hex('#f0a0b8')
};
function paintGround() {
  const gx = ground.getContext('2d');
  const img = gx.createImageData(WW, WH), d = img.data;
  const landN = (x, y, r) => {
    for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r]]) if (!isWater(tAt(x + dx, y + dy))) return true;
    return false;
  };
  const waterN = (x, y, r) => {
    for (const [dx, dy] of [[r, 0], [-r, 0], [0, r], [0, -r]]) if (isWater(tAt(x + dx, y + dy))) return true;
    return false;
  };
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const i = y * WW + x, t = T[i], L = LV[i];
    let c;
    const nz = vnoise(x / 3, y / 7), h = hash(x, y);
    if (t === DEEP) {
      const k = clamp((-L - .08) / .7, 0, 1);
      c = mixc(C.deep1, C.deep2, k);
      if (fbm(x / 46, y / 7) > .64) c = mixc(c, C.shal1, .22);
      if (landN(x, y, 1)) c = C.foam; else if (landN(x, y, 3)) c = mixc(c, C.foam, .45);
    } else if (t === SHAL) {
      c = mixc(C.shal1, C.shal2, clamp(-L / .09, 0, 1));
      if (landN(x, y, 1)) c = C.foam; else if (landN(x, y, 3)) c = mixc(c, C.foam, .45);
    } else if (t === SHOAL) {
      c = C.shoal;
      if (h < .02) c = mixc(c, C.sand, .6);
      if (fbm(x / 20, y / 5) > .62) c = mixc(c, C.foam, .35);
    } else if (t === CREEK) {
      c = C.creek; if (vnoise(x / 6, y) > .7) c = mixc(c, C.foam, .4);
    } else {
      if (t === SAND) {
        c = C.sand;
        if (fbm(x / 7, y / 7) > .6) c = C.sandDk;
        if (waterN(x, y, 3) || waterN(x, y, 5)) c = C.sandWet;
        if (h < .004) c = C.pebble;
      } else if (t === GRASS) {
        const s = clamp(RV[i] * 1.7 + (fbm(x / 40, y / 40) - .5) * .8, 0, 1);
        c = mixc(C.g1, C.g2, s);
        if (nz > .72) c = mixc(c, C.g1, .45); else if (nz < .2) c = mixc(c, C.g2, .45);
        if (h < .0022) c = C.white; else if (h < .0036) c = C.yellow; else if (h < .0042) c = C.pink;
        let nearSand = false;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const q = tAt(x + dx, y + dy); if (q === SAND) nearSand = true; }
        if (nearSand) c = C.gEdge;
        else if (tAt(x, y + 3) === SAND || tAt(x, y + 2) === SAND) c = mixc(c, C.gEdge, .5);
      } else if (t === PATH) {
        c = C.path;
        if (fbm(x / 5, y / 5) > .62) c = C.pathDk;
        if (h < .012) c = C.pebble;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (tAt(x + dx, y + dy) === GRASS) c = C.pathDk;
      } else if (t === BRIDGE) {
        c = (y % 4 === 0) ? C.plankDk : mixc(C.plank, C.sand, h * .2);
        if (tAt(x - 1, y) === CREEK || tAt(x + 1, y) === CREEK || tAt(x - 2, y) === CREEK || tAt(x + 2, y) === CREEK) c = C.plankDk;
      } else if (t === STONE) {
        const bx = x - QUAY.x0, by = y - QUAY.y0, row = by >> 3, off = (row & 1) * 6;
        c = (by % 8 === 0 || (bx + off) % 12 === 0) ? C.mortar : mixc(C.stone, C.white, hash(row, (bx + off) / 12 | 0) * .3);
        if (isWater(tAt(x, y + 5)) || isWater(tAt(x, y + 3))) c = C.wall;
      } else if (t === PLANK) {
        c = (x % 5 === 0) ? C.plankDk : mixc(C.plank, C.sand, h * .25);
        if (isWater(tAt(x, y + 3))) c = C.plankDk;
      }
      if (waterN(x, y, 1)) c = C.ink;
    }
    const o = i * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    if ((t === SHAL || t === DEEP) && landN(x, y, 2) && h < .25) shore.push(x, y, h * 50);
    if (t === DEEP && h < .0009) glints.push(x, y, h * 7000);
  }
  gx.putImageData(img, 0, 0);
}
function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

// ------------------------------------------------------------------ sprites
const PAL = {
  k: INK, b: '#2f6fd8', B: '#1f4a9c', l: '#7cb2f4', y: '#e8b64a', r: '#cf4630', R: '#8f2b22', o: '#ee7d57',
  s: '#f2c79c', w: '#f4f1e8', g: '#c9c6bf', n: '#4a3326', Y: '#f2c230', D: '#c29216', c: '#5f8aa6', C: '#3b5f78',
  G: '#4d8a3f', H: '#2f5f2c', v: '#8a5a34', V: '#5e3b20', x: '#c23b3b'
};
function gridSprite(rows, flip) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = mk(w, h), x = c.getContext('2d');
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i]; if (ch === '.') continue;
      x.fillStyle = PAL[ch]; x.fillRect(flip ? w - 1 - i : i, j, 1, 1);
    }
  });
  return c;
}
const HAT = [
  '......k......', '.....kBk.....', '.....kbBk....', '....kbbBk....', '....klbbBk...',
  '...klbbbBk...', '...klbbbbBk..', '..kyyyyyyyyk.', '.kbbbbbbbbbBk', 'kkBBBBBBBBBkk'];
const BODY = {
  down: ['...ksksksk...', '...ksssssk...', '..kwwwwwwwk..', '.korwwwwwrRk.', '.korrwwwrrRk.',
    'korrrrwrrrRRk', '.korrrrrrrRk.', '.korrrrrrRRk.', 'korrrrrrrrRRk', 'kkkkkkkkkkkkk'],
  up: ['...kgggggk...', '..kgwwwwwgk..', '..korrrrrRk..', '.korrrrrrrRk.', '.korrrrrrrRk.',
    'korrrrrrrrRRk', '.korrrrrrrRk.', '.korrrrrrRRk.', 'korrrrrrrrRRk', 'kkkkkkkkkkkkk'],
  side: ['....kgssksk..', '....kgssssk..', '...kgwwwwwk..', '...korwwwk...', '..korrrrrRk..',
    '..korrrrrrRk.', '..korrrrrrRk.', '.korrrrrrrRk.', '.korrrrrrrRRk', '.kkkkkkkkkkkk']
};
const LEGS = {
  down: ['..knnk.knnk..', '..knnk.......', '.......knnk..'],
  up: ['..knnk.knnk..', '..knnk.......', '.......knnk..'],
  side: ['....knnnk....', '..knnk.knnk..', '....knnk.....']
};
const WIZ = {};
for (const dir of ['down', 'up', 'right', 'left']) {
  const b = dir === 'right' || dir === 'left' ? 'side' : dir;
  WIZ[dir] = [0, 1, 2].map(f => gridSprite(HAT.concat(BODY[b], [LEGS[b][f]]), dir === 'left'));
}
const FISHER = gridSprite(['....kkkkk....', '...kYYYYYk...', '..kYYYYYYDk..', '.kYYYYYYYYDk.', 'kkkkkkkkkkkkk',
  '...ksksksk...', '...ksssssk...', '..kwwwwwwwk..', '.kccwwwwwcCk.', '.kcccwwwccCk.', 'kccccccccccCk',
  '.kcccccccccCk', '.kccccccccCk.', 'kkkkkkkkkkkkk', '..knnk.knnk..']);
const FERRY = gridSprite(['....kkkkk....', '...kGGGGGk...', '..kGGGGGGHk..', '..kkkkkkkkkk.', '...ksksksk...',
  '...ksssssk...', '...kxxxxxk...', '..kvwwwwwVk..', '.kvvwwwwwVVk.', 'ksvvwwwwwVVsk', '.kvvvvvvvVVk.',
  '.kCCCCCCCCCk.', 'kkkkkkkkkkkkk', '..knnk.knnk..']);

function outlinedBlobs(x, blobs, fills) {
  // blobs: [cx,cy,r]; draws ink rim then fills
  x.fillStyle = INK;
  for (const [cx, cy, r] of blobs) { x.beginPath(); x.arc(cx, cy, r + 1.2, 0, 7); x.fill(); }
  blobs.forEach(([cx, cy, r], i) => {
    x.fillStyle = fills[0]; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
    x.fillStyle = fills[1]; x.beginPath(); x.arc(cx - r * .3, cy - r * .35, r * .55, 0, 7); x.fill();
  });
}
function boulderSprite(r) {
  const c = mk(r * 2 + 6, r * 2 + 4), x = c.getContext('2d'), cx = r + 3, cy = r + 2;
  x.fillStyle = 'rgba(20,40,30,.28)'; x.beginPath(); x.ellipse(cx + 1, cy + r * .45, r + 1, r * .5, 0, 0, 7); x.fill();

  // wizard on the path
  const wy = Math.round(h * .84), wx = Math.round(w * .49 + Math.sin(t * .3) * 0);
  const fr = WIZ.up[dusk ? 0 : 1 + (Math.floor(t * 3) % 2)];
  g.fillStyle = INK; g.fillRect(wx + 6, wy - 25, 3, 24); g.fillStyle = '#9a6a3c'; g.fillRect(wx + 7, wy - 24, 1, 22); g.fillStyle = '#e8fbff'; g.fillRect(wx + 6, wy - 28, 3, 3);
  g.drawImage(fr, wx - 6, wy - 20);
  // gulls
  for (let i = 0; i < 9; i++) {
    const gx = (w * .15 + i * 11 + t * 6 + Math.sin(i) * 12) % (w + 40) - 20, gy = h * .16 + (i % 3) * 7 + Math.sin(t + i) * 2;
    g.fillStyle = dusk ? '#20223a' : '#ffffff'; const fl = Math.sin(t * 7 + i) > 0;
    g.fillRect(gx | 0, gy | 0, 2, 1); g.fillRect((gx + 3) | 0, gy | 0, 2, 1); g.fillRect((gx + 2) | 0, (gy + (fl ? 1 : -1)) | 0, 1, 1);
  }
  if (dusk) {
    if (Math.random() < .04) {
      const fx = w * (.2 + Math.random() * .6), fy = h * (.08 + Math.random() * .25), col = ['#ffd36a', '#ff7a8a', '#8fd3ff', '#b6ff8a'][Math.random() * 4 | 0];
      for (let i = 0; i < 26; i++) { const a = i / 26 * 6.28; fireworks.push({ x: fx, y: fy, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, life: 1.4, c: col }); }
      sfx('poof');
    }
    for (const p of fireworks) { p.x += p.vx / 60; p.y += p.vy / 60; p.vy += .5; p.life -= 1 / 60; g.globalAlpha = clamp(p.life, 0, 1); g.fillStyle = p.c; g.fillRect(p.x | 0, p.y | 0, 1, 1); }
    g.globalAlpha = 1; fireworks = fireworks.filter(p => p.life > 0);
  }
}

// ------------------------------------------------------------------ flow
function startGame() {
  if (state.mode !== 'title' && state.mode !== 'ended') return;
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume();
  $('title').hidden = true; $('end').hidden = true; $('hud').hidden = false; $('mute').hidden = false;
  $('fade').style.opacity = 0;
  resetWorld();
  state.startTime = performance.now();
  state.mode = 'play';
  showTouchMaybe();
  say('intro', () => toast('Walk north up the ridge path'));
  showTouchMaybe();
}
function endGame() {
  state.mode = 'ended';
  const secs = Math.round((performance.now() - state.startTime) / 1000);
  $('endStats').textContent = `All five Star Seals returned in ${Math.floor(secs / 60)}m ${secs % 60}s. The lamps of the Keep are lit again.`;
  $('hud').hidden = true; $('end').hidden = false; $('touch').hidden = true;
  $('fade').style.transition = 'opacity 1.2s'; $('fade').style.opacity = 0;
  setTimeout(() => $('again').focus(), 50);
}
$('start').addEventListener('click', startGame);
$('again').addEventListener('click', () => { $('fade').style.transition = ''; startGame(); });

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  update(dt);
  if (state.mode === 'title') { state.t += 0; drawVista(now / 1000, false); }
  else if (state.mode === 'ended') drawVista(now / 1000, true);
  else drawWorld();
  requestAnimationFrame(frame);
}

function boot(data) {
  buildTerrain();
  paintGround();
  placeWorld();
  resetWorld();
  if (data && data.mode === 'play') {
    resetWorld(data);
    $('title').hidden = true; $('hud').hidden = false; $('mute').hidden = false;
    state.mode = 'play'; state.startTime = performance.now() - (data.elapsed || 0);
  }
  window.claude?.hot?.snapshot?.(() => ({
    mode: state.mode === 'dialog' ? 'play' : state.mode,
    shards: shards.map(s => s.got), brambles: objs.map((o, i) => o.gone ? i : -1).filter(i => i >= 0),
    crabs: crabs.map(c => c.dead), px: player.x, py: player.y, hearts: state.hearts, talked: state.talked,
    elapsed: performance.now() - state.startTime
  }));
  window.__game = { state, player, shards, objs, T, tAt, SHARD_SPOTS: () => SHARD_SPOTS, crabs: () => crabs, ground };
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
