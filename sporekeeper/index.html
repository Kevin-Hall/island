<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sporekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: the grotto fills the screen as a fixed diorama; brand + dew top-left, books top-right, conditions and keeper's note float over it; everything interactive lives in a bottom sheet or a tall side panel. */
:root {
  --night: #0a1628;
  --glass: rgba(11, 25, 44, 0.88);
  --glass-2: rgba(22, 42, 66, 0.9);
  --ink: #e3ecea;
  --muted: #8fa7b0;
  --rule: rgba(227, 236, 234, 0.12);
  --amber: #ffb36b;
  --cyan: #35f2e0;
  --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
canvas.scene { display: block; touch-action: none; position: fixed; inset: 0; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(3, 8, 16, 0.75) 100%); }
button { font: 600 14px/1 var(--body); color: var(--ink); background: var(--glass-2); border: 1px solid var(--rule); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
button:hover:not(:disabled) { border-color: rgba(227, 236, 234, 0.35); }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button.primary { background: var(--amber); color: #2a1a08; border-color: transparent; }
.num { font-variant-numeric: tabular-nums; }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.brand h1 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: 0.01em; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
.dew { margin-top: 6px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--glass); border: 1px solid var(--rule); font-weight: 600; }
.dew i { width: 10px; height: 13px; background: var(--cyan); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: 0 0 10px var(--cyan); }
nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
nav button { background: var(--glass); }
#conds { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); right: 16px; display: flex; gap: 8px; }
#conds button { padding: 7px 12px; font-size: 13px; background: var(--glass); display: inline-flex; align-items: center; gap: 6px; }
#conds button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
#conds button[aria-pressed="true"] { border-color: rgba(53, 242, 224, 0.6); }
#conds button[aria-pressed="true"] .dot { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
#conds button.locked { color: var(--muted); }
#note { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); max-width: min(460px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 14px; background: var(--glass); border: 1px solid var(--rule); font-size: 14px; text-align: center; }
#note b { font: 600 11px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); display: block; margin-bottom: 4px; }

#labels { position: fixed; inset: 0; pointer-events: none; }
.lbl { position: absolute; transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 999px; background: var(--glass); border: 1px solid var(--rule); font: 600 12px/1.2 var(--body); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lbl.ready { border-color: var(--amber); color: var(--amber); }
.lbl.locked { color: var(--muted); }

#sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(560px, 100vw); max-height: 72vh; overflow: auto; box-sizing: border-box; padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 20px); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--rule); border-bottom: 0; border-radius: 20px 20px 0 0; }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); overflow: auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-left: 1px solid var(--rule); }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.head h2 { margin: 0; font: 700 24px/1.15 var(--display); text-wrap: balance; }
.head .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.x { padding: 6px 11px; font-size: 16px; }
h3 { margin: 18px 0 8px; font: 600 11.5px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.new { display: inline-block; margin-top: 6px; padding: 3px 9px; border-radius: 999px; background: var(--cyan); color: #04201d; font: 700 11px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.trait { padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--rule); min-width: 0; }
.trait .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.trait .v { font-weight: 600; }
.trait .n { font-size: 12.5px; color: var(--muted); }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.row canvas { width: 48px; height: 48px; }
.row .t { font-weight: 600; }
.row .d { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.chip[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); }
.bar { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin: 10px 0 4px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--cyan)); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.muted { color: var(--muted); font-size: 13.5px; }
.cross { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.cross canvas { width: 64px; height: 64px; }
.cross .times { font: 700 22px/1 var(--display); color: var(--muted); }
.outcome { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 10px; font-size: 14px; }
.outcome dt { color: var(--muted); }
.outcome dd { margin: 0; }
.hint { padding: 10px 12px; border-left: 2px solid var(--cyan); background: rgba(53, 242, 224, 0.05); font-family: var(--display); font-style: italic; margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.card { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: 10px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--rule); text-align: center; min-width: 0; }
.card canvas { width: 56px; height: 56px; }
.card .t { font-size: 12px; font-weight: 600; line-height: 1.2; }
.card.unk .t { color: var(--muted); font-weight: 500; }
.progress { font: 700 34px/1 var(--display); }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 110px); transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: var(--glass); border: 1px solid rgba(53, 242, 224, 0.5); font-weight: 600; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
@media (max-width: 640px) {
  .brand h1 { font-size: 21px; }
  #conds { top: calc(env(safe-area-inset-top, 0px) + 92px); right: auto; left: 16px; }
  #toast { top: calc(env(safe-area-inset-top, 0px) + 136px); }
  #note { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 13px; }
  nav button { padding: 8px 11px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }

<body>
<div id="vignette"></div>
<div id="labels"></div>
<header id="hud">
  <div class="brand"><h1>Sporekeeper</h1><div class="dew" title="Dew"><i></i><span class="num" id="dew-n">0</span> dew</div></div>
  <nav>
    <button id="btn-pedia">Fungepedia <span class="num" id="pedia-n">0/120</span></button>
    <button id="btn-shop">Supplies</button>
  </nav>
</header>
<div id="conds">
  <button id="c-mist" aria-pressed="false"><span class="dot"></span><span>Mist</span></button>
  <button id="c-moon" aria-pressed="false"><span class="dot"></span><span>Moonlight</span></button>
</div>
<div id="note" aria-live="polite"></div>
<section id="sheet" hidden aria-live="polite"></section>
<section id="panel" hidden></section>
<div id="toast" role="status"></div>

<script type="module">
import * as THREE from 'three';

/* ============================== data ============================== */
const COLORS = [
  { n: 'Ivory', hex: '#efe6cf' }, { n: 'Crimson', hex: '#ff4a5c' }, { n: 'Azure', hex: '#3a9dff' },
  { n: 'Violet', hex: '#b65cff' }, { n: 'Amber', hex: '#ffae2b' }, { n: 'Cyan', hex: '#2ff0dc' },
];
const SHAPES = ['Button', 'Bell', 'Parasol', 'Spire', 'Trumpet'];
const STEMS = ['Slender', 'Stout', 'Twisted', 'Clustered'];
const SPECIALS = ['', 'Glowing', 'Fragrant', 'Giant'];
const SPECIAL_TRAIT = ['None', 'Glow', 'Scent', 'Giant size'];
const SOILS = {
  loam: { n: 'Loam', hex: '#4a3424', price: 0, desc: 'Plain forest loam.' },
  acid: { n: 'Acidic', hex: '#3a4a2a', price: 30, desc: 'Sour, needle-strewn soil.' },
  ash: { n: 'Ash', hex: '#5d5c63', price: 30, desc: 'Fine grey ash from old fires.' },
  peat: { n: 'Peat', hex: '#211915', price: 40, desc: 'Dark, rich and waterlogged.' },
};
// two different colour genes blend into a rare colour only in the right soil
const MIX = { '1+2': { color: 3, soil: 'acid' }, '0+1': { color: 4, soil: 'ash' }, '0+2': { color: 5, soil: 'peat' } };
const NEED = { 1: 'moon', 2: 'mist', 3: 'peat' };
const NEED_TEXT = { 1: 'only shows under the moonlight lamp', 2: 'only shows in mist', 3: 'only shows in peat soil' };
const TOTAL = COLORS.length * SHAPES.length * SPECIALS.length;
const PRICES = { plots: [0, 0, 0, 25, 45, 80], mist: 35, moon: 60, boost: 8, wild: 12 };
const GLIMMER_EVERY = 180e3, SAVE_KEY = 'sporekeeper-v1';

const keyOf = p => `${p.color}-${p.shape}-${p.special}`;
const nameOf = p => [SPECIALS[p.special], COLORS[p.color].n, SHAPES[p.shape]].filter(Boolean).join(' ');
const pickOf = (a, b) => (Math.random() < 0.5 ? a : b);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
// first breeds are quick so the loop teaches itself, then settle toward ~6 minutes
const growDuration = n => Math.round(Math.min(360, 60 * Math.pow(1.2, n)) * 1000);

/* genotype: { c: [colourGene, colourGene], shape, stem, special }
   phenotype (what grows): { color, shape, stem, special, hidden, speckled } */
function express(geno, soil, cond) {
  const [a, b] = geno.c;
  let color = a;
  if (a !== b) {
    const mix = MIX[[a, b].sort((x, y) => x - y).join('+')];
    color = mix && mix.soil === soil ? mix.color : pickOf(a, b);
  }
  const s = geno.special, need = NEED[s];
  const ok = !s || (need === 'peat' ? soil === 'peat' : cond[need]);
  return { color, shape: geno.shape, stem: geno.stem, special: ok ? s : 0, hidden: ok ? 0 : s, speckled: a !== b };
}
// the genes a grown mushroom passes on: rare colours breed true
const breedGenes = (geno, ph) => ({ c: ph.color >= 3 ? [ph.color, ph.color] : geno.c.slice(), shape: geno.shape, stem: geno.stem, special: geno.special });
function crossGenes(A, B) {
  const mut = (v, n) => (Math.random() < 0.06 ? Math.floor(Math.random() * n) : v);
  return {
    c: [pickOf(A.c[0], A.c[1]), pickOf(B.c[0], B.c[1])],
    shape: mut(pickOf(A.shape, B.shape), SHAPES.length),
    stem: mut(pickOf(A.stem, B.stem), STEMS.length),
    special: mut(pickOf(A.special, B.special), SPECIALS.length),
  };
}
function crossOutcomes(A, B) {
  const colors = new Map();
  for (const x of A.c) for (const y of B.c) {
    colors.set(x, colors.get(x) || null); colors.set(y, colors.get(y) || null);
    const mix = x !== y && MIX[[x, y].sort((p, q) => p - q).join('+')];
    if (mix) colors.set(mix.color, mix.soil);
  }
  const shapes = [...new Set([A.shape, B.shape])], stems = [...new Set([A.stem, B.stem])], specials = [...new Set([A.special, B.special])];
  let fresh = 0;
  const seen = new Set();
  for (const [c] of colors) for (const sh of shapes) for (const sp of new Set([...specials, 0])) {
    const k = keyOf({ color: c, shape: sh, special: sp });
    if (!seen.has(k)) { seen.add(k); if (!state.discovered.includes(k)) fresh++; }
  }
  return { colors, shapes, stems, specials, fresh };
}
const dewFor = p => 3 + (p.color >= 3 ? 4 : 0) + (p.special ? 3 : 0) + (p.shape >= 3 ? 2 : 0) + (p.stem >= 2 ? 1 : 0);

/* ============================== state + save ============================== */
const STARTERS = [
  { c: [1, 1], shape: 0, stem: 1, special: 0 },
  { c: [2, 2], shape: 1, stem: 0, special: 1 },
  { c: [0, 0], shape: 2, stem: 2, special: 2 },
];
function freshState() {
  const now = Date.now(), cond = { mist: false, moon: false };
  const grown = (geno, k) => {
    const ph = express(geno, 'loam', cond);
    return { geno, ph, bg: breedGenes(geno, ph), plantedAt: now - 60000, dur: 30000, matured: true, crossed: false, wasNew: false, cond: { soil: 'loam', ...cond } };
  };
  const plots = PRICES.plots.map((_, k) => ({ unlocked: k < 3, soil: 'loam', plant: null }));
  plots[0].plant = grown(STARTERS[0]); plots[1].plant = grown(STARTERS[1]);
  return {
    dew: 10, plots,
    spores: [{ geno: STARTERS[2], label: nameOf(express(STARTERS[2], 'loam', { mist: true })), n: 2, hybrid: false }],
    discovered: [keyOf(plots[0].plant.ph), keyOf(plots[1].plant.ph)],
    owned: { soils: ['loam'], mist: false, moon: false }, cond,
    plantings: 0, glimmers: 1, glimmerAt: now,
    stats: { crosses: 0, hybridPlanted: 0, hybridMatured: 0, harvests: 0, bought: 0 },
  };
}
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && Array.isArray(s.plots)) return s; } catch { /* no storage: fresh start */ }
  return null;
}
let state = loadState() || freshState();
const firstVisit = !loadState();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch { /* storage unavailable: progress lasts this visit */ } }

/* ============================== renderer ============================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.className = 'scene';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1628');
scene.fog = new THREE.FogExp2('#0a1628', 0.042);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);

const hemi = new THREE.HemisphereLight('#3f7d8f', '#070b12', 1.1);
const lantern = new THREE.DirectionalLight('#ffb36b', 1.6);
lantern.position.set(-4, 9, 9); lantern.target.position.set(0, 0, 2.5);
lantern.castShadow = true; lantern.shadow.mapSize.set(1024, 1024);
Object.assign(lantern.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 });
lantern.shadow.bias = -0.0006; lantern.shadow.normalBias = 0.02;
const moonLight = new THREE.DirectionalLight('#7fa6ff', 0.2);
moonLight.position.set(3, 12, -6);
const falls = new THREE.PointLight('#5fb8ff', 18, 16, 1.6);
falls.position.set(0, 3, -8.2);
scene.add(hemi, lantern, lantern.target, moonLight, falls);

/* seeded noise so the grotto is always the same place */
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const NT = Array.from({ length: 64 * 64 }, rnd);
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (a, b) => NT[(((a % 64) + 64) % 64) + (((b % 64) + 64) % 64) * 64];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(g(xi, yi), g(xi + 1, yi), u), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), u), v);
}

/* soft round sprite texture shared by halos, motes and mist */
function radialTex(inner = 0.0) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, inner * 32, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SOFT = radialTex();

/* ============================== grotto ============================== */
const ZONE_DEG = [150, 30, 190, 350, 228, 312]; // one zone per colour; rare colours sit by the falls
const zones = COLORS.map((c, k) => ({ color: k, theta: ZONE_DEG[k] * Math.PI / 180, target: 0, shown: 0 }));
const zoneHealth = k => { const n = state.discovered.filter(s => +s.split('-')[0] === k).length; return n ? 0.3 + 0.7 * n / (SHAPES.length * SPECIALS.length) : 0; };
const angDist = (a, b) => { const d = Math.abs(a - b) % (Math.PI * 2); return d > Math.PI ? Math.PI * 2 - d : d; };

// floor: a shallow bowl that rises into the walls, vertex-coloured per zone
const floorGeo = new THREE.PlaneGeometry(28, 28, 72, 72).rotateX(-Math.PI / 2);
const fp = floorGeo.attributes.position, fInfo = [];
for (let v = 0; v < fp.count; v++) {
  const x = fp.getX(v), z = fp.getZ(v), r = Math.hypot(x, z), th = Math.atan2(z, x);
  const y = (vnoise(x * 0.6 + 20, z * 0.6 + 20) - 0.5) * 0.25 + smooth(8.8, 12.5, r) * 3.2 + (vnoise(x * 1.7, z * 1.7) - 0.5) * smooth(9, 12, r) * 1.2;
  fp.setY(v, y);
  const pool = Math.hypot(x, z + 8.3) < 2.4;
  if (pool) fp.setY(v, -0.25);
  let zone = 0, zd = 9;
  zones.forEach((zn, k) => { const d = angDist(th, zn.theta); if (d < zd) { zd = d; zone = k; } });
  const keeper = th > 0.62 && th < 2.52 && r > 2.6 && r < 6.6;
  fInfo.push({ r, zone, fall: 1 - smooth(0.25, 0.55, zd) * 0.6, keeper, pool, n: vnoise(x * 2.3, z * 2.3) });
}
floorGeo.computeVertexNormals();
floorGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(fp.count * 3), 3));
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
floor.receiveShadow = true;
scene.add(floor);
const DEAD = new THREE.Color('#3a4049'), ALIVE = new THREE.Color('#2f6b47'), KEEP = new THREE.Color('#3a3326'), ROCK = new THREE.Color('#151c26'), POOL = new THREE.Color('#0d2c44');
function paintFloor() {
  const col = floorGeo.attributes.color, c = new THREE.Color(), zc = new THREE.Color();
  fInfo.forEach((f, v) => {
    if (f.pool) c.copy(POOL);
    else if (f.keeper) c.copy(KEEP).lerp(ALIVE, 0.25 + f.n * 0.3);
    else {
      const h = zones[f.zone].shown * f.fall;
      c.copy(DEAD).lerp(ALIVE, h).lerp(zc.set(COLORS[f.zone].hex), h * 0.12);
      if (f.r < 2.6) c.copy(DEAD).lerp(ALIVE, 0.35);
    }
    c.lerp(ROCK, smooth(8.6, 11, f.r)).offsetHSL(0, 0, (f.n - 0.5) * 0.04);
    col.setXYZ(v, c.r, c.g, c.b);
  });
  col.needsUpdate = true;
}

    x.translate(ph.stem === 2 ? 1 : 0, -stemH + 1);

    const gr = x.createLinearGradient(0, -24, 0, 2);
    gr.addColorStop(0, silhouette ? capCol : new THREE.Color(hex).lerp(new THREE.Color('#ffffff'), 0.35).getStyle()); gr.addColorStop(1, capCol);
    x.fillStyle = gr; x.beginPath();

    else if (ph.shape === 1) { x.moveTo(-14, 1); x.bezierCurveTo(-13, -8, -11, -22, 0, -22); x.bezierCurveTo(11, -22, 13, -8, 14, 1); x.closePath(); }

function hints() {
  const out = [], all = [];
  for (let c = 0; c < COLORS.length; c++) for (let s = 0; s < SHAPES.length; s++) for (let sp = 0; sp < SPECIALS.length; sp++) {
    const p = { color: c, shape: s, special: sp };
    if (!state.discovered.includes(keyOf(p))) all.push(p);
  }
  const knownShapes = new Set(state.discovered.map(k => +k.split('-')[1]));
  const pool = all.filter(p => knownShapes.has(p.shape)).sort((a, b) => (a.color * 7 + a.shape * 3 + a.special * 11 + state.discovered.length) % 13 - (b.color * 7 + b.shape * 3 + b.special * 11 + state.discovered.length) % 13);
  const where = { 3: 'where Crimson and Azure blood mingle in acidic soil', 4: 'where Crimson meets Ivory in the ash', 5: 'where Azure meets Ivory deep in the peat' };
  const how = { 1: 'glowing under the moon', 2: 'breathing sweet scent into the mist', 3: 'grown giant in wet peat' };
  for (const p of pool) {
    if (out.length >= 3) break;
    const cn = COLORS[p.color].n.toLowerCase();
    const bits = [`${/^[aeiou]/.test(cn) ? 'An' : 'A'} ${cn} ${SHAPES[p.shape].toLowerCase()}`];
    if (p.special) bits.push(how[p.special]);
    if (p.color >= 3) bits.push(where[p.color]);
    if (bits.length > 1 || out.length < 1) out.push(bits.join(', ') + ', has been sighted in the old grotto.');
  }
  if (!state.discovered.some(k => +k.split('-')[1] >= 3)) out.push('Tall spires and trumpet caps grew here once. The falls still wash their spores into the pool.');
  return out.slice(0, 3);
}

const bursts = [];

    s.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 1.6, 1 + Math.random() * 2, (Math.random() - 0.5) * 1.6), life: 1.2 + Math.random() * 0.6 };

const parallax = new THREE.Vector2();

function camBase() {
  // portrait phones get a wider lens aimed nearer the plots; landscape sees the whole grotto
  const a = innerWidth / innerHeight, portrait = a < 1;
  camera.fov = portrait ? 50 : 42; camera.updateProjectionMatrix();
  lookAt.set(0, portrait ? 0.6 : 1.3, portrait ? 2.2 : -1.6);
  const k = a < 0.6 ? 0.95 : a < 1 ? 0.9 : a < 1.4 ? 1.15 : 1;
  return new THREE.Vector3(0, lookAt.y + 8.9 * k, lookAt.z + 16.2 * k);
}
let base = camBase();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); base = camBase(); });

const clock = new THREE.Clock();

function checkMaturity(offline) {
  const now = Date.now(), fresh = [];
  state.plots.forEach((p, k) => {
    const pl = p.plant;
    if (!pl || pl.matured || now < pl.plantedAt + pl.dur) return;
    pl.matured = true;
    if (pl.hybridOf) state.stats.hybridMatured++;
    const key = keyOf(pl.ph);
    if (!state.discovered.includes(key)) { state.discovered.push(key); pl.wasNew = true; fresh.push(nameOf(pl.ph)); zones[pl.ph.color].target = zoneHealth(pl.ph.color); }
    if (!offline) sporeBurst(plotObjs[k].g.position, COLORS[pl.ph.color].hex, pl.wasNew ? 30 : 12);
  });
  if (fresh.length) toast(offline ? `While you were away: ${fresh.join(', ')} ${fresh.length > 1 ? 'were' : 'was'} discovered` : `New species: ${fresh[0]}. The grotto stirs.`, 3600);
  if (fresh.length || offline) { save(); renderHud(); }
  if (sheetFor !== null && !sheet.hidden && fresh.length) openPlot(sheetFor);
}
function tickGlimmer() {
  const now = Date.now();
  while (state.glimmers < 2 && now - state.glimmerAt >= GLIMMER_EVERY) { state.glimmers++; state.glimmerAt += GLIMMER_EVERY; }
  if (state.glimmers >= 2) state.glimmerAt = now;
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, now = Date.now();

  // camera: gentle drift plus a touch of pointer parallax
  const drift = reduced ? 0 : 1;
  camera.position.set(base.x + Math.sin(t * 0.07) * 0.7 * drift + parallax.x * 0.8, base.y + Math.sin(t * 0.11) * 0.25 * drift - parallax.y * 0.4, base.z);
  camera.lookAt(lookAt);

  // conditions
  const moon = state.cond.moon, mistOn = state.cond.mist;
  lantern.intensity = lerp(lantern.intensity, moon ? 0.55 : 1.6, dt * 2);
  moonLight.intensity = lerp(moonLight.intensity, moon ? 1.1 : 0.2, dt * 2);
  hemi.intensity = lerp(hemi.intensity, moon ? 0.85 : 1.1, dt * 2);
  fogTarget = mistOn ? 0.058 : 0.042;
  scene.fog.density = lerp(scene.fog.density, fogTarget, dt * 2);
  mist.material.opacity = lerp(mist.material.opacity, mistOn ? 0.1 : 0, dt * 2);

  // healing zones ease toward their target
  let repaint = false;
  zones.forEach(zn => { if (Math.abs(zn.target - zn.shown) > 0.002) { zn.shown = lerp(zn.shown, zn.target, 1 - Math.exp(-dt * 1.2)); applyZone(zn); repaint = true; } });
  if (repaint) paintFloor();

  // plots
  let glowIdx = 0;
  plotObjs.forEach((o, k) => {
    const p = state.plots[k], pl = p.plant;
    o.ring.material.emissiveIntensity = lerp(o.ring.material.emissiveIntensity, hoverPlot === k ? 0.35 : 0, dt * 8);
    if (o.model && pl) {
      const g = clamp((now - pl.plantedAt) / pl.dur, 0, 1), e = smooth(0, 1, g), u = o.model.userData;
      let s = lerp(0.15, 1, e) * u.giant;
      if (o.pop > 0) { o.pop -= dt; s *= o.pop > 0.2 ? 1.2 : Math.max(0, o.pop / 0.2); }
      o.model.scale.setScalar(s);
      u.caps.forEach(c => c.scale.set(0.34 * lerp(0.5, 1, e), 0.34 * lerp(1.7, 1, e), 0.34 * lerp(0.5, 1, e)));
      o.model.rotation.z = reduced ? 0 : Math.sin(t * 1.3 + k * 1.7) * 0.035;
      o.model.rotation.x = reduced ? 0 : Math.sin(t * 0.9 + k) * 0.02;
      const mature = g >= 1;
      if (u.halo) u.halo.material.opacity = mature ? 0.6 + Math.sin(t * 2 + k) * 0.12 : 0.15 * e;
      if (pl.ph.special === 1) u.capMat.emissiveIntensity = (mature ? 0.75 : 0.3) + Math.sin(t * 2 + k) * 0.12;
      u.scent.forEach(sp => {
        sp.userData.t = (sp.userData.t + dt * 0.25) % 1; const q = sp.userData.t;
        sp.position.set(Math.sin(q * 9 + k) * 0.25, 0.8 + q * 1.4, Math.cos(q * 7) * 0.2);
        sp.scale.setScalar(0.1 + q * 0.25); sp.material.opacity = mature ? Math.sin(q * Math.PI) * 0.6 : 0;
      });
      if (mature && pl.ph.special === 1 && glowIdx < glowLights.length) {
        const l = glowLights[glowIdx++]; o.g.getWorldPosition(tmp); l.position.set(tmp.x, 1, tmp.z); l.color.set(COLORS[pl.ph.color].hex); l.intensity = 5;
      }
    }
    // floating label
    o.g.getWorldPosition(tmp); tmp.y += pl ? 1.25 * (o.model?.userData.giant || 1) : 0.9; tmp.project(camera);
    const L = labels[k];
    L.style.left = ((tmp.x + 1) / 2 * innerWidth) + 'px'; L.style.top = ((1 - tmp.y) / 2 * innerHeight) + 'px';
    let text = '', cls = 'lbl';
    if (!p.unlocked) { text = state.plots.slice(0, k).some(q => !q.unlocked) ? '' : `Clear · ${PRICES.plots[k]} dew`; cls += ' locked'; }
    else if (!pl) text = 'Plant';
    else if (now < pl.plantedAt + pl.dur) text = fmtTime(pl.plantedAt + pl.dur - now);
    else { text = pl.wasNew ? 'New!' : pl.crossed ? 'Ready · crossed' : 'Ready'; cls += ' ready'; }
    L.className = cls; L.textContent = text; L.hidden = !text;
  });
  for (let n = glowIdx; n < glowLights.length; n++) glowLights[n].intensity = 0;

  // once a second: maturity, glimmer, open sheet timer
  if (t - lastSec > 1) {
    lastSec = t; checkMaturity(false); tickGlimmer();
    const left = $('grow-left');
    if (left && sheetFor !== null) { const pl = state.plots[sheetFor].plant; if (pl) left.textContent = `${fmtTime(pl.plantedAt + pl.dur - now)} left · planted in ${conditionsText(pl.cond)}`; }
  }

  // glimmer
  glimmer.visible = state.glimmers > 0;
  glimmer.material.opacity = 0.6 + Math.sin(t * 3) * 0.3;
  glimmer.scale.setScalar(0.7 + Math.sin(t * 2.2) * 0.12 + state.glimmers * 0.15);

  // waterfall, spray, motes, mist
  fallMat.uniforms.t.value = t;
  spray.forEach((s, k) => { s.userData.t = (s.userData.t + dt * 0.15) % 1; const q = s.userData.t; s.position.set(Math.sin(k * 2.4) * 1.4 * (0.4 + q), 0.2 + q * 1.8, -9.6 + q * 1.2); s.scale.setScalar(1 + q * 2.5); });
  sprayMat.opacity = 0.14 + Math.sin(t * 0.7) * 0.03;
  if (!reduced) {
    const mp = motes.geometry.attributes.position;
    for (let k = 0; k < mp.count; k++) { let y = mp.getY(k) + dt * (0.12 + (k % 5) * 0.03); if (y > 5.5) y = 0; mp.setY(k, y); mp.setX(k, mp.getX(k) + Math.sin(t * 0.5 + k) * dt * 0.05); }
    mp.needsUpdate = true;
    mist.rotation.y += dt * 0.02;
  }
  for (let k = bursts.length - 1; k >= 0; k--) {
    const s = bursts[k], u = s.userData; u.life -= dt; u.v.y -= dt * 0.8; u.v.multiplyScalar(1 - dt * 0.9);
    s.position.addScaledVector(u.v, dt); s.scale.setScalar(0.18 * Math.max(0, u.life));
    if (u.life <= 0) { scene.remove(s); bursts.splice(k, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ============================== boot ============================== */
state.plots.forEach((_, k) => syncPlot(k));
zones.forEach((zn, k) => { zn.target = zoneHealth(k); zn.shown = zn.target; applyZone(zn); });
paintFloor();
tickGlimmer();
checkMaturity(true);
renderHud();
camera.position.copy(base);
frame();
setTimeout(() => toast(firstVisit ? 'The grotto is fading. Breed its lost species to bring it back.' : 'Welcome back, keeper.', 3600), 500);
</script>
</body>
</html>
